groups:
- name: orphan-pvc
  rules:
  - alert: KubeDetectOrphanPvc
    annotations:
      description: '{{ if eq $value 1.0 }}**1 PVC**{{ else }}**{{ $value }} PVCs**{{ end }}{{ if $labels.cluster }} on cluster **{{ $labels.cluster }}**{{ end }}{{ if eq $value 1.0 }} has{{ else }} have{{ end }} been Bound but not mounted by any Pod for at least 1 hour.{{ if eq $value 1.0 }} It may be an orphaned volume{{ else }} They may be orphaned volumes{{ end }} consuming storage unnecessarily. Orphaned {{ if eq $value 1.0 }}PVC{{ else }}PVCs{{ end }}: {{ range $i, $r := query (printf "group by (cluster, namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{phase=\"Bound\",cluster=\"%s\"} == 1 unless on(persistentvolumeclaim, namespace) kube_pod_spec_volumes_persistentvolumeclaims_info) and on(namespace) label_replace(argocd_app_info{project=\"kubeaid\"}, \"namespace\", \"$1\", \"dest_namespace\", \"(.*)\")" $labels.cluster) | sortByLabel "persistentvolumeclaim" | sortByLabel "namespace" }}{{ if $i }}, {{ end }}`{{ $r.Labels.namespace }}/{{ $r.Labels.persistentvolumeclaim }}`{{ end }}.'
      summary: PersistentVolumeClaims are bound but not used by any Pod.
    expr: |
      count by (cluster) (
        group by (cluster, namespace, persistentvolumeclaim) (
          kube_persistentvolumeclaim_status_phase{phase="Bound"} == 1
          unless on(persistentvolumeclaim, namespace)
          kube_pod_spec_volumes_persistentvolumeclaims_info
        )
        and on(namespace) label_replace(argocd_app_info{project="kubeaid"}, "namespace", "$1", "dest_namespace", "(.*)")
      ) > 0
    for: 1h
    labels:
      severity: warning
