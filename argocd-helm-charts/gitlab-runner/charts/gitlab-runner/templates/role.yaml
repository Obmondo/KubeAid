{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.rbac.clusterWideAccess }}"ClusterRole"{{ else }}"Role"{{ end }}
metadata:
  name: {{ include "gitlab-runner.fullname" . }}
  labels:
    app: {{ include "gitlab-runner.fullname" . }}
    chart: {{ include "gitlab-runner.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
  {{ if not .Values.rbac.clusterWideAccess -}}
  namespace: {{ coalesce .Values.runners.jobNamespace .Values.namespace .Release.Namespace | quote }}
  {{- end }}
rules:
{{- if .Values.rbac.podSecurityPolicy.enabled }}
- apiGroups: ['policy']
  resources: ['podsecuritypolicies']
  verbs:     ['use']
  resourceNames:
{{ toYaml .Values.rbac.podSecurityPolicy.resourceNames | indent 2 }}
{{- end }}
{{- if empty .Values.rbac.rules }}
- apiGroups: [""]
  resources: {{ (list "*") | toJson }}
  verbs: {{ (list "*") | toJson }}
{{- end -}}
{{ range $i, $rule := .Values.rbac.rules }}
{{- if not (kindIs "map" $rule) }}{{ fail (printf "rbac.rules[%v] must be a map with the keys apiGroups, resources and verbs." $i) }}{{ end }}
{{- if $rule.nonResourceURLs }}{{ fail (printf "rbac.rules[%v] sets nonResourceURLs, which the chart does not render. Delete the rule, not only the key, and grant the URLs with your own ClusterRole and ClusterRoleBinding." $i) }}{{ end }}
{{- if $rule.resourceNames }}{{ fail (printf "rbac.rules[%v] sets resourceNames, which the chart does not render. To grant by name, set rbac.create to false and serviceAccount.create to true, and bind your own Role or ClusterRole to that service account." $i) }}{{ end }}
{{- /* resourceNames and nonResourceURLs are allowed here because the checks above handle them. Empty values are ignored. */}}
{{- $allowed := list "apiGroups" "resources" "verbs" "resourceNames" "nonResourceURLs" }}
{{- $unknown := list }}
{{- range $key, $_ := $rule }}{{ if not (has $key $allowed) }}{{ $unknown = append $unknown $key }}{{ end }}{{ end }}
{{- if $unknown }}{{ fail (printf "rbac.rules[%v] sets the unsupported keys %s. The chart renders only apiGroups, resources and verbs." $i (join ", " $unknown)) }}{{ end }}
- apiGroups: {{ (default (list "") .apiGroups) | toJson }}
  resources: {{ (default (list "*") .resources) | toJson }}
  verbs: {{ (default (list "*") .verbs) | toJson }}
{{- end }}
{{- end -}}
