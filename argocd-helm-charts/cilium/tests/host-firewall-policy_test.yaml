suite: host firewall policy
templates:
  - templates/host-firewall-policy.yaml
release:
  name: cilium
  namespace: cilium

tests:
  - it: renders no policy when hostNetworkPolicy is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no DHCP rule when dhcpServerCIDRs is unset
    set:
      hostNetworkPolicy.enabled: true
    asserts:
      - notExists:
          path: spec.ingress[?(@.toPorts[0].ports[0].port == "68")]

  # A node whose address comes from DHCP (Hetzner Cloud private network) re-runs
  # the exchange from scratch whenever systemd-networkd restarts. The server's
  # unicast reply has no conntrack entry then, so without this rule it is dropped
  # and the node loses its only address when the lease runs out.
  - it: allows DHCP replies (UDP 68) from each dhcpServerCIDRs entry, bare IPs as /32
    set:
      hostNetworkPolicy.enabled: true
      hostNetworkPolicy.dhcpServerCIDRs:
        - 10.0.0.1
        - 172.16.0.0/24
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromCIDR:
              - 10.0.0.1/32
              - 172.16.0.0/24
            toPorts:
              - ports:
                  - port: "68"
                    protocol: UDP
          count: 1

  - it: renders no private-network rule when privateCIDRs is unset
    set:
      hostNetworkPolicy.enabled: true
    asserts:
      - notContains:
          path: spec.ingress
          content:
            fromCIDR:
              - 10.0.1.0/24
          any: true

  # A node on the private L2 sends tunnel and kubelet traffic from its address
  # there before the CCM publishes it as an InternalIP; until then the identity
  # rule does not match it and the policy drops it as world.
  - it: allows all ports from each privateCIDRs entry, bare IPs as /32
    set:
      hostNetworkPolicy.enabled: true
      hostNetworkPolicy.privateCIDRs:
        - 10.0.1.0/24
        - 10.0.2.1
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromCIDR:
              - 10.0.1.0/24
              - 10.0.2.1/32
          count: 1
