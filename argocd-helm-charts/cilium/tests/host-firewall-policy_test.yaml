suite: host firewall policy
templates:
  - templates/host-firewall-policy.yaml
release:
  name: cilium
  namespace: cilium

tests:
  - it: renders no policy when hostNetworkPolicy is disabled
    asserts:
      - hasDocuments:
          count: 0

  # A node whose address comes from DHCP (Hetzner Cloud private network) re-runs
  # the exchange from scratch whenever systemd-networkd restarts. The server's
  # unicast reply has no conntrack entry then, so without this rule it is dropped
  # and the node loses its only address when the lease runs out. Clusters that
  # never set dhcpServerCIDRs must still get the rule.
  - it: allows DHCP replies (UDP 68) from the world by default
    set:
      hostNetworkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromEntities:
              - world
            toPorts:
              - ports:
                  - port: "68"
                    protocol: UDP
          count: 1

  - it: renders no DHCP rule when allowDhcpReplies is false
    set:
      hostNetworkPolicy.enabled: true
      hostNetworkPolicy.allowDhcpReplies: false
      hostNetworkPolicy.dhcpServerCIDRs:
        - 10.0.0.1
    asserts:
      - notExists:
          path: spec.ingress[?(@.toPorts[0].ports[0].port == "68")]

  - it: allows DHCP replies (UDP 68) from each dhcpServerCIDRs entry, bare IPs as /32
    set:
      hostNetworkPolicy.enabled: true
      hostNetworkPolicy.dhcpServerCIDRs:
        - 10.0.0.1
        - 172.16.0.0/24
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromCIDR:
              - 10.0.0.1/32
              - 172.16.0.0/24
            toPorts:
              - ports:
                  - port: "68"
                    protocol: UDP
          count: 1
      - notContains:
          path: spec.ingress
          content:
            fromEntities:
              - world
            toPorts:
              - ports:
                  - port: "68"
                    protocol: UDP
