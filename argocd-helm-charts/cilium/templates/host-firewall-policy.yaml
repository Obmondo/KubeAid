{{- if .Values.hostNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kubeaid-host-firewall
spec:
  nodeSelector:
    matchLabels: {}
  ingress:
    # Allow all cluster-internal traffic by identity: node↔node etcd/kubelet,
    # pods, kube-apiserver probes, cilium health checks, and localhost.
    # This rule must come first to prevent cluster-internal lockout.
    - fromEntities:
        - host
        - remote-node
        - health
        - cluster
        - kube-apiserver

    {{- if .Values.hostNetworkPolicy.allowSshFrom }}
    # SSH restricted to the listed CIDRs (bare IPs normalised to /32).
    - fromCIDR:
        {{- range .Values.hostNetworkPolicy.allowSshFrom }}
        - {{ if contains "/" . }}{{ . }}{{ else }}{{ . }}/32{{ end }}
        {{- end }}
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
    {{- end }}

    {{- if .Values.hostNetworkPolicy.apiserverSourceCIDRs }}
    # Apiserver port 6443, ETCD port 2379 and 2380: reachable only from the listed node public IPs.
    # Each bare-metal node's kubelet dials the public failover VIP, so every
    # node IP must be present (rendered by kubeaid-cli from Robot main IPs).
    # The in-cluster path (kubelet→localhost, pod→ClusterIP) is already covered
    # by the identity rule above.
    - fromCIDR:
        {{- range .Values.hostNetworkPolicy.apiserverSourceCIDRs }}
        - {{ if contains "/" . }}{{ . }}{{ else }}{{ . }}/32{{ end }}
        {{- end }}
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "2379"
              protocol: TCP
            - port: "2380"
              protocol: TCP
    {{- end }}

    {{- if .Values.hostNetworkPolicy.allowDhcpReplies }}
    # DHCP replies (server 67 -> client 68/UDP). Nodes that get their address
    # by DHCP (e.g. a Hetzner Cloud private network) restart the exchange with a
    # broadcast whenever systemd-networkd restarts, e.g. a systemd or netplan
    # upgrade from unattended-upgrades. The server's unicast reply then has no
    # conntrack entry and is dropped; the node keeps its old address only until
    # the lease runs out (24h on Hetzner), then goes dark.
    # With dhcpServerCIDRs set, replies are accepted from those servers only.
    # Without it they are accepted from any source: Cilium cannot match the
    # source port (67), and 68/UDP is the DHCP client port.
    {{- if .Values.hostNetworkPolicy.dhcpServerCIDRs }}
    - fromCIDR:
        {{- range .Values.hostNetworkPolicy.dhcpServerCIDRs }}
        - {{ if contains "/" . }}{{ . }}{{ else }}{{ . }}/32{{ end }}
        {{- end }}
    {{- else }}
    - fromEntities:
        - world
    {{- end }}
      toPorts:
        - ports:
            - port: "68"
              protocol: UDP
    {{- end }}

    # Public world ingress: configured public ports (80/443), plus SSH when
    # allowSshFrom is empty (empty list = SSH open to world).
    - fromEntities:
        - world
      toPorts:
        - ports:
            {{- range .Values.hostNetworkPolicy.publicPorts }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
            {{- if not .Values.hostNetworkPolicy.allowSshFrom }}
            - port: "22"
              protocol: TCP
            {{- end }}

    # ICMP echo (ping) from the world. This MUST be its own rule: Cilium rejects
    # any rule that sets both toPorts and icmps ("the ICMPs block may only be
    # present without ToPorts"), and a single invalid rule invalidates the whole
    # policy — the host endpoint then silently falls back to default-allow.
    - fromEntities:
        - world
      icmps:
        - fields:
            - type: 8
              family: IPv4
{{- end }}
