nameOverride: ""
fullnameOverride: ""

# -- KubeAid Agent config file contents.
appConfig:
  argocd:
    # -- Name of the Kubernetes Secret (in argocd namespace) containing the ArgoCD auth token
    # under the "token" key.
    authTokenSecretName: argocd-project-role-kubeaid-agent

    plainText: true

  server:
    port: 4000

  obmondoAPI:
    url: https://api.obmondo.com/api
    tls:
      keyFile: /etc/kubeaid-agent/obmondo-api/tls.key
      certFile: /etc/kubeaid-agent/obmondo-api/tls.crt
      caCertFile: /etc/kubeaid-agent/obmondo-api/ca.crt

  # -- Prometheus address (host:port) the agent queries. The wait-for-prometheus
  # initContainer probes the same address.
  prometheus:
    url: prometheus-k8s.monitoring:9090

  nodeCount:
    # -- How often the node count is sent to Obmondo API. Each send carries the
    # 24h average up to 00:01 UTC that day.
    fetchInterval: 12h

  puppetConfigDetails:
    url:
    facts:
      - os
      - networking
      - ipaddress
      - hostname
      - domain
      - virtual
      - obmondo_customer
      - obmondo_system
      - snapshot
    runKubeAidPuppetSync: false

  kubeaidUpdate:
    # -- When true, the agent schedules the service-window ArgoCD sync cron job.
    # Default is false (opt-in per cluster). Other features (node count, kube
    # version, etc.) are unaffected.
    enabled: false

    # -- Cadence at which the agent polls Obmondo API for an active KubeAid update
    # service window. Short enough to react inside a window's granularity, long
    # enough not to thrash the API when no window is open.
    checkInterval: 15m

  # Node package updates in the service window. The agent runs one privileged
  # Job per node, one node at a time, that runs `linuxaid-cli system-update
  # --agent-controlled` on the host. It never cordons, drains or reboots; it
  # reports which nodes need a reboot (metric, node annotation, event, alert).
  # See "Node package updates" in README.md.
  nodeUpdate:
    # -- When true, the agent updates the nodes' OS packages while the cluster's
    # service window is open. Needs an agent release with nodeUpdate support and
    # a privileged-capable namespace. Remove any obmondo-system-update timer from
    # the nodes first: its run closes the window.
    enabled: false

    # -- How often the agent looks for an open service window.
    checkInterval: 15m

    # -- Extra label selector for the nodes to update. Always ANDed with
    # kubernetes.io/os=linux.
    nodeSelector: ""

    # -- Only update nodes Cluster API provisioned (cluster.x-k8s.io/machine
    # annotation, not a MachinePool). Set false on clusters without Cluster
    # API (KubeOne) and use nodeSelector instead.
    capiMachinesOnly: true

    # -- linuxaid-cli image the update Jobs run; must contain node-update.sh.
    # Required when enabled.
    jobImage: ""

    # -- Service account of the update Job pods. The chart creates it, with no
    # permissions and no token.
    jobServiceAccount: kubeaid-agent-node-update

    # -- Deadline of one node's update Job.
    updateTimeout: 30m

  # Security posture: vulnerabilities, least-privilege findings, network
  # enforcement and runtime detection posture. The agent collects none of this
  # itself — the security exporter does, and the agent forwards it.
  securityPosture:
    # -- When false, the agent neither polls the exporter nor forwards anything
    # to Obmondo API. This is the switch for clusters that must not ship
    # vulnerability detail off-site.
    #
    # Safe to leave on where the exporter is not installed: the poll fails, a
    # metric records it, and nothing is submitted.
    enabled: true

    # -- In-cluster URL of the security exporter. A bare Service name
    # resolves within the agent's own namespace; qualify it if the two charts
    # deploy to different namespaces.
    exporterURL: http://kubeaid-security-exporter

    # -- How often the agent polls the exporter. Cheap, because the exporter
    # serves a cached snapshot and the agent skips the submit when collectedAt
    # has not advanced. End-to-end freshness is bounded by the EXPORTER's
    # collection interval, not by this one.
    pollInterval: 1h

    # -- Cadence at which the agent checks for a service-window edge, to capture
    # a before/after pair around maintenance. This bounds how precisely an edge
    # is timed; a window opening and closing entirely between two checks is
    # missed. Each check is one Obmondo API call, not a cluster scan.
    windowCheckInterval: 15m

# Exporters. Each is a subchart, so Helm keys its values by the chart's name and
# both the switch and the settings live under that key. All three are off by
# default; the comments on each say what turning it on costs.
#
# Renaming one of these charts moves its key, and Helm offers no fallback: a
# cluster's values must be renamed in the same change that moves it to a
# release carrying the rename.

# Cluster and image scanning. Off by default: it holds cluster-wide read across
# eight API groups.
kubeaid-security-exporter:
  enabled: false

# Node package CVE scanning, reported to a Vuls server. Off by default: it puts
# a pod on every node and needs a Vuls server to report to.
linuxaid-security-exporter:
  enabled: false

# Backup health. Off by default: every backend it reports on needs S3
# credentials, so enabling it without those deploys a pod that cannot work.
kubeaid-backup-exporter:
  enabled: false

# -- Kubernetes Secret name containing the TLS certificate key-pair, used to communicate with
# Obmondo API.
obmondoAPITLSSecretName: obmondo-clientcert

# -- Extra namespaces where the agent's ServiceAccount may read secrets.
# A Role + RoleBinding (get/list/watch on secrets) is created in each.
# The target namespaces must already exist. Useful for cross-namespace
# secret reads (e.g. obmondo-websites).
extraSecretReaderNamespaces: []
#  - obmondo-websites

configMap:
  labels: {}
  annotations: {}

deployment:
  replicas: 1

  podLabels: {}
  podAnnotations: {}

  imagePullSecrets: []

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  image:
    repository: ghcr.io/obmondo/kubeaid-agent
    # Overrides the image tag. Left empty so it follows the chart appVersion,
    # which keeps the deployed version in one place rather than two that can
    # disagree -- as they did until v1.1.2, when appVersion still read 0.0.3.
    tag: ""
    pullPolicy: Always

  # -- Holds the agent until Prometheus answers /-/ready at appConfig.prometheus.url.
  # After timeoutSeconds the probe fails and the kubelet restarts it. Turn off on a
  # cluster without Prometheus.
  waitForPrometheus:
    enabled: true
    image: docker.io/curlimages/curl:8.14.1
    timeoutSeconds: 300
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi

  env: []

  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop: ["ALL"]

  probes:
    # Process-only probes: do not call Obmondo/Prometheus. An API outage must
    # not restart kubeaid-agent across every cluster. Use GET /ping.
    readiness:
      httpGet:
        path: /ping
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    liveness:
      httpGet:
        path: /ping
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 2
      successThreshold: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  extraVolumes: []

  terminationGracePeriodSeconds: 10

  nodeSelector: {}
  affinity: {}
  tolerations: []

service:
  labels: {}
  annotations: {}

  port: 80

serviceMonitor:
  enabled: true

  labels: {}
  annotations: {}

  interval: 30s
  scrapeTimeout: 10s

prometheusRule:
  enabled: true

  # -- Extra labels on the PrometheusRule object, for Prometheus selector
  # matching.
  additionalLabels: {}
  additionalAnnotations: {}
