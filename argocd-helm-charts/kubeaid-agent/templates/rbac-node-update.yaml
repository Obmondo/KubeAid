{{- if .Values.appConfig.nodeUpdate.enabled }}
{{- if not .Values.appConfig.nodeUpdate.jobImage }}
{{- fail "appConfig.nodeUpdate.jobImage is required when appConfig.nodeUpdate.enabled is true" }}
{{- end }}
{{/* Node package updates (docs/node-update.md in kubeaid-agent). The agent lists nodes,
     records its progress in a node annotation (patch) and emits node events. It creates the
     update Jobs in its own namespace and reads their pods' termination messages. It never
     cordons, drains, evicts, deletes or execs, so none of that is granted. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeaid-agent.fullname" . }}-node-update
  labels:
    {{- include "kubeaid-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeaid-agent.fullname" . }}-node-update
  labels:
    {{- include "kubeaid-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeaid-agent.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeaid-agent.fullname" . }}-node-update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeaid-agent.fullname" . }}-node-update
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeaid-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeaid-agent.fullname" . }}-node-update
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeaid-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeaid-agent.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeaid-agent.fullname" . }}-node-update
{{- end }}
