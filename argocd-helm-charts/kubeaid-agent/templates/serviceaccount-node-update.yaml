{{- if .Values.appConfig.nodeUpdate.enabled }}
{{/* Runs the node update Job pods. They work on the host through nsenter and need no
     Kubernetes API access, so this account has no bindings and mounts no token. It carries
     the agent's image pull secrets, which Kubernetes adds to the Job pods, so jobImage can
     come from the same private registry as the agent. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.appConfig.nodeUpdate.jobServiceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeaid-agent.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.deployment.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
