apiVersion: v2
name: kubeaid-agent
description: KubeAid Agent and its three exporters — cluster and image scanning, node package scanning, and backup health — in one Argo CD application.
icon: https://avatars.githubusercontent.com/u/13882947?s=250&v=4

type: application

version: 0.6.4
appVersion: "v1.1.4"

keywords:
  - obmondo
  - kubeaid
  - kubeaid-agent

maintainers:
  - name: Sanskar Bhushan
    email: sanskar@obmondo.com
    url: https://github.com/sbdtu5498
  - name: Archisman Mridha
    email: archisman@obmondo.com
    url: https://github.com/Archisman-Mridha
  - name: Basit Hasan
    email: basit@obmondo.com
    url: https://github.com/basit9958

# All three live in charts/ and are therefore resolved locally: no repository,
# no Chart.lock, no `helm dependency update`. The conditions let a cluster take
# the agent alone, or the agent plus any of the exporters.
dependencies:
  - name: kubeaid-security-exporter
    version: 0.3.5
    condition: kubeaid-security-exporter.enabled

  - name: linuxaid-security-exporter
    version: 0.2.1
    condition: linuxaid-security-exporter.enabled

  - name: kubeaid-backup-exporter
    version: 0.5.1
    condition: kubeaid-backup-exporter.enabled
