apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "backup-exporter.fullname" . }}
  labels:
    {{- include "backup-exporter.labels" . | nindent 4 }}
# The exporter only reads. It never creates, mutates or deletes anything, in the
# cluster or in object storage, so no rule below carries a write verb. It also
# runs no informers -- it lists on a cron tick -- so none needs watch.
rules:
  # CNPG Cluster CRDs
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]

  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["scheduledbackups"]
    verbs: ["get", "list"]

  # CronJobs for logical backups
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]

  # MongoDBCommunity CRDs. Collection is driven by these: each names its own
  # backup CronJob (<resource>-backup), and one with no such job reports
  # no_backup.
  - apiGroups: ["mongodbcommunity.mongodb.com"]
    resources: ["mongodbcommunity"]
    verbs: ["get", "list"]

  # Velero CRDs
  - apiGroups: ["velero.io"]
    resources: ["schedules"]
    verbs: ["get", "list"]

  # BarmanCloud ObjectStores for WAL S3 config
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "list"]

  # Sealed-secrets controller Deployments. The namespace running the controller
  # is the one holding the master keys, so it is the only namespace where a
  # missing key backup means anything. Without this rule that namespace is never
  # identified and the sealed-secrets stream goes silent everywhere.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

  # Velero volume policies. A Schedule can name a ConfigMap that tells Velero to
  # skip a volume outright -- the velero chart renders exactly that from
  # skipVolumePolicies, for databases backed up logically instead. The exporter
  # reads it so those volumes are not reported as missing backups. Removing this
  # rule fails safe but silently: the policy cannot be read, so every skipped
  # volume alerts as unbacked, once per volume, forever.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]

  # Namespaces for cross-namespace discovery
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

  # Velero backup targets. Listed through the dynamic client with a GVR built at
  # runtime, so this rule has no matching PersistentVolumeClaims() call to grep
  # for. Removing it fails silently: the lister swallows the error and reports no
  # resources, leaving Velero monitoring blind but healthy-looking.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
