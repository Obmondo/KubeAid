{{- if .Values.kubeaid.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "trivy-operator-wrapper.fullname" . }}-cve-alerts
  labels:
    {{- include "trivy-operator-wrapper.labels" . | nindent 4 }}
    {{- with .Values.kubeaid.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.kubeaid.prometheusRule.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    # Two questions only: is the scanner working, is the backlog out of hand.
    # Correlating CVEs against newer tags is deliberately NOT done here —
    # rebuilding image references with label_replace failed silently twice.
    - name: trivy-operator.health
      rules:
        # A scanner producing nothing looks exactly like a clean cluster.
        - alert: TrivyOperatorMetricsMissing
          expr: |
            absent(trivy_image_vulnerabilities)
          for: {{ .Values.kubeaid.prometheusRule.blindFor }}
          labels:
            severity: critical
          annotations:
            summary: "Trivy Operator is reporting no vulnerability metrics"
            description: "trivy_image_vulnerabilities is absent. Either the operator is down, its ServiceMonitor is not being scraped, or every VulnerabilityReport expired past scannerReportTTL without being refreshed. While this is true the cluster is UNSCANNED, not clean."

    - name: trivy-operator.backlog
      rules:
        # "fixable" comes from trivy.ignoreUnfixed, not from this expression.
        # Wording follows the value.
        #
        # One alert per cluster and severity, by CVSS score band. Its value is
        # the number of images with a finding in the band, and the description
        # lists the worst ten, so on-call knows what to update. Counted per
        # image, not per report: Trivy writes a report per workload container;
        # an image's findings are its distinct CVE ids. An image in the critical
        # band is left out of the warning one, so each image is in one ticket.
        {{- $fixableOnly := index .Values "trivy-operator" "trivy" "ignoreUnfixed" }}
        {{- $rule := .Values.kubeaid.prometheusRule }}
        {{- $image := "namespace, image_registry, image_repository, image_tag" }}
        {{- $exclude := "" }}
        {{- with $rule.backlogExcludeNamespaces }}
        {{- $exclude = printf ", namespace!~\"%s\"" . }}
        {{- end }}
        {{- $inBand := dict }}
        {{- range $severity := list "critical" "warning" }}
        {{- $band := index $rule.scoreBands $severity }}
        {{- $_ := set $inBand $severity (printf "count by (%s) (count by (%s, vuln_id) (trivy_vulnerability_id{vuln_score=~\"%s\"%s}))" $image $image $band.scores $exclude) }}
        {{- end }}
        {{- $_ := set $inBand "warning" (printf "%s unless on (%s) %s" $inBand.warning $image $inBand.critical) }}
        {{- range $severity := list "critical" "warning" }}
        {{- $band := index $rule.scoreBands $severity }}
        {{- $overLimit := index $inBand $severity }}
        - alert: ClusterVulnerabilityBacklog
          expr: |
            count(
              {{ $overLimit }}
            ) > 0
          for: {{ $rule.backlogFor }}
          labels:
            severity: {{ $severity }}
          annotations:
            # The summary stays fixed: alert pipelines turn it into a ticket
            # title, and a count in it rewrites that title on every scan. The
            # count lives in the description instead.
            summary: "Images need a security update: vulnerabilities with a CVSS score {{ $band.text }}{{ if $fixableOnly }}, with a fix available{{ end }}"
            description: >-
              Not an outage: {{ "{{ $value }}" }} image(s) have vulnerabilities with a CVSS score {{ $band.text }}.
              Update each one to a newer version, usually by bumping its chart or image tag:
              {{- `{{ range query "` }}sort_desc(topk(10, {{ $overLimit | replace "\"" "\\\"" }})){{ `" }} {{ .Labels.image_repository }}:{{ .Labels.image_tag }} in {{ .Labels.namespace }} ({{ .Value }} CVEs);{{ end }}` }}
              {{- if not $fixableOnly }} Some may have no fix yet; skip those.{{ end }}
              List all images, worst last: kubectl get vulnerabilityreports -A -o wide --sort-by=.report.summary.criticalCount
        {{- end }}
{{- end }}
