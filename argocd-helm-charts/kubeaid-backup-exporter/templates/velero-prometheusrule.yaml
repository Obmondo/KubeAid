{{- if and .Values.prometheusRule.enabled (hasKey .Values.prometheusRule "velero") ( .Values.prometheusRule.velero.enabled ) }}
{{- $rpoSeconds := include "backup-exporter.durationToSeconds" .Values.exporter.velero.max_rpo }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "backup-exporter.fullname" . }}-velero
  namespace: {{ .Values.prometheusRule.velero.namespace | default "monitoring" }}
  labels:
    {{- include "backup-exporter.labels" . | nindent 4 }}
    {{- if .Values.prometheusRule.velero.labels }}
    {{- toYaml .Values.prometheusRule.velero.labels | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "backup-exporter.name" . }}-velero
      rules:
        - alert: VeleroBackupExporterJobFailed
          expr: max by (type) (backup_exporter_velero_error{type!~"backup_not_enabled|awaiting_first_backup|velero_not_installed|no_schedules_found"} == 1) > 0
          for: {{ .Values.prometheusRule.velero.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.prometheusRule.velero.severity | default "critical" }}
          annotations:
            summary: 'Velero backup exporter job failed'
            description: 'Velero backup exporter error (type: {{ `{{ $labels.type }}` }})'
        # One alert per cluster: a single failed Velero run would otherwise page
        # once per namespace or volume. The description lists every volume past
        # RPO with its namespace and age, queried at notification time.
        # velero_not_installed and no_schedules_found are excluded from
        # JobFailed because neither is a collector failure. They still mean no
        # volume on this cluster is protected, which Argo CD does not report
        # when Velero was removed in git, so they surface here instead: one
        # alert per cluster, warning rather than critical.
        - alert: VeleroNoBackupSchedules
          expr: max by (type) (backup_exporter_velero_error{type=~"velero_not_installed|no_schedules_found"}) == 1
          for: {{ .Values.prometheusRule.velero.noSchedulesForDuration | default "24h" }}
          labels:
            severity: {{ .Values.prometheusRule.velero.noSchedulesSeverity | default "warning" }}
          annotations:
            summary: 'No Velero backup schedules on this cluster'
            description: 'Velero is backing up nothing on this cluster (reason: {{ `{{ $labels.type }}` }}). No PVC is protected.'
        - alert: VeleroBackupExceededRPO
          expr: count(backup_exporter_velero_latest_backup_age > {{ $rpoSeconds }})
          for: {{ .Values.prometheusRule.velero.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.prometheusRule.velero.severity | default "critical" }}
          annotations:
            summary: 'Velero backups exceeded RPO'
            description: |-
              {{ `{{ $value }}` }} Velero backup(s) exceeded the RPO of {{ .Values.exporter.velero.max_rpo }}:
              {{ `{{- range query "backup_exporter_velero_latest_backup_age > ` }}{{ $rpoSeconds }}{{ `" | sortByLabel "resource_name" | sortByLabel "namespace" }}` }}
              {{ `- {{ .Labels.namespace }}/{{ .Labels.resource_name }} ({{ .Labels.resource_type }}, method: {{ .Labels.backup }}, age: {{ .Value | humanizeDuration }})` }}
              {{ `{{- end }}` }}
        - alert: VeleroBackupMissing
          expr: count(backup_exporter_velero_latest_backup_age == 0 unless on (namespace, resource_name, resource_type) (backup_exporter_velero_error{type=~"backup_not_enabled|awaiting_first_backup"} == 1))
          for: {{ .Values.prometheusRule.velero.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.prometheusRule.velero.severity | default "critical" }}
          annotations:
            summary: 'Velero backups missing'
            description: |-
              {{ `{{ $value }}` }} volume(s) have never been backed up by Velero:
              {{ `{{- range query "backup_exporter_velero_latest_backup_age == 0 unless on (namespace, resource_name, resource_type) (backup_exporter_velero_error{type=~'backup_not_enabled|awaiting_first_backup'} == 1)" | sortByLabel "resource_name" | sortByLabel "namespace" }}` }}
              {{ `- {{ .Labels.namespace }}/{{ .Labels.resource_name }} ({{ .Labels.resource_type }})` }}
              {{ `{{- end }}` }}
        # Velero retries a failed repo maintenance a few minutes later by itself, so
        # one failed job is only a slow bucket and KubeJobFailed skips these jobs.
        # This fires when a repo gets no successful maintenance for a long time.
        # Metrics: https://github.com/velero-io/velero/pull/9414
        # Why metrics and not Job status: https://github.com/velero-io/velero/issues/9225
        - alert: VeleroRepoMaintenanceFailing
          expr: |-
            sum by (repository_name) (increase(velero_repo_maintenance_failure_total[1h])) > 0
            unless on (repository_name)
            sum by (repository_name) (increase(velero_repo_maintenance_success_total[1h])) > 0
          for: {{ .Values.prometheusRule.velero.maintenanceForDuration | default "6h" }}
          labels:
            severity: {{ .Values.prometheusRule.velero.maintenanceSeverity | default "warning" }}
          annotations:
            summary: 'Velero repository maintenance keeps failing'
            description: 'Maintenance of Velero repository {{ `{{ $labels.repository_name }}` }} has been failing for {{ .Values.prometheusRule.velero.maintenanceForDuration | default "6h" }} without a successful run. The error is in status.recentMaintenance of the BackupRepository.'
{{- end }}
