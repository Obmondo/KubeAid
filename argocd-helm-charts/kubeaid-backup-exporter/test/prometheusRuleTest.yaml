rule_files:
  - /tmp/prometheusRule.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'backup_exporter_postgres_error{backup="logical",namespace="test",cluster_name="pg1",type="process"}'
        values: '1x240'
    alert_rule_test:
      - alertname: PostgresBackupExporterJobFailed
        eval_time: 2h40m
        exp_alerts:
          - exp_labels:
              alertname: PostgresBackupExporterJobFailed
              severity: critical
              backup: logical
              namespace: test
              cluster_name: pg1
              type: process
            exp_annotations:
              summary: 'Postgres backup exporter error'
              description: 'Postgres backup exporter error for test/pg1 (backup: logical, error: process)'

  - interval: 1m
    input_series:
      - series: 'postgres_latest_logical_backup_age{namespace="test",cluster_name="pg1"}'
        values: '95000x6'
    alert_rule_test:
      - alertname: PostgresLogicalBackupExceededRPO
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: PostgresLogicalBackupExceededRPO
              cluster_name: pg1
              namespace: test
              severity: critical
            exp_annotations:
              summary: 'PostgreSQL logical backup exceeded RPO'
              description: 'Logical backup for test/pg1 exceeded RPO (age: 1d 2h 23m 20s)'

  - interval: 1m
    input_series:
      - series: 'postgres_latest_cnpg_wal_backup_age{namespace="test",cluster_name="pg1"}'
        values: '95000x6'
    alert_rule_test:
      - alertname: PostgresCNPGWALBackupExceededRPO
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: PostgresCNPGWALBackupExceededRPO
              cluster_name: pg1
              namespace: test
              severity: critical
            exp_annotations:
              summary: 'PostgreSQL CNPG WAL backup exceeded RPO'
              description: 'WAL backup for test/pg1 exceeded RPO (age: 1d 2h 23m 20s)'

  - interval: 1m
    input_series:
      - series: 'postgres_latest_logical_backup_age{namespace="test",cluster_name="pg1"}'
        values: '0x6'
    alert_rule_test:
      - alertname: PostgresLogicalBackupMissing
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: PostgresLogicalBackupMissing
              cluster_name: pg1
              namespace: test
              severity: critical
            exp_annotations:
              summary: 'PostgreSQL logical backup missing'
              description: 'No logical backup found for test/pg1'

  - interval: 1m
    input_series:
      - series: 'postgres_latest_cnpg_wal_backup_age{namespace="test",cluster_name="pg1"}'
        values: '0x6'
    alert_rule_test:
      - alertname: PostgresWALBackupMissing
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: PostgresWALBackupMissing
              cluster_name: pg1
              namespace: test
              severity: critical
            exp_annotations:
              summary: 'PostgreSQL WAL backup missing'
              description: 'No WAL backup found for test/pg1'

  # "not enabled" error types must not fire PostgresBackupExporterJobFailed --
  # they mean the app never turned this backup type on, not a job failure.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_postgres_error{backup="logical",namespace="disabled-ns",cluster_name="pg-disabled",type="backup_not_enabled"}'
        values: '1x240'
      - series: 'backup_exporter_postgres_error{backup="logical",namespace="disabled-ns2",cluster_name="pg-disabled2",type="cronjob_not_found"}'
        values: '1x240'
      - series: 'backup_exporter_postgres_error{backup="wal",namespace="disabled-ns3",cluster_name="pg-disabled3",type="no_scheduled_backups"}'
        values: '1x240'
    alert_rule_test:
      - alertname: PostgresBackupExporterJobFailed
        eval_time: 2h40m
        exp_alerts: []

  # A genuine failure that persists across consecutive passes must still fire
  # PostgresBackupExporterJobFailed.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_postgres_error{backup="logical",namespace="test",cluster_name="pg1",type="s3_connection_failed"}'
        values: '1x240'
    alert_rule_test:
      - alertname: PostgresBackupExporterJobFailed
        eval_time: 2h40m
        exp_alerts:
          - exp_labels:
              alertname: PostgresBackupExporterJobFailed
              severity: critical
              backup: logical
              namespace: test
              cluster_name: pg1
              type: s3_connection_failed
            exp_annotations:
              summary: 'Postgres backup exporter error'
              description: 'Postgres backup exporter error for test/pg1 (backup: logical, error: s3_connection_failed)'

  # One failed pass holds the error until the next pass (2h at the chart
  # default) and must not page, even at its longest.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_postgres_error{backup="logical",namespace="test",cluster_name="pg1",type="backup_status_failed"}'
        values: '1x120 stale'
    alert_rule_test:
      - alertname: PostgresBackupExporterJobFailed
        eval_time: 1h
        exp_alerts: []
      - alertname: PostgresBackupExporterJobFailed
        eval_time: 2h9m
        exp_alerts: []
      - alertname: PostgresBackupExporterJobFailed
        eval_time: 2h40m
        exp_alerts: []

  # A missed scrape mid-failure must not restart the wait.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_postgres_error{backup="logical",namespace="test",cluster_name="pg1",type="backup_status_failed"}'
        values: '1x100 stale 1x140'
    alert_rule_test:
      - alertname: PostgresBackupExporterJobFailed
        eval_time: 2h40m
        exp_alerts:
          - exp_labels:
              alertname: PostgresBackupExporterJobFailed
              severity: critical
              backup: logical
              namespace: test
              cluster_name: pg1
              type: backup_status_failed
            exp_annotations:
              summary: 'Postgres backup exporter error'
              description: 'Postgres backup exporter error for test/pg1 (backup: logical, error: backup_status_failed)'

  # A cluster with the zero-age "missing" sentinel AND a recorded
  # backup_not_enabled/cronjob_not_found error must not fire
  # PostgresLogicalBackupMissing -- the unless-join excludes it.
  - interval: 1m
    input_series:
      - series: 'postgres_latest_logical_backup_age{namespace="disabled-ns",cluster_name="pg-disabled"}'
        values: '0x6'
      - series: 'backup_exporter_postgres_error{backup="logical",namespace="disabled-ns",cluster_name="pg-disabled",type="backup_not_enabled"}'
        values: '1x6'
    alert_rule_test:
      - alertname: PostgresLogicalBackupMissing
        eval_time: 6m
        exp_alerts: []

  # Same, for WAL.
  - interval: 1m
    input_series:
      - series: 'postgres_latest_cnpg_wal_backup_age{namespace="disabled-ns3",cluster_name="pg-disabled3"}'
        values: '0x6'
      - series: 'backup_exporter_postgres_error{backup="wal",namespace="disabled-ns3",cluster_name="pg-disabled3",type="no_scheduled_backups"}'
        values: '1x6'
    alert_rule_test:
      - alertname: PostgresWALBackupMissing
        eval_time: 6m
        exp_alerts: []

  # A failed S3 read leaves the zero-age sentinel too, but not being able to
  # look is not a missing backup: JobFailed reports it if it repeats.
  - interval: 1m
    input_series:
      - series: 'postgres_latest_logical_backup_age{namespace="test",cluster_name="pg1"}'
        values: '0x6'
      - series: 'backup_exporter_postgres_error{backup="logical",namespace="test",cluster_name="pg1",type="backup_status_failed"}'
        values: '1x6'
    alert_rule_test:
      - alertname: PostgresLogicalBackupMissing
        eval_time: 6m
        exp_alerts: []

  # Same, for WAL, whose S3 read failures are s3_connection_failed.
  - interval: 1m
    input_series:
      - series: 'postgres_latest_cnpg_wal_backup_age{namespace="test",cluster_name="pg1"}'
        values: '0x6'
      - series: 'backup_exporter_postgres_error{backup="wal",namespace="test",cluster_name="pg1",type="s3_connection_failed"}'
        values: '1x6'
    alert_rule_test:
      - alertname: PostgresWALBackupMissing
        eval_time: 6m
        exp_alerts: []

  # WAL's backup_status_failed is not a read failure -- the bucket was read and
  # held no valid base backup -- so it is still a missing backup.
  - interval: 1m
    input_series:
      - series: 'postgres_latest_cnpg_wal_backup_age{namespace="test",cluster_name="pg1"}'
        values: '0x6'
      - series: 'backup_exporter_postgres_error{backup="wal",namespace="test",cluster_name="pg1",type="backup_status_failed"}'
        values: '1x6'
    alert_rule_test:
      - alertname: PostgresWALBackupMissing
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: PostgresWALBackupMissing
              cluster_name: pg1
              namespace: test
              severity: critical
            exp_annotations:
              summary: 'PostgreSQL WAL backup missing'
              description: 'No WAL backup found for test/pg1'

  # A PVC outside every schedule's included namespaces (exporter-classified,
  # backup_exporter_velero_error type=backup_not_enabled) must not fire
  # VeleroBackupMissing, even though the age sentinel is 0.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_latest_backup_age{backup="",namespace="not-scheduled-ns",resource_name="some-pvc",resource_type="pvc"}'
        values: '0x6'
      - series: 'backup_exporter_velero_error{namespace="not-scheduled-ns",resource_name="some-pvc",resource_type="pvc",type="backup_not_enabled"}'
        values: '1x6'
    alert_rule_test:
      - alertname: VeleroBackupMissing
        eval_time: 6m
        exp_alerts: []

  # A PVC younger than max_rpo that Velero has not had a scheduled run for yet
  # (exporter-classified, type=awaiting_first_backup) must not fire
  # VeleroBackupMissing, even though the age sentinel is 0.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_latest_backup_age{backup="",namespace="test-ns",resource_name="pvc-new",resource_type="pvc"}'
        values: '0x6'
      - series: 'backup_exporter_velero_error{namespace="test-ns",resource_name="pvc-new",resource_type="pvc",type="awaiting_first_backup"}'
        values: '1x6'
    alert_rule_test:
      - alertname: VeleroBackupMissing
        eval_time: 6m
        exp_alerts: []

  # A namespace holding both a genuinely missing PVC and one still awaiting its
  # first backup fires for the missing one only, and lists only that one.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_latest_backup_age{backup="",namespace="mixed-ns",resource_name="pvc-never",resource_type="pvc"}'
        values: '0x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="",namespace="mixed-ns",resource_name="pvc-new",resource_type="pvc"}'
        values: '0x6'
      - series: 'backup_exporter_velero_error{namespace="mixed-ns",resource_name="pvc-new",resource_type="pvc",type="awaiting_first_backup"}'
        values: '1x6'
    alert_rule_test:
      - alertname: VeleroBackupMissing
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: VeleroBackupMissing
              severity: critical
            exp_annotations:
              summary: 'Velero backups missing'
              description: |-
                1 volume(s) have never been backed up by Velero:
                - mixed-ns/pvc-never (pvc)

  # A genuinely missing, in-scope PVC (no matching not-enabled error) must
  # still fire VeleroBackupMissing.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_latest_backup_age{backup="",namespace="test-ns",resource_name="pvc-never",resource_type="pvc"}'
        values: '0x6'
    alert_rule_test:
      - alertname: VeleroBackupMissing
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: VeleroBackupMissing
              severity: critical
            exp_annotations:
              summary: 'Velero backups missing'
              description: |-
                1 volume(s) have never been backed up by Velero:
                - test-ns/pvc-never (pvc)

  # One alert per cluster, listing every missing volume with its namespace.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_latest_backup_age{backup="",namespace="test-ns",resource_name="pvc-missing-b",resource_type="pvc"}'
        values: '0x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="",namespace="test-ns",resource_name="pvc-missing-a",resource_type="pvc"}'
        values: '0x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="test-backup",namespace="test-ns",resource_name="pvc-fine",resource_type="pvc"}'
        values: '3600x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="",namespace="other-ns",resource_name="pvc-unscheduled",resource_type="pvc"}'
        values: '0x6'
      - series: 'backup_exporter_velero_error{namespace="other-ns",resource_name="pvc-unscheduled",resource_type="pvc",type="backup_not_enabled"}'
        values: '1x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="",namespace="third-ns",resource_name="pvc-lonely",resource_type="pvc"}'
        values: '0x6'
    alert_rule_test:
      - alertname: VeleroBackupMissing
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: VeleroBackupMissing
              severity: critical
            exp_annotations:
              summary: 'Velero backups missing'
              description: |-
                3 volume(s) have never been backed up by Velero:
                - test-ns/pvc-missing-a (pvc)
                - test-ns/pvc-missing-b (pvc)
                - third-ns/pvc-lonely (pvc)

  # A PVC outside every schedule's included namespaces is exporter bookkeeping,
  # not a collector failure: backup_not_enabled must not fire
  # VeleroBackupExporterJobFailed either, the same way it does not fire
  # VeleroBackupMissing.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_error{namespace="not-scheduled-ns",resource_name="some-pvc",resource_type="pvc",type="backup_not_enabled"}'
        values: '1x6'
    alert_rule_test:
      - alertname: VeleroBackupExporterJobFailed
        eval_time: 6m
        exp_alerts: []

  # ExceededRPO is one alert per cluster. Late volumes in two namespaces and
  # a healthy one must yield exactly one alert with no labels but severity,
  # listing every late volume as namespace/name (sorted) with its age.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_latest_backup_age{backup="test-backup",namespace="test-ns",resource_name="pvc-late-b",resource_type="pvc"}'
        values: '100000x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="test-backup",namespace="test-ns",resource_name="pvc-late-a",resource_type="pvc"}'
        values: '95000x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="test-backup",namespace="test-ns",resource_name="pvc-fresh",resource_type="pvc"}'
        values: '3600x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="test-backup",namespace="other-ns",resource_name="pvc-other",resource_type="pvc"}'
        values: '3600x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="test-backup",namespace="a-ns",resource_name="pvc-x",resource_type="pvc"}'
        values: '95000x6'
    alert_rule_test:
      - alertname: VeleroBackupExceededRPO
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: VeleroBackupExceededRPO
              severity: critical
            exp_annotations:
              summary: 'Velero backups exceeded RPO'
              description: |-
                3 Velero backup(s) exceeded the RPO of 26h:
                - a-ns/pvc-x (pvc, method: test-backup, age: 1d 2h 23m 20s)
                - test-ns/pvc-late-a (pvc, method: test-backup, age: 1d 2h 23m 20s)
                - test-ns/pvc-late-b (pvc, method: test-backup, age: 1d 3h 46m 40s)

  # Nothing past RPO, no alert, even with many volumes.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_latest_backup_age{backup="test-backup",namespace="test-ns",resource_name="pvc-a",resource_type="pvc"}'
        values: '3600x6'
      - series: 'backup_exporter_velero_latest_backup_age{backup="test-backup",namespace="test-ns",resource_name="pvc-b",resource_type="pvc"}'
        values: '93600x6'
    alert_rule_test:
      - alertname: VeleroBackupExceededRPO
        eval_time: 6m
        exp_alerts: []

  # A PVC still inside its first-backup grace window is exporter bookkeeping,
  # not a collector failure: awaiting_first_backup must not fire
  # VeleroBackupExporterJobFailed either.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_error{namespace="test-ns",resource_name="pvc-new",resource_type="pvc",type="awaiting_first_backup"}'
        values: '1x6'
    alert_rule_test:
      - alertname: VeleroBackupExporterJobFailed
        eval_time: 6m
        exp_alerts: []

  # A cluster without Velero's CRDs has nothing to check, and Argo CD already
  # reports a Velero that should be installed and is not. Reporting it here
  # would page on a permanent, expected state.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_error{type="velero_not_installed"}'
        values: '1x6'
    alert_rule_test:
      - alertname: VeleroBackupExporterJobFailed
        eval_time: 6m
        exp_alerts: []

  # Neither bookkeeping state pages as a failure, but both mean the cluster
  # protects nothing, so VeleroNoBackupSchedules reports it once, as a warning,
  # only after a full day so a cluster rebuild does not trip it.
  - interval: 5m
    input_series:
      - series: 'backup_exporter_velero_error{type="velero_not_installed"}'
        values: '1x300'
    alert_rule_test:
      - alertname: VeleroNoBackupSchedules
        eval_time: 1h
        exp_alerts: []
      - alertname: VeleroNoBackupSchedules
        eval_time: 25h
        exp_alerts:
          - exp_labels:
              alertname: VeleroNoBackupSchedules
              severity: warning
              type: velero_not_installed
            exp_annotations:
              summary: 'No Velero backup schedules on this cluster'
              description: 'Velero is backing up nothing on this cluster (reason: velero_not_installed). No PVC is protected.'

  # Same for a Velero that is installed but has no Schedules.
  - interval: 5m
    input_series:
      - series: 'backup_exporter_velero_error{type="no_schedules_found"}'
        values: '1x300'
    alert_rule_test:
      - alertname: VeleroNoBackupSchedules
        eval_time: 25h
        exp_alerts:
          - exp_labels:
              alertname: VeleroNoBackupSchedules
              severity: warning
              type: no_schedules_found
            exp_annotations:
              summary: 'No Velero backup schedules on this cluster'
              description: 'Velero is backing up nothing on this cluster (reason: no_schedules_found). No PVC is protected.'

  # A cluster with real backups never reports either type, so it stays quiet.
  - interval: 5m
    input_series:
      - series: 'backup_exporter_velero_latest_backup_age{backup="CSISnapshot",namespace="test-ns",resource_name="pvc-a",resource_type="pvc"}'
        values: '3600x300'
    alert_rule_test:
      - alertname: VeleroNoBackupSchedules
        eval_time: 25h
        exp_alerts: []

  # Velero installed but declaring no Schedules is a configuration statement,
  # not a collector failure: Argo CD reports schedules that should exist and
  # do not, so paging here would duplicate it.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_error{type="no_schedules_found"}'
        values: '1x6'
    alert_rule_test:
      - alertname: VeleroBackupExporterJobFailed
        eval_time: 6m
        exp_alerts: []

  # A listing failure that is not a missing CRD -- API server down, RBAC
  # revoked -- is a real failure and must still page.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_error{type="schedule_list_failed"}'
        values: '1x6'
    alert_rule_test:
      - alertname: VeleroBackupExporterJobFailed
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: VeleroBackupExporterJobFailed
              severity: critical
              type: schedule_list_failed
            exp_annotations:
              summary: 'Velero backup exporter job failed'
              description: 'Velero backup exporter error (type: schedule_list_failed)'

  # A genuine failure type must still fire VeleroBackupExporterJobFailed.
  - interval: 1m
    input_series:
      - series: 'backup_exporter_velero_error{namespace="test-ns",resource_name="pvc-a",resource_type="pvc",type="s3_connection_failed"}'
        values: '1x6'
    alert_rule_test:
      - alertname: VeleroBackupExporterJobFailed
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              alertname: VeleroBackupExporterJobFailed
              severity: critical
              type: s3_connection_failed
            exp_annotations:
              summary: 'Velero backup exporter job failed'
              description: 'Velero backup exporter error (type: s3_connection_failed)'

  # Velero retries a failed repo maintenance every ~5 minutes. A repo that keeps
  # failing with no successful run for 6h fires VeleroRepoMaintenanceFailing.
  - interval: 5m
    input_series:
      - series: 'velero_repo_maintenance_failure_total{repository_name="nextcloud-default-kopia"}'
        values: '0+1x90'
    alert_rule_test:
      - alertname: VeleroRepoMaintenanceFailing
        eval_time: 7h
        exp_alerts:
          - exp_labels:
              alertname: VeleroRepoMaintenanceFailing
              severity: warning
              repository_name: nextcloud-default-kopia
            exp_annotations:
              summary: 'Velero repository maintenance keeps failing'
              description: 'Maintenance of Velero repository nextcloud-default-kopia has been failing for 6h without a successful run. The error is in status.recentMaintenance of the BackupRepository.'

  # One failed run that the next retry fixes is only a slow bucket, no alert.
  - interval: 5m
    input_series:
      - series: 'velero_repo_maintenance_failure_total{repository_name="matomo-default-kopia"}'
        values: '0 1x90'
      - series: 'velero_repo_maintenance_success_total{repository_name="matomo-default-kopia"}'
        values: '0 0 1x89'
    alert_rule_test:
      - alertname: VeleroRepoMaintenanceFailing
        eval_time: 7h
        exp_alerts: []

  # Failing for 5h and then recovering stays under the 6h and never fires.
  - interval: 5m
    input_series:
      - series: 'velero_repo_maintenance_failure_total{repository_name="puppetserver-enableit-default-kopia"}'
        values: '0+1x60 60x30'
      - series: 'velero_repo_maintenance_success_total{repository_name="puppetserver-enableit-default-kopia"}'
        values: '0x60 1x30'
    alert_rule_test:
      - alertname: VeleroRepoMaintenanceFailing
        eval_time: 5h30m
        exp_alerts: []
