mail:
  # When true, the chart stamps `date/deploy-date: <now>` into the pod template
  # to force a restart on every `helm upgrade`. Argo CD renders the chart all
  # the time, so the app would never be in sync and every sync would restart
  # mail. Config changes still restart the pod through the chart's checksum
  # annotation.
  recreateOnRedeploy: false
  config:
    postfix:
      # Don't offer STARTTLS to in-cluster clients. Without a certificate the
      # image serves its self-signed snakeoil one (issued to localhost), and
      # clients that verify it, like Go's net/smtp, then fail every send.
      # Outbound TLS to RELAYHOST is set by smtp_tls_security_level instead.
      smtpd_tls_security_level: "none"
