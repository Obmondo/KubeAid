# PostgreSQL for Nextcloud, as a CNPG Cluster rendered by kubeaid-addons. The
# cluster is named <instanceName>-pgsql, so this gives the `nextcloud-pgsql-rw`
# Service and a `nextcloud-pgsql-app` Secret with keys username/password - which
# is what nextcloud.externalDatabase.existingSecret below reads.
#
# Preferred over the upstream chart's bundled `postgresql`/`mariadb` subcharts:
# those now pull from the frozen `bitnamilegacy` registry.
global:
  postgresql:
    enabled: true
    instanceName: nextcloud
    instances: 1
    database: nextcloud
    owner: nextcloud
    size: 8Gi
    backups:
      enabled: false
    logicalbackup:
      enabled: false

# Redis for file locking and transactional caching, created through the opstree
# redis-operator (see templates/redis-standalone.yaml). Requires the
# redis-operator app on the cluster. Same reasoning as PostgreSQL: the upstream
# chart's bundled redis is a `bitnamilegacy` image.
externalRedis:
  enabled: true
  # The operator names the Service after the CR; keep this in step with
  # nextcloud.externalRedis.host below.
  name: nextcloud-redis
  storage: 2Gi
  # storageClass: ""
  image: quay.io/opstree/redis:v7.2.6
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Auth is off: the Redis Service is ClusterIP-only. Set redisSecret (name/key)
  # and nextcloud.externalRedis.existingSecret together to turn it on.
  # redisSecret:
  #   name: nextcloud-redis-auth
  #   key: password

# Upstream chart is vendored as the `nextcloud` dependency, so values nest under
# `nextcloud`.
nextcloud:
  # One replica. Scaling out needs RWX data storage AND Redis locking in place
  # first, or two pods will corrupt each other's file state.
  replicaCount: 1

  nextcloud:
    # Admin credentials. Upstream defaults to the literal password "changeme",
    # so take them from a Secret (a SealedSecret in the kubeaid-config repo)
    # with keys `nextcloud-username` and `nextcloud-password`.
    existingSecret:
      enabled: true
      secretName: nextcloud-admin
      usernameKey: nextcloud-username
      passwordKey: nextcloud-password

    # Nextcloud rejects requests whose Host header is not trusted, so the
    # cluster values file must set `host` to the ingress hostname.
    # host: nextcloud.example.com

  # The bundled subcharts stay off - see the notes above.
  internalDatabase:
    enabled: false
  mariadb:
    enabled: false
  postgresql:
    enabled: false
  redis:
    enabled: false
    # Must also be off. The chart's REDIS_URL helper picks the password form of
    # the URL whenever `redis.auth.enabled` and `redis.auth.password` are set -
    # it never checks that the bundled Redis is actually enabled. Left at the
    # upstream default ("changeme") it emits
    # `redis://:$(REDIS_HOST_PASSWORD)@...` while no such env var exists, and
    # Kubernetes passes an undefined $(VAR) through verbatim, so Nextcloud gets a
    # literal, unusable URL.
    auth:
      enabled: false

  externalDatabase:
    enabled: true
    type: postgresql
    # CNPG's read-write Service for the <instanceName>-pgsql cluster above.
    host: nextcloud-pgsql-rw:5432
    database: nextcloud
    existingSecret:
      enabled: true
      # Generated by CNPG; keys are username/password.
      secretName: nextcloud-pgsql-app
      usernameKey: username
      passwordKey: password

  externalRedis:
    enabled: true
    # Must match externalRedis.name above.
    host: nextcloud-redis
    port: 6379

  persistence:
    enabled: true
    size: 20Gi
    # ReadWriteOnce is enough at one replica. Use an RWX class before scaling.
    accessMode: ReadWriteOnce
    # storageClass: ""

  # On first start the entrypoint copies the whole Nextcloud tree (tens of
  # thousands of small files) into the data volume and then runs the installer,
  # and Apache only starts listening after both. On network storage such as
  # CephFS that takes minutes. Without a startup probe, liveness (10s delay, 3
  # failures) kills the container mid-copy on every attempt. Worse, because
  # version.php is copied last and the installer runs after it, a kill in that
  # gap leaves a volume that looks installed but is not - the next start skips
  # the installer and serves an uninstalled Nextcloud ("installed": false).
  #
  # 30s + 60 x 10s = about 10 minutes before liveness and readiness take over.
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
    successThreshold: 1

  # Turned on per cluster.
  ingress:
    enabled: false

  # No CPU limit by policy; only memory is capped.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
