# The subcharts keep every upstream default; their values go under the subchart's name.

# LLMInferenceServices to run, one per entry (a KubeAid addition, see README.md).
#   name               required
#   spec               required, the LLMInferenceService spec as is
#   namespace          default: the release namespace
#   apiVersion         default: serving.kserve.io/v1alpha2
#   labels             added to the standard labels
#   annotations        merged over the default argocd.argoproj.io/sync-wave: "1"
#   serviceAccount     create: true adds a ServiceAccount named after the service
#                      (or serviceAccount.name), with optional secrets,
#                      imagePullSecrets and annotations, and sets
#                      spec.template.serviceAccountName to it unless already set
#   ingress            enabled: true adds an Ingress of the same name for host
#                      (required). Optional: className, annotations (merged over
#                      sync-wave "2"), tlsSecretName (adds TLS for the host), path
#                      (default "/"), serviceName (default <name>-kserve-workload-svc)
#                      and servicePort (default 8000), which fit a service without
#                      a router
llmInferenceServices: []
