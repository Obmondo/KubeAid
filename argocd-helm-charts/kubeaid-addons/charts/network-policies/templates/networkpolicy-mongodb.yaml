{{- if ((.Values.global).netpol).enabled }}
{{- range (include "kubeaid-addons.mongodb.instances" . | fromJsonArray) }}
{{- if .netpol }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .instanceName }}-networkpolicy
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: cilium-networkpolicy
spec:
  # NOTE: `app: <instanceName>-svc` is the pod label assigned by the MongoDB Community Operator.
  # Cilium enforces at the pod level via eBPF — endpoint selectors match pod identity, not Kubernetes Services.
  endpointSelector:
    matchLabels:
      app: {{ .instanceName }}-svc

  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            app: {{ .instanceName }}-svc
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP

  ingress:
    - fromEndpoints:
        - matchLabels:
            app: {{ .instanceName }}-svc
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP

    {{- range .clients }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
            {{- range $key, $value := .selectorLabels }}
            {{ $key }}: {{ $value | quote }}
            {{- end }}
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    {{- end }}

    {{- if (.operator).selectorLabels }}
    - fromEndpoints:
        - matchLabels:
            {{- range $key, $value := .operator.selectorLabels }}
            {{ $key }}: {{ $value | quote }}
            {{- end }}
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    {{- end }}

    {{- if (.logicalbackup).enabled }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
            app: {{ .instanceName }}-backup
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
