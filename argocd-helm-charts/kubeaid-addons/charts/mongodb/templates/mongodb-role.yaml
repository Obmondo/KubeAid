{{- /* One per distinct ServiceAccount name in use -- see
       kubeaid-addons.mongodb.serviceAccountNames for why an unset
       serviceAccountName still has to render "mongodb-kubernetes-appdb". */ -}}
{{- range (include "kubeaid-addons.mongodb.serviceAccountNames" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - patch
      - delete
      - get
{{- end }}
