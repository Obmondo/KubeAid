{{- /* Gated on each target's own logicalbackup.enabled, independent of that
       target's `enabled` -- see kubeaid-addons.mongodb.backupTargets -- so
       backups can target an EXISTING, externally-managed MongoDBCommunity
       without this chart provisioning one. */ -}}
{{- range (include "kubeaid-addons.mongodb.backupTargets" . | fromJsonArray) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-backup" .instanceName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    # How backup-exporter finds this job. The value is fixed, unlike the
    # per-instance "app" label on the pod template below, so one selector
    # matches every mongodump CronJob in the cluster.
    backup-exporter.io/backup: mongodb
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  schedule: {{ .logicalbackup.schedule | default "45 03 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          {{- if .logicalbackup.annotations }}
          annotations:
            {{- toYaml .logicalbackup.annotations | nindent 12 }}
          {{- end }}
          labels:
            app: {{ printf "%s-backup" .instanceName }}
        spec:
          containers:
            - name: mongodb-backup
              image: ghcr.io/obmondo/mongodb-backup:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: {{ .logicalbackup.secretName }}
                      key: MONGO_URI
                - name: MONGO_COMPLETE
                  valueFrom:
                    secretKeyRef:
                      name: {{ .logicalbackup.secretName }}
                      key: MONGO_COMPLETE
                - name: BACKUP_PROVIDER
                  value: {{ .logicalbackup.provider | default "az" | quote }}
              {{- if eq .logicalbackup.provider "s3" }}
                - name: S3_BUCKET
                  value: {{ .logicalbackup.s3bucket | quote }}
                - name: S3_PATH
                  value: {{ .logicalbackup.s3backuppath | quote }}
              {{- if not .logicalbackup.useiamrole }}
                - name: BACKUP_S3_REGION
                  value: {{ .logicalbackup.s3region | default "us-east-1" | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .logicalbackup.s3region | default "us-east-1" | quote }}
                - name: AWS_REGION
                  value: {{ .logicalbackup.s3region | default "us-east-1" | quote }}
                # NOTE: the backup image reads AWS_S3_ENDPOINT (not BACKUP_S3_ENDPOINT)
                # to pass --endpoint-url; without it uploads go to real AWS.
                - name: AWS_S3_ENDPOINT
                  value: {{ .logicalbackup.s3endpoint | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .logicalbackup.awsAccessKeyIdSecretName }}
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .logicalbackup.secretName }}
                      key: AWS_SECRET_ACCESS_KEY
              {{- end }}
              {{- else if eq .logicalbackup.provider "az" }}
                - name: AZ_BACKUP_PATH
                  value: {{ .logicalbackup.azbackuppath | default "mongodb-backup/graylog-mongodb" | quote }}
                - name: AZURE_STORAGE_ACCOUNT_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .logicalbackup.secretName }}
                      key: AZURE_STORAGE_ACCOUNT_NAME
                - name: AZURE_STORAGE_ACCOUNT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .logicalbackup.secretName }}
                      key: AZURE_STORAGE_ACCOUNT_KEY
                - name: AZURE_STORAGE_CONTAINER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .logicalbackup.secretName }}
                      key: AZURE_STORAGE_CONTAINER
              {{- end }}
              {{- with .logicalbackup.extraEnv }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources:
                limits:
                  cpu: 100m
                  memory: 256Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                privileged: false
                readOnlyRootFilesystem: false
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          terminationGracePeriodSeconds: 300
{{- end }}
