{{- if and .Values.global.postgresql.enabled .Values.global.postgresql.backups.enabled }}
{{- $backups := .Values.global.postgresql.backups }}

apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Values.global.postgresql.instanceName }}-pgsql-backups

spec:
  configuration:
    {{- if $backups.endpointURL }}
    endpointURL: {{ $backups.endpointURL }}
    {{- end }}
    {{- if $backups.destinationPath }}
    destinationPath: {{ required ".postgresql.backups.destinationPath must be provided" $backups.destinationPath }}
    {{- end }}
    {{- if or (eq ($backups.cloud | default "") "aws") (eq ($backups.provider | default "") "aws") }}
    s3Credentials:
      {{- if ($backups.aws | default dict).enableKube2IAMIntegration }}
      inheritFromIAMRole: true
      {{- else }}
      {{- $secret := $backups.secretName | default (printf "%s-pgsql-backup-creds" .Values.global.postgresql.instanceName) }}
      accessKeyId:
        name: {{ $secret }}
        key: {{ $backups.accessKeyIdKey | default "ACCESS_KEY_ID" }}
      secretAccessKey:
        name: {{ $secret }}
        key: {{ $backups.secretAccessKeyKey | default "ACCESS_SECRET_KEY" }}
      {{- end }}
    {{- end }}

    {{- $wal := $backups.wal | default dict }}
    wal:
      compression: {{ $wal.compression | default "gzip" }}
      encryption: {{ $wal.encryption | default "AES256" }}
      maxParallel: {{ $wal.maxParallel | default 8 }}

  {{- with $backups.retentionPolicy }}
  retentionPolicy: {{ . }}
  {{- end }}
{{- end }}
