{{- if ((.Values.global).rabbitmq).enabled }}
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: {{ .Values.global.rabbitmq.instanceName }}
  labels:
    velero.io/exclude-from-backup: "true"
spec:
  replicas: {{ .Values.global.rabbitmq.replicas }}
  {{- /* Only with config: the operator drops an empty additionalConfig, which Argo CD then
       reports as OutOfSync forever. */}}
  {{- with .Values.global.rabbitmq.additionalConfig }}
  rabbitmq:
    additionalConfig: |
      {{- range $key, $value := . }}
      {{ $key }}: {{ $value }}
      {{- end }}
  {{- end }}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - {{ .Values.global.rabbitmq.instanceName }}
          topologyKey: kubernetes.io/hostname
  {{- /* Quoted: the API stores quantities as strings, and Argo CD does not normalise
       them in custom resources, so a bare 1 stays OutOfSync against "1". */}}
  resources:
    requests:
      cpu: {{ .Values.global.rabbitmq.resources.requests.cpu | quote }}
      memory: {{ .Values.global.rabbitmq.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.global.rabbitmq.resources.limits.cpu | quote }}
      memory: {{ .Values.global.rabbitmq.resources.limits.memory | quote }}
  {{- if .Values.global.rabbitmq.image }}
  image: {{ .Values.global.rabbitmq.image.repository }}:{{ .Values.global.rabbitmq.image.tag }}
  {{- end }}
{{- end }}
