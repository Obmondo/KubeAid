{{- /*
Traefik TLS-passthrough routes. The operator only gives us ClusterIP Services
(one per Pool, one for the Database); exposing them is still our job.
Service names follow the operator's controllers: Service name == CR name,
port name == "https".
*/}}
{{- if .Values.ingressRouteTCP.puppetserver.fqdn }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ .Release.Name }}-puppetserver
spec:
  entryPoints:
    - {{ .Values.ingressRouteTCP.entryPoint }}
  routes:
    - match: HostSNI(`{{ .Values.ingressRouteTCP.puppetserver.fqdn }}`)
      priority: 10
      services:
        - name: {{ include "openvox.poolServiceName" (dict "root" . "pool" .Values.ingressRouteTCP.puppetserver.pool) }}
          port: https
  tls:
    passthrough: true
{{- end }}
{{- if and .Values.ingressRouteTCP.puppetdb.fqdn (index .Values "openvox-stack" "database" "enabled") }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ .Release.Name }}-puppetdb
spec:
  entryPoints:
    - {{ .Values.ingressRouteTCP.entryPoint }}
  routes:
    - match: HostSNI(`{{ .Values.ingressRouteTCP.puppetdb.fqdn }}`)
      priority: 10
      services:
        - name: {{ include "openvox.databaseServiceName" . }}
          port: https
  tls:
    passthrough: true
{{- end }}
