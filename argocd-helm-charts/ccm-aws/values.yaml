aws-cloud-controller-manager:
  namespace: kube-system
  image:
    tag: v1.30.0
  args:
    - --v=2
    - --cloud-provider=aws
    - --use-service-account-credentials=true
    - --configure-cloud-routes=false
  # RBAC comes from the upstream defaults: clusterRoleRules, plus (since chart 0.0.12) a
  # kube-system Role that grants the controller service-account token creation.
