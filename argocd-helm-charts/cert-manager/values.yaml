cert-manager:
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
  installCRDs: true
  clusterResourceNamespace: cert-manager
  global:
    leaderElection:
      namespace: cert-manager
    revisionHistoryLimit: 0
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 4m
      memory: 64Mi
  cainjector:
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 1m
        memory: 64Mi
  webhook:
    resources:
      limits:
        memory: 32Mi
      requests:
        cpu: 1m
        memory: 16Mi

issuer:
  name: letsencrypt
  enabled: false
  production: false
  # Optional ACME preferred chain. Leave unset (do not use null) — the
  # ClusterIssuer template only renders this when set to a non-empty string.
  # preferredChain: "ISRG Root X1"
  solvers:
    - type: http
      http01:
        ingress:
          ingressClassName: traefik

networkpolicies: false
enableCertificateOwnerRef: true

global:
  netpol:
    # -- Master switch. Set to true to enable cert-manager CiliumNetworkPolicies.
    enabled: false
    traefik:
      namespace: traefik
      labels: {}

  certmanager:
    # -- Enable CiliumNetworkPolicies for controller, webhook, cainjector.
    netpol: false
    # -- Namespace where Prometheus runs (metrics scrape ingress rules).
    prometheusNamespace: monitoring
    # -- ACME endpoint FQDNs (egress from controller on port 443).
    acmeFQDNs:
      - acme-v02.api.letsencrypt.org
      - acme-staging-v02.api.letsencrypt.org
    # -- DNS-01 provider FQDNs (egress from controller on port 443).
    dns01FQDNs:
      - api.cloudflare.com
