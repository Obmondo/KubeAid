networkpolicies: false
fluent-bit:
  image:
    pullPolicy: IfNotPresent

  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 12m
      memory: 32Mi

  serviceMonitor:
    enabled: true
    namespace: logging
    interval: 30s
    scrapeTimeout: 30s
    jobLabel: fluentbit

  prometheusRule:
    enabled: true
    namespace: monitoring
    rules:
    - alert: NoOutputBytesProcessed
      expr: rate(fluentbit_output_proc_bytes_total[5m]) == 0
      annotations:
        message: |
          Fluent Bit instance {{ $labels.instance }}'s output plugin {{ $labels.name }} has not processed any
          bytes for at least 15 minutes.
        summary: No Output Bytes Processed
      for: 15m
      labels:
        severity: critical

  config:
    # Upstream default plus storage.path.
    service: |
      [SERVICE]
          Daemon Off
          Flush {{ .Values.flush }}
          Log_Level {{ .Values.logLevel }}
          Parsers_File /fluent-bit/etc/parsers.conf
          Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
          HTTP_Server On
          HTTP_Listen 0.0.0.0
          HTTP_Port {{ .Values.metricsPort }}
          Health_Check On
          # hostPath, so the buffer survives a pod restart.
          storage.path              /var/log/flb-storage/

    inputs: |
      [INPUT]
          Name                      tail
          Tag                       kube.*
          Path                      /var/log/containers/*.log
          multiline.parser          cri
          DB                        /var/log/fluentbit.db
          DB.Sync                   Normal
          Rotate_Wait               30
          # In memory mode, when the output is down, retried chunks pile up and
          # OOM the pod well before Mem_Buf_Limit is hit. See known-issues.md.
          storage.type              filesystem
          Mem_Buf_Limit             100MB
          Skip_Empty_Lines          On
          Refresh_Interval          10

    filters: |
      [FILTER]
          Name                      kubernetes
          Match                     kube.*
          Kube_URL                  https://kubernetes.default.svc.cluster.local:443
          # This filter enriches each log line by fetching that pod's object from
          # the API server. Buffer_Size caps that HTTP response, not the log line,
          # and the 32K default is smaller than a pod with a few containers and
          # long env blocks. On overflow the filter discards the whole response,
          # so the line still ships but arrives with no namespace_name or
          # container_name and cannot be found by any query on pod metadata.
          # 2M is above the ~1.5MB ceiling Kubernetes puts on a single object.
          Buffer_Size               2M
          Merge_Log                 Off
          K8S-Logging.Parser        On
          K8S-Logging.Exclude       On
          Labels                    Off
          Annotations               Off

      [FILTER]
          Name                      nest
          Match                     kube.*
          Operation                 lift
          Nested_under              kubernetes

    outputs: |
      [OUTPUT]
          Name                      stdout
          Match                     kube.*
