{{- if or .Values.customDNS.enabled .Values.rewrites -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "coredns.name" . }}
    {{- include "coredns.labels" . | nindent 4 }}
data:
{{- if .Values.rewrites }}
  # A server block cannot hold a rewrite: it belongs in the default one, which
  # imports *.override.
  kubeaid.override: |
  {{- range .Values.rewrites }}
    rewrite name exact {{ .from }} {{ .to }} answer auto
  {{- end }}
{{- end }}
{{- if .Values.customDNS.enabled }}
  custom-dns.server: |
  {{- range .Values.customDNS.domainList }}
    {{ . }} {
      errors
      {{- if $.Values.customDNS.cache }}
      cache {{ $.Values.customDNS.cache }}
      {{- end }}
      forward . {{ $.Values.customDNS.dnsServers }}
      log
    }
  {{- end }}
{{- end }}
{{- end -}}
