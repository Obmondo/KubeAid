{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vuls-dictionary.fullname" . }}
  labels:
    {{- include "vuls-dictionary.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if and .Values.vulsServer.enabled .Values.ingress.vulsServer.enabled .Values.ingress.vulsServer.inFlightReq.enabled }}
  {{- /* Attach the InFlightReq middleware; append to any middlewares the values already list. */}}
  {{- $key := "traefik.ingress.kubernetes.io/router.middlewares" }}
  {{- $mw := printf "%s-%s@kubernetescrd" .Release.Namespace (include "vuls-dictionary.inFlightReqMiddlewareName" .) }}
  {{- $existing := index $annotations $key }}
  {{- $_ := set $annotations $key (empty $existing | ternary $mw (printf "%s,%s" $existing $mw)) }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
  {{- if and .Values.vulsServer.enabled .Values.ingress.vulsServer.enabled }}
    {{- range .Values.ingress.vulsServer.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "vuls-dictionary.fullname" $ }}-vuls-server
                port:
                  number: {{ $.Values.vulsServer.port }}
          {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
