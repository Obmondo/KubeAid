# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

#This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}

securityContext: {}

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
  vulsServer:
    enabled: false
    hosts:
      - host: chart-example.local
        paths:
          - path: /vuls
            pathType: Prefix
    # Traefik only. Caps concurrent scan requests with an InFlightReq
    # middleware and attaches it to the Ingress. Vuls server mode has no cap
    # of its own: every request runs at once, each holds about 2.5 GB while
    # detecting, and a request keeps running after its client timed out, so a
    # few overlapping scans push the pod past its memory limit and none
    # finish. Size amount as vulsServer memory limit / 2.5 GB. Clients over
    # the cap get 429 straight away instead of hanging.
    inFlightReq:
      enabled: false
      amount: 2
  tls: []

nodeSelector: {}

tolerations: []

affinity: {}

vulsExporter:
  enabled: false
  image:
    repository: ghcr.io/obmondo/vuls-exporter
    tag: 1.3.4
    pullPolicy: IfNotPresent
  obmondo:
    url: ""
  interval: "12h"
  tls:
    secretName: ""
    certFile: /etc/ssl/vuls-exporter/tls.crt
    keyFile: /etc/ssl/vuls-exporter/tls.key
    caFile: ""
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

# vuls2 unified database.
vuls2:
  enabled: true
  image:
    repository: ghcr.io/vulsio/vuls-nightly-db
    tag: "0"
    pullPolicy: IfNotPresent
  dbPath: /vuls-db/vuls.db
  minDbSizeBytes: "5368709120"

vulsServer:
  enabled: true
  image:
    repository: vuls/vuls
    tag: "v0.41.0"
    pullPolicy: IfNotPresent
  port: 5515
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      # we don't set CPU limits because usage spike often times stays unpredictable
      # as observed in one of our customers
      memory: 512Mi
  resultsDir: /vuls/results
  databaseStorage:
    storageClass: ""
    size: 25Gi
    accessMode: ReadWriteOnce
  resultsStorage:
    storageClass: ""
    size: 15Gi
    accessMode: ReadWriteOnce
  resultRetention:
    enabled: true
    maxAgeDays: 7
    # How often the vuls-exporter sidecar re-runs the prune. The init container
    # only cleans at pod start; the sidecar enforces this policy periodically so
    # results do not accumulate between restarts.
    exporterInterval: "6h"
