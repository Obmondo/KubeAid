{{- if and .Values.providers.keycloak.enabled .Values.providers.keycloak.argocdClient.enabled }}

# Composite resource definition (XRD) for the Keycloak client ArgoCD logs its users in through:
# the confidential Client and its default scopes. ArgoCD authorizes on group membership, so the
# `groups` claim the scopes emit is what its RBAC policy matches on.
#
# Namespaced Crossplane v2 API: the Client reads its client secret from a Secret, which a managed
# resource resolves in its own namespace.

apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: argocdclients.keycloak.kubeaid.org
  annotations:
    {{- include "crossplane-provider.wave1" . | nindent 4 }}

spec:
  scope: Namespaced

  group: keycloak.kubeaid.org

  names:
    kind: ArgoCDClient
    plural: argocdclients

  enforcedCompositionRef:
    name: argocd-keycloak-client

  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Keycloak realm (forProvider.realmId) the client is created in.
                realm:
                  type: string

                # Which ProviderConfig the composed resources authenticate with.
                providerConfigRef:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - ClusterProviderConfig
                        - ProviderConfig
                      default: ClusterProviderConfig
                    name:
                      type: string
                      default: default

                # One client usually backs the ArgoCD of every cluster in the fleet, so these are
                # lists: one callback per ArgoCD, "<argocd URL>/auth/callback".
                validRedirectUris:
                  type: array
                  items:
                    type: string

                # Typically the bare ArgoCD URLs.
                validPostLogoutRedirectUris:
                  type: array
                  items:
                    type: string

                # Secret holding the client secret, in the XR's namespace. Keycloak is told this
                # value; it is not generated by Keycloak.
                clientSecret:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: clientSecret
                    # Bump to make the provider write the Secret's current value to Keycloak
                    # again. Write-only fields are never read back, so a rotated Secret alone is
                    # not noticed.
                    version:
                      type: integer
                      default: 1
                  required:
                    - name

                # Client scopes emitting groups propagated from another IdP, appended to the
                # client's default scopes: the `obmondo-keycloak-groups` scope
                # ObmondoKeycloakGroupsPropagation creates, or a scope from another brokered IdP.
                # The realm's own `groups` scope is already in the Composition. Name only scopes
                # that exist in the realm; Keycloak rejects the rest.
                propagatedGroupScopes:
                  type: array
                  items:
                    type: string
              required:
                - realm
                - validRedirectUris
                - clientSecret
{{- end }}
