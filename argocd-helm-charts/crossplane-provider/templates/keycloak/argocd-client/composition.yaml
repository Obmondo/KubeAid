{{- if and .Values.providers.keycloak.enabled .Values.providers.keycloak.argocdClient.enabled }}
# Composition behind the ArgoCDClient composite API. The client ID, the access type, the flows and
# the default scopes are static; only the realm, the callback URLs and the client-secret Secret
# come from the XR.

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: argocd-keycloak-client
  annotations:
    {{- include "crossplane-provider.wave2" . | nindent 4 }}

spec:
  compositeTypeRef:
    apiVersion: keycloak.kubeaid.org/v1alpha1
    kind: ArgoCDClient

  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources

        patchSets:
          - name: realm
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realm
                toFieldPath: spec.forProvider.realmId

          - name: providerConfig
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef.kind
                toFieldPath: spec.providerConfigRef.kind
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef.name
                toFieldPath: spec.providerConfigRef.name

        resources:
          - name: client
            base:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: argocd
              spec:
                forProvider:
                  clientId: argocd

                  # Access type credential : ArgoCD's dex authenticates with both the client ID
                  # and the secret, over the Authorization Code flow.
                  accessType: CONFIDENTIAL

                  standardFlowEnabled: true
                  directAccessGrantsEnabled: true
                  frontchannelLogoutEnabled: true

                  webOrigins:
                    - "*"
            patches:
              - type: PatchSet
                patchSetName: realm
              - type: PatchSet
                patchSetName: providerConfig
              - type: FromCompositeFieldPath
                fromFieldPath: spec.validRedirectUris
                toFieldPath: spec.forProvider.validRedirectUris
              - type: FromCompositeFieldPath
                fromFieldPath: spec.validPostLogoutRedirectUris
                toFieldPath: spec.forProvider.validPostLogoutRedirectUris
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clientSecret.name
                toFieldPath: spec.forProvider.clientSecretWoSecretRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clientSecret.key
                toFieldPath: spec.forProvider.clientSecretWoSecretRef.key
              # Keycloak never reads the client secret back, so a rotated Secret is only pushed
              # when this version is bumped.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clientSecret.version
                toFieldPath: spec.forProvider.clientSecretWoVersion

          - name: client-default-scopes
            base:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: ClientDefaultScopes
              metadata:
                name: argocd
              spec:
                forProvider:
                  clientIdRef:
                    name: argocd
                  defaultScopes:
                    - email
                    - groups
                    - profile

                    # Keycloak built-in scopes.
                    - acr
                    - basic
                    - web-origins
                    - roles
            patches:
              - type: PatchSet
                patchSetName: realm
              - type: PatchSet
                patchSetName: providerConfig
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.clientIdRef.namespace
              # Group scopes brokered from another IdP, appended to the list above rather than
              # replacing it.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.propagatedGroupScopes
                toFieldPath: spec.forProvider.defaultScopes
                policy:
                  mergeOptions:
                    appendSlice: true

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: auto-ready
{{- end }}
