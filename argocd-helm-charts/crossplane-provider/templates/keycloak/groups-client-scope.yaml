{{- if and .Values.providers.keycloak.enabled .Values.providers.keycloak.groupsClientScope.enabled }}

{{- $scope := .Values.providers.keycloak.groupsClientScope }}

{{- $namespace := include "crossplane-provider.keycloak.namespace" . }}
{{- $realm := include "crossplane-provider.keycloak.realm" . }}

# Client scope which gives the groups of this Keycloak to clients via a "groups" claim.
# For the groups from Obmondo's Keycloak, see obmondo-keycloak-groups-propagation.
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientScope
metadata:
  name: {{ $scope.name }}
  namespace: {{ $namespace }}
  annotations:
    {{- include "crossplane-provider.wave3" . | nindent 4 }}
spec:
  forProvider:
    realmId: {{ $realm | quote }}
    name: {{ $scope.name | quote }}
    includeInTokenScope: true
    consentScreenText: ""

---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: {{ $scope.name }}
  namespace: {{ $namespace }}
  annotations:
    {{- include "crossplane-provider.wave3" . | nindent 4 }}
spec:
  forProvider:
    realmId: {{ $realm | quote }}
    clientScopeIdRef:
      name: {{ $scope.name }}
      namespace: {{ $namespace }}
    name: {{ $scope.name | quote }}
    protocol: openid-connect
    protocolMapper: oidc-group-membership-mapper
    config:
      claim.name: groups
      full.path: "false"
      id.token.claim: "true"
      access.token.claim: "true"
      userinfo.token.claim: "true"
      introspection.token.claim: "false"
      lightweight.claim: "false"
{{- end }}
