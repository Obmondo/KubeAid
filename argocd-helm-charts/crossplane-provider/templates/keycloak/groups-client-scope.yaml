{{- if and .Values.providers.keycloak.enabled .Values.providers.keycloak.groupsClientScope.enabled }}
{{- $scope := .Values.providers.keycloak.groupsClientScope }}
{{- $namespace := include "crossplane-provider.keycloak.namespace" . }}
{{- $realm := include "crossplane-provider.keycloak.realm" . }}

# Client scope exposing the groups created in this Keycloak itself (as opposed to groups brokered
# from Obmondo's Keycloak, see obmondo-keycloak-groups-propagation) as a `groups` claim. Two plain managed
# resources rather than a Composition: there is nothing to compose.
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientScope
metadata:
  name: {{ $scope.name }}
  namespace: {{ $namespace }}
  annotations:
    {{- include "crossplane-provider.wave2" . | nindent 4 }}
spec:
  providerConfigRef:
    kind: {{ $scope.providerConfigRef.kind }}
    name: {{ $scope.providerConfigRef.name }}
  forProvider:
    realmId: {{ $realm | quote }}
    name: {{ $scope.name | quote }}
    includeInTokenScope: true
    consentScreenText: ""

---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: {{ $scope.name }}
  namespace: {{ $namespace }}
  annotations:
    {{- include "crossplane-provider.wave2" . | nindent 4 }}
spec:
  providerConfigRef:
    kind: {{ $scope.providerConfigRef.kind }}
    name: {{ $scope.providerConfigRef.name }}
  forProvider:
    realmId: {{ $realm | quote }}
    clientScopeIdRef:
      name: {{ $scope.name }}
      namespace: {{ $namespace }}
    name: {{ $scope.name | quote }}
    protocol: openid-connect
    protocolMapper: oidc-group-membership-mapper
    config:
      claim.name: groups
      # Group names without the leading slash, which is what consumers match on (the ArgoCD RBAC
      # policy, NetBird's JWT groups).
      full.path: {{ $scope.fullGroupPath | quote }}
      id.token.claim: "true"
      access.token.claim: "true"
      userinfo.token.claim: "true"
      introspection.token.claim: "false"
      lightweight.claim: "false"
{{- end }}
