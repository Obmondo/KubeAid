{{- if and .Values.providers.keycloak.enabled .Values.providers.keycloak.grafanaClient.enabled }}

# Composite resource definition (XRD) for the Keycloak client Grafana logs its users in through:
# the confidential Client, its default scopes, the client-role protocol mapper and the three roles
# Grafana maps onto its own permissions.
#
# Grafana authorizes on client roles, not on groups: its role_attribute_path reads
# resource_access.grafana.roles. Assigning those roles to users stays outside Crossplane, like
# group membership.

apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: grafanaclients.keycloak.kubeaid.org
  annotations:
    {{- include "crossplane-provider.wave1" . | nindent 4 }}

spec:
  scope: Namespaced

  group: keycloak.kubeaid.org

  names:
    kind: GrafanaClient
    plural: grafanaclients

  enforcedCompositionRef:
    name: grafana-keycloak-client

  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Keycloak realm (forProvider.realmId) the client is created in.
                realm:
                  type: string

                # Which ProviderConfig the composed resources authenticate with.
                providerConfigRef:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - ClusterProviderConfig
                        - ProviderConfig
                      default: ClusterProviderConfig
                    name:
                      type: string
                      default: default

                # One client usually backs the Grafana of every cluster in the fleet, so these are
                # lists: one callback per Grafana, "<grafana URL>/login/generic_oauth".
                validRedirectUris:
                  type: array
                  items:
                    type: string

                # Typically "<grafana URL>/login".
                validPostLogoutRedirectUris:
                  type: array
                  items:
                    type: string

                # Secret holding the client secret, in the XR's namespace. Keycloak is told this
                # value; it is not generated by Keycloak.
                clientSecret:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: clientSecret
                    # Bump to make the provider write the Secret's current value to Keycloak
                    # again. Write-only fields are never read back, so a rotated Secret alone is
                    # not noticed.
                    version:
                      type: integer
                      default: 1
                  required:
                    - name
              required:
                - realm
                - validRedirectUris
                - clientSecret
{{- end }}
