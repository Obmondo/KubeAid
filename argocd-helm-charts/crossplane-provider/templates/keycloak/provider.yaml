{{- if .Values.providers.keycloak.enabled }}
# Keycloak provider (crossplane-contrib). Sync wave 0: the ClusterProviderConfig and the realm
# resources rendered by this chart and by the keycloakx chart need the CRDs this package installs.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-keycloak
  annotations:
    {{- include "crossplane-provider.wave0" . | nindent 4 }}
spec:
  package: {{ .Values.providers.keycloak.provider.package }}:{{ .Values.providers.keycloak.provider.version }}
  runtimeConfigRef:
    name: provider-keycloak

---
# Management policies let a Realm or User opt out of Delete, so removing it from git does not
# delete it in Keycloak. Beta feature, switched on per provider.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-keycloak
  annotations:
    {{- include "crossplane-provider.wave0" . | nindent 4 }}
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              args:
                - --enable-management-policies
{{- end }}
