{{- if and .Values.providers.keycloak.enabled .Values.providers.keycloak.openobserveClient.enabled }}
# Composition behind the OpenObserveClient composite API. The client ID, the access type, the
# flows, the scopes and the role mapper are static; only the realm, Dex's callbacks and the
# client-secret Secret come from the XR.

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: openobserve-keycloak-client
  annotations:
    {{- include "crossplane-provider.wave2" . | nindent 4 }}

spec:
  compositeTypeRef:
    apiVersion: keycloak.kubeaid.org/v1alpha1
    kind: OpenObserveClient

  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources

        patchSets:
          - name: realm
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realm
                toFieldPath: spec.forProvider.realmId

          - name: providerConfig
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef.kind
                toFieldPath: spec.providerConfigRef.kind
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef.name
                toFieldPath: spec.providerConfigRef.name

          # Every resource below the client references it by object name.
          - name: clientRef
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.clientIdRef.namespace

        resources:
          - name: client
            base:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: openobserve-dex
              spec:
                forProvider:
                  clientId: openobserve-dex

                  accessType: CONFIDENTIAL

                  # Dex only ever runs the Authorization Code flow against this client.
                  standardFlowEnabled: true
                  directAccessGrantsEnabled: false
                  frontchannelLogoutEnabled: false
            patches:
              - type: PatchSet
                patchSetName: realm
              - type: PatchSet
                patchSetName: providerConfig
              - type: FromCompositeFieldPath
                fromFieldPath: spec.validRedirectUris
                toFieldPath: spec.forProvider.validRedirectUris
              - type: FromCompositeFieldPath
                fromFieldPath: spec.webOrigins
                toFieldPath: spec.forProvider.webOrigins
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clientSecret.name
                toFieldPath: spec.forProvider.clientSecretWoSecretRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clientSecret.key
                toFieldPath: spec.forProvider.clientSecretWoSecretRef.key
              # Keycloak never reads the client secret back, so a rotated Secret is only pushed
              # when this version is bumped.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clientSecret.version
                toFieldPath: spec.forProvider.clientSecretWoVersion

          - name: client-default-scopes
            base:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: ClientDefaultScopes
              metadata:
                name: openobserve-dex
              spec:
                forProvider:
                  clientIdRef:
                    name: openobserve-dex
                  defaultScopes:
                    - email
                    - profile

                    # Keycloak built-in scopes.
                    - acr
                    - basic
                    - web-origins
                    - roles
            patches:
              - type: PatchSet
                patchSetName: realm
              - type: PatchSet
                patchSetName: providerConfig
              - type: PatchSet
                patchSetName: clientRef

          # Dex asks for offline_access to get a refresh token, so it has to be available to the
          # client without being granted by default.
          - name: client-optional-scopes
            base:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: ClientOptionalScopes
              metadata:
                name: openobserve-dex
              spec:
                forProvider:
                  clientIdRef:
                    name: openobserve-dex
                  optionalScopes:
                    - offline_access
            patches:
              - type: PatchSet
                patchSetName: realm
              - type: PatchSet
                patchSetName: providerConfig
              - type: PatchSet
                patchSetName: clientRef

          # Emits the client roles as a `role` claim, which OpenObserve authorizes on.
          - name: client-roles-mapper
            base:
              apiVersion: client.keycloak.m.crossplane.io/v1alpha1
              kind: ProtocolMapper
              metadata:
                name: openobserve-dex-roles
              spec:
                forProvider:
                  clientIdRef:
                    name: openobserve-dex
                  name: openobserve-dex-roles
                  protocol: openid-connect
                  protocolMapper: oidc-usermodel-client-role-mapper
                  config:
                    usermodel.clientRoleMapping.clientId: openobserve-dex
                    claim.name: role
                    jsonType.label: String
                    multivalued: "true"
                    id.token.claim: "true"
                    access.token.claim: "true"
                    userinfo.token.claim: "true"
            patches:
              - type: PatchSet
                patchSetName: realm
              - type: PatchSet
                patchSetName: providerConfig
              - type: PatchSet
                patchSetName: clientRef

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: auto-ready
{{- end }}
