{{- if and .Values.providers.keycloak.enabled .Values.providers.keycloak.openobserveClient.enabled }}

# Composite resource definition (XRD) for the Keycloak client OpenObserve logs its users in
# through. OpenObserve does not speak OIDC itself: Dex sits in front of it, so this is the client
# Dex is configured with, and the callbacks are Dex's.
#
# OpenObserve authorizes on a `role` claim, which the client-role protocol mapper emits from the
# client roles. Creating and assigning those roles stays outside Crossplane.

apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: openobserveclients.keycloak.kubeaid.org
  annotations:
    {{- include "crossplane-provider.wave1" . | nindent 4 }}

spec:
  scope: Namespaced

  group: keycloak.kubeaid.org

  names:
    kind: OpenObserveClient
    plural: openobserveclients

  enforcedCompositionRef:
    name: openobserve-keycloak-client

  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Keycloak realm (forProvider.realmId) the client is created in.
                realm:
                  type: string

                # Which ProviderConfig the composed resources authenticate with.
                providerConfigRef:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - ClusterProviderConfig
                        - ProviderConfig
                      default: ClusterProviderConfig
                    name:
                      type: string
                      default: default

                # One callback per Dex, "<openobserve dex URL>/dex/callback".
                validRedirectUris:
                  type: array
                  items:
                    type: string

                # Typically the bare Dex URLs. Dex is a server-side client, so unlike a browser
                # app these are not "*".
                webOrigins:
                  type: array
                  items:
                    type: string

                # Secret holding the client secret, in the XR's namespace. Keycloak is told this
                # value; it is not generated by Keycloak, so the same Secret can be handed to Dex.
                clientSecret:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: clientSecret
                    # Bump to make the provider write the Secret's current value to Keycloak
                    # again. Write-only fields are never read back, so a rotated Secret alone is
                    # not noticed.
                    version:
                      type: integer
                      default: 1
                  required:
                    - name
              required:
                - realm
                - validRedirectUris
                - clientSecret
{{- end }}
