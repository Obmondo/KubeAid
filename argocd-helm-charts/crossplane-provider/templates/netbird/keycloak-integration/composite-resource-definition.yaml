{{- if and .Values.providers.netbird.enabled .Values.providers.netbird.keycloakIntegration.enabled }}

apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: keycloakintegrations.netbird.kubeaid.org
  annotations:
    {{- include "crossplane-provider.wave1" . | nindent 4 }}

spec:
  scope: Namespaced

  group: netbird.kubeaid.org

  names:
    kind: KeycloakIntegration
    plural: keycloakintegrations

  enforcedCompositionRef:
    name: netbird-keycloak-integration

  versions:
    - name: v1alpha1
      served: true
      # Indicates which version of the schema Compositions use. Only one version can be
      # referenceable.
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Keycloak realm (forProvider.realmId) every object is created in. The realm
                # itself is not managed here.
                realm:
                  type: string

                # Public URL of the NetBird dashboard, used for the public client's root and base
                # URL and for its redirect URIs.
                dashboardURL:
                  type: string

                # Which ProviderConfig the composed resources authenticate with.
                providerConfigRef:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - ClusterProviderConfig
                        - ProviderConfig
                      default: ClusterProviderConfig
                    name:
                      type: string
                      default: default

                # Service account NetBird's management service authenticates as over the Keycloak
                # Admin API (IdpManagerConfig username / password in the NetBird management
                # config), and the identity the admin logs into the dashboard with — which makes
                # it the owner of the NetBird account.
                idpServiceAccount:
                  type: object
                  properties:
                    username:
                      type: string
                      default: netbird
                    email:
                      type: string
                    firstName:
                      type: string
                    lastName:
                      type: string
                    # Secret holding the account's initial password, in the XR's namespace.
                    initialPasswordSecret:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: password
                      required:
                        - name
                  required:
                    - initialPasswordSecret

                # Confidential client NetBird management uses for the Keycloak Admin API. Its
                # client ID, and the view-users role its service account gets on
                # realm-management, are fixed by the Composition.
                backendClient:
                  type: object
                  properties:
                    # Secret holding the client secret, in the XR's namespace. Keycloak is told
                    # this value; it is not generated by Keycloak.
                    clientSecret:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: clientSecret
                        # Bump to make the provider write the Secret's current value to Keycloak
                        # again. Write-only fields are never read back, so a changed Secret alone
                        # is not noticed.
                        version:
                          type: integer
                          default: 1
                      required:
                        - name
                  required:
                    - clientSecret

                # Public client the dashboard and the NetBird clients authenticate through
                # (device authorization and PKCE flows). Its client ID, and the `api` client scope
                # carrying the Management API audience mapper, are fixed by the Composition.
                dashboardClient:
                  type: object
                  properties:
                    # Client scopes emitting groups propagated from another IdP, appended to the
                    # client's default scopes: the `obmondo-keycloak-groups` scope
                    # ObmondoKeycloakGroupsPropagation creates, or a scope from another brokered IdP. The
                    # realm's own `groups` scope is already in the Composition. Name only scopes
                    # that exist in the realm; Keycloak rejects the rest. NetBird acts on the
                    # claim they emit once jwt_groups_enabled is set on its account.
                    propagatedGroupScopes:
                      type: array
                      items:
                        type: string
              required:
                - realm
                - dashboardURL
                - idpServiceAccount
                - backendClient
                - dashboardClient
{{- end }}
