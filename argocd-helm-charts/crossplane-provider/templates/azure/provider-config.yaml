{{- if .Values.providers.azure.enabled }}
# Azure credentials for every Azure managed resource. Sync wave 1: its CRD only exists once the
# azure family provider (pulled in by azure-network) is installed.
apiVersion: azure.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    {{- include "crossplane-provider.wave1" . | nindent 4 }}
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: {{ .Release.Namespace }}
      name: {{ .Values.providers.azure.credentials.secretName }}
      key: {{ .Values.providers.azure.credentials.secretKey }}
{{- end }}
