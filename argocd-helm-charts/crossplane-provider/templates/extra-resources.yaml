# Raw managed resources (or any other object) that this chart does not model yet, taken from
# `providers.<provider>.extraResources` of every enabled provider and rendered verbatim in sync
# wave 2. Annotations set on the resource win over the defaults added here.
{{- range $provider, $config := .Values.providers }}
{{- if $config.enabled }}
{{- range $config.extraResources }}
{{- $resource := deepCopy . }}
{{- $metadata := $resource.metadata | default dict }}
{{- $defaults := dict "argocd.argoproj.io/sync-wave" "2" "argocd.argoproj.io/sync-options" "SkipDryRunOnMissingResource=true" }}
{{- $_ := set $metadata "annotations" (merge ($metadata.annotations | default dict) $defaults) }}
{{- $_ := set $resource "metadata" $metadata }}
---
{{ toYaml $resource }}
{{- end }}
{{- end }}
{{- end }}
