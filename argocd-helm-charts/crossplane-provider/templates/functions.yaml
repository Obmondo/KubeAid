{{- if include "crossplane-provider.compositionsEnabled" . }}
# Composition pipeline functions used by every KubeAid Composition in this chart (the Azure
# composite APIs and the NetBird Keycloak integration). Installed once, in sync wave 0, as soon as
# any of them is enabled.

apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: patch-and-transform
  annotations:
    {{- include "crossplane-provider.wave0" . | nindent 4 }}
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.9.0

---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: go-templating
  annotations:
    {{- include "crossplane-provider.wave0" . | nindent 4 }}
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.10.0

---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: auto-ready
  annotations:
    {{- include "crossplane-provider.wave0" . | nindent 4 }}
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.5.0
{{- end }}
