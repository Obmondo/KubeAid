suite: keycloak provider
templates:
  - keycloak/provider.yaml
release:
  name: crossplane-provider
  namespace: crossplane
set:
  providers.keycloak.enabled: true
tests:
  - it: renders the Provider pinned to the configured package version in sync wave 0
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Provider
        documentIndex: 0
      - isAPIVersion:
          of: pkg.crossplane.io/v1
        documentIndex: 0
      - equal:
          path: metadata.name
          value: provider-keycloak
        documentIndex: 0
      - equal:
          path: spec.package
          value: xpkg.upbound.io/crossplane-contrib/provider-keycloak:v2.18.0
        documentIndex: 0
      - equal:
          path: spec.runtimeConfigRef.name
          value: provider-keycloak
        documentIndex: 0
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "0"
        documentIndex: 0

  - it: renders a DeploymentRuntimeConfig that turns on management policies
    asserts:
      - isKind:
          of: DeploymentRuntimeConfig
        documentIndex: 1
      - equal:
          path: metadata.name
          value: provider-keycloak
        documentIndex: 1
      - contains:
          path: spec.deploymentTemplate.spec.template.spec.containers[0].args
          content: --enable-management-policies
        documentIndex: 1

  - it: follows a provider version override
    set:
      providers.keycloak.provider.version: v2.19.0
    asserts:
      - equal:
          path: spec.package
          value: xpkg.upbound.io/crossplane-contrib/provider-keycloak:v2.19.0
        documentIndex: 0
