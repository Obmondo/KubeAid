suite: extraResources pass-through
templates:
  - extra-resources.yaml
release:
  name: crossplane-provider
  namespace: crossplane
set:
  providers.azure.enabled: true
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders raw resources verbatim with the wave-2 annotations added
    set:
      providers.azure.extraResources:
        - apiVersion: example.m.upbound.io/v1alpha1
          kind: Thing
          metadata:
            name: raw
            namespace: crossplane
          spec:
            forProvider:
              size: 3
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Thing
      - equal:
          path: metadata.name
          value: raw
      - equal:
          path: spec.forProvider.size
          value: 3
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "3"
            argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

  - it: lets the resource keep its own annotations and override the wave
    set:
      providers.azure.extraResources:
        - apiVersion: example.m.upbound.io/v1alpha1
          kind: Thing
          metadata:
            name: early
            annotations:
              argocd.argoproj.io/sync-wave: "2"
              crossplane.io/external-name: existing
    asserts:
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "2"
            argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
            crossplane.io/external-name: existing

  - it: collects extraResources from every enabled provider
    set:
      providers.scaleway.enabled: true
      providers.azure.extraResources:
        - apiVersion: example.m.upbound.io/v1alpha1
          kind: Thing
          metadata:
            name: from-azure
      providers.scaleway.extraResources:
        - apiVersion: example.m.upbound.io/v1alpha1
          kind: Thing
          metadata:
            name: from-scaleway
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: from-azure
        documentIndex: 0
      - equal:
          path: metadata.name
          value: from-scaleway
        documentIndex: 1

  - it: ignores extraResources of a provider that is not enabled
    set:
      providers.azure.enabled: false
      providers.azure.extraResources:
        - apiVersion: example.m.upbound.io/v1alpha1
          kind: Thing
          metadata:
            name: from-azure
    asserts:
      - hasDocuments:
          count: 0
