suite: azure providers and functions
templates:
  - azure/providers.yaml
  - functions.yaml
release:
  name: crossplane-provider
  namespace: crossplane
set:
  providers.azure.enabled: true
tests:
  - it: installs the five Azure providers in sync wave 0
    template: azure/providers.yaml
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: Provider
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
      - equal:
          path: metadata.name
          value: azure-network
        documentIndex: 0
      - equal:
          path: spec.package
          value: xpkg.crossplane.io/crossplane-contrib/provider-azure-network:v1.11.2
        documentIndex: 0
      - equal:
          path: metadata.name
          value: azure-authorization
        documentIndex: 4

  - it: installs the three composition functions in sync wave 0
    template: functions.yaml
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Function
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
      - equal:
          path: metadata.name
          value: patch-and-transform
        documentIndex: 0
      - equal:
          path: metadata.name
          value: go-templating
        documentIndex: 1
      - equal:
          path: metadata.name
          value: auto-ready
        documentIndex: 2
