suite: azure compositions
templates:
  - azure/workload-identity-infrastructure/composite-resource-definition.yaml
  - azure/workload-identity-infrastructure/composition.yaml
  - azure/disaster-recovery-infrastructure/composite-resource-definition.yaml
  - azure/disaster-recovery-infrastructure/composition.yaml
release:
  name: crossplane-provider
  namespace: crossplane
set:
  providers.azure.enabled: true
tests:
  - it: installs only the workload identity XRD and Composition by default
    asserts:
      - hasDocuments:
          count: 1
        template: azure/workload-identity-infrastructure/composite-resource-definition.yaml
      - hasDocuments:
          count: 1
        template: azure/workload-identity-infrastructure/composition.yaml
      - hasDocuments:
          count: 0
        template: azure/disaster-recovery-infrastructure/composite-resource-definition.yaml
      - hasDocuments:
          count: 0
        template: azure/disaster-recovery-infrastructure/composition.yaml

  - it: puts the XRD in sync wave 1 and the Composition in sync wave 2
    asserts:
      - isKind:
          of: CompositeResourceDefinition
        template: azure/workload-identity-infrastructure/composite-resource-definition.yaml
      - equal:
          path: metadata.name
          value: xworkloadidentityinfrastructures.azure.kubeaid.org
        template: azure/workload-identity-infrastructure/composite-resource-definition.yaml
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "1"
            argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        template: azure/workload-identity-infrastructure/composite-resource-definition.yaml
      - isKind:
          of: Composition
        template: azure/workload-identity-infrastructure/composition.yaml
      - equal:
          path: metadata.name
          value: workload-identity-infrastructure
        template: azure/workload-identity-infrastructure/composition.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: azure/workload-identity-infrastructure/composition.yaml
      - equal:
          path: spec.compositeTypeRef.kind
          value: XWorkloadIdentityInfrastructure
        template: azure/workload-identity-infrastructure/composition.yaml

  - it: installs the disaster recovery XRD and Composition when enabled
    set:
      providers.azure.compositions.disasterRecoveryInfrastructure.enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: azure/disaster-recovery-infrastructure/composite-resource-definition.yaml
      - equal:
          path: metadata.name
          value: xdisasterrecoveryinfrastructures.azure.kubeaid.org
        template: azure/disaster-recovery-infrastructure/composite-resource-definition.yaml
      - hasDocuments:
          count: 1
        template: azure/disaster-recovery-infrastructure/composition.yaml
      - equal:
          path: metadata.name
          value: disaster-recovery-infrastructure
        template: azure/disaster-recovery-infrastructure/composition.yaml

  - it: can switch the workload identity composition off
    set:
      providers.azure.compositions.workloadIdentityInfrastructure.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: azure/workload-identity-infrastructure/composite-resource-definition.yaml
      - hasDocuments:
          count: 0
        template: azure/workload-identity-infrastructure/composition.yaml
