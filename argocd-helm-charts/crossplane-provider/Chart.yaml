apiVersion: v2
name: crossplane-provider
description: Crossplane providers, provider configs and the managed resources KubeAid models for each cloud, enabled per provider from values
version: 1.1.0
dependencies:
  - name: azure
    version: 1.0.0
    repository: file://charts/azure
    condition: azure.enabled
  - name: scaleway
    version: 1.0.0
    repository: file://charts/scaleway
    condition: scaleway.enabled
  - name: keycloak
    version: 1.0.0
    repository: file://charts/keycloak
    condition: keycloak.enabled
  - name: crossview
    version: 4.6.0
    repository: https://crossplane-contrib.github.io/crossview
    condition: crossview.enabled
  - name: kubeaid-addons
    version: 1.1.0
    repository: file://../kubeaid-addons
