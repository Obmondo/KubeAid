# Every provider is a sub-chart switched on with `<provider>.enabled: true`, the way
# capi-cluster enables its infrastructure providers. Each sub-chart ships the Crossplane
# Provider package, its runtime config, the ProviderConfig / ClusterProviderConfig reading the
# credentials Secret, and the managed resources KubeAid models for that provider. The whole chart
# syncs as ONE ArgoCD Application: Providers go in sync wave 0, provider configs and XRDs in wave 1,
# Compositions and managed resources in wave 2 (see README).
#
# Resource types a sub-chart does not model yet go into `<provider>.extraResources` as raw YAML.

azure:
  enabled: false
  compositions:
    workloadIdentityInfrastructure:
      enabled: true
    disasterRecoveryInfrastructure:
      enabled: false
  # Secret with the Azure Service Principal credentials, in the release namespace.
  credentials:
    secretName: azure-credentials
    secretKey: credentials
  extraResources: []

scaleway:
  enabled: false
  provider:
    package: xpkg.upbound.io/scaleway/provider-scaleway
    version: v0.6.0
  # Secret with the Scaleway API key, in the release namespace, created out of band (for example
  # by the cluster's sealed-secrets app).
  credentials:
    secretName: scaleway-credentials
    secretKey: credentials
  # Scaleway project every managed resource is created in. Required once buckets are configured.
  projectId: ""
  region: fr-par
  # When set, a bucket's Scaleway name becomes "<name>.<bucketNameSuffix>" unless the bucket sets
  # `bucketName` explicitly. Typically the cluster name, since bucket names are global per region.
  bucketNameSuffix: ""
  # Tags applied to every bucket. Per-bucket `tags` are merged on top.
  tags: {}
  # Management policies for every managed resource. Delete is intentionally left out so removing a
  # bucket from values never deletes data in Scaleway. A bucket may override this.
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  buckets: []
  # - name: backups                      # Bucket resource name (namespace = release namespace)
  #   bucketName: ""                     # Scaleway bucket name; defaults to the suffix rule above
  #   externalName: ""                   # crossplane.io/external-name ("<region>/<bucket name>") to adopt an existing bucket
  #   versioning: false
  #   objectLock:
  #     enabled: false                   # also renders a LockConfiguration for the bucket
  #     retention:
  #       mode: GOVERNANCE
  #       days: 30
  #   lifecycleRules: []                 # passed through verbatim as forProvider.lifecycleRule
  #   tags: {}
  #   managementPolicies: []             # overrides scaleway.managementPolicies for this bucket
  extraResources: []

keycloak:
  enabled: false
  provider:
    package: xpkg.upbound.io/crossplane-contrib/provider-keycloak
    version: v2.18.0
  # The ClusterProviderConfig and the Realm / User / Client resources for a Keycloak that KubeAid
  # deploys live in the keycloakx chart, next to the Secrets they reference. This sub-chart only
  # installs the provider package.
  extraResources: []

global:
  # CloudNativePG cluster for Crossview, rendered by kubeaid-addons as
  # <instanceName>-pgsql (service <instanceName>-pgsql-rw, credentials in
  # Secret <instanceName>-pgsql-app). Requires the cloudnative-pg operator.
  # Leave disabled when Crossview uses a database managed elsewhere.
  postgresql:
    enabled: false
    instanceName: crossview
    database: crossview
    owner: crossview
    instances: 1
    size: 2Gi

# Crossview, the web UI for Crossplane: https://github.com/crossplane-contrib/crossview
crossview:
  enabled: false

  image:
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: null

  # Upstream defaults to the nginx ingress class and nginx annotations.
  ingress:
    enabled: false
    className: traefik-cert-manager
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: null
      nginx.ingress.kubernetes.io/force-ssl-redirect: null
    hosts:
      - host: crossview.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - crossview.example.com
        secretName: crossview.example.com

  # The upstream single-pod postgres:latest Deployment. Off, in favour of
  # CloudNativePG (global.postgresql above, or an existing cluster).
  database:
    enabled: false

  config:
    database:
      enabled: true
      # Defaults match the kubeaid-addons cluster above. To use an existing
      # CNPG cluster, point host at its -rw service and secrets.dbPassword at
      # its -app Secret; database and username must match its initdb owner.
      host: crossview-pgsql-rw
      port: 5432
      database: crossview
      username: crossview
      ssl:
        mode: require
    server:
      auth:
        mode: session
      cors:
        # Public URL of Crossview, no trailing slash. Also the post-SSO redirect target.
        origin: https://crossview.example.com
    sso:
      # Keycloak example. The client secret goes in secrets.OIDCClientSecret.
      #   oidc:
      #     enabled: true
      #     issuer: https://keycloak.example.com/auth/realms/<realm>
      #     clientId: crossview
      #     callbackURL: https://crossview.example.com/api/auth/oidc/callback
      oidc:
        enabled: false
      saml:
        enabled: false

  # Crossview falls back to admin/password and a hard-coded session secret when
  # these are unset, so they are read from a Secret you provide (e.g. a
  # SealedSecret named crossview-auth with keys admin-password and session-secret).
  secrets:
    adminUsername: admin
    adminPassword:
      secretKeyRef:
        name: crossview-auth
        key: admin-password
    sessionSecret:
      secretKeyRef:
        name: crossview-auth
        key: session-secret
    dbPassword:
      secretKeyRef:
        name: crossview-pgsql-app
        key: password
    OIDCClientSecret: ""
