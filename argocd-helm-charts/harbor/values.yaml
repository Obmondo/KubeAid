---
global:
  netpol:
    enabled: false
  harbor:
    netpol: false

  # Opt-in PriorityClass for Harbor's own components. Worth enabling when Harbor is
  # used as a pull-through cache, since image pulls across the whole cluster end up
  # depending on its availability. Reference the name via harbor.<component>.priorityClassName.
  priorityClass:
    enabled: false
    entries:
      - name: harbor-critical
        value: 900000
        description: "Used by Harbor components; cluster-wide image pulls may depend on Harbor's availability."

  # Opt-in PodDisruptionBudgets for portal/core/jobservice/registry. Only enable this
  # for components whose replicas is >= 2 (harbor.<component>.replicas) - with a single
  # replica, maxUnavailable: 1 would block voluntary node drains/evictions entirely.
  podDisruptionBudget:
    enabled: false
    entries:
      - name: harbor-portal
        maxUnavailable: 1
        matchLabels:
          component: portal
      - name: harbor-core
        maxUnavailable: 1
        matchLabels:
          component: core
      - name: harbor-jobservice
        maxUnavailable: 1
        matchLabels:
          component: jobservice
      - name: harbor-registry
        maxUnavailable: 1
        matchLabels:
          component: registry

  postgresql:
    enabled: true
    instanceName: harbor
    monitoring:
      enablePodMonitor: true
    instances: 2
    size: 3Gi
    recover:
      enabled: false
    backups:
      enabled: false
      schedule: "0 2 * * *"
      retentionPolicy: 30d
      provider: aws
      aws:
        enableKube2IAMIntegration: true
    logicalbackup:
      enabled: false
      schedule: "0 2 * * *"
      provider: s3
      retention: "30d"
    resources:
      limits:
        memory: 800Mi
        cpu: 250m
      requests:
        memory: 500Mi
        cpu: 250m

harbor:
  persistence:
    enabled: true
    persistentVolumeClaim:
      accessMode: ReadWriteMany
      registry:
        size: 20Gi
  core:
    revisionHistoryLimit: 0
    initContainers:
      - name: pgchecker
        image: docker.io/busybox:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
        command:
          - sh
          - -c
          - |
            echo 'Waiting for PostgreSQL to become ready...'
            until printf "." && nc -z -w 2 harbor-pgsql-rw 5432; do
                sleep 2;
            done;
            echo 'PostgreSQL OK ✓'
        resources:
          requests:
            cpu: "2m"
            memory: "5Mi"
          limits:
            memory: "5Mi"
      - name: redischecker
        image: docker.io/busybox:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
        command:
          - sh
          - -c
          - |
            echo 'Waiting for Redis master to become ready...'
            until printf "." && nc -z -w 2 harbor-redis 6379; do
                sleep 2;
            done;
            echo 'Redis master OK ✓'
        resources:
          requests:
            cpu: "2m"
            memory: "5Mi"
          limits:
            memory: "5Mi"
  jobservice:
    revisionHistoryLimit: 0
    initContainers:
      - name: harbor-core-checker
        image: docker.io/busybox:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
        command:
          - sh
          - -c
          - |
            echo 'Waiting for Harbor core service to become ready...'
            until printf "." && nc -z -w 2 harbor-core 80; do
                sleep 2;
            done;
            echo 'Harbor core service OK ✓'
        resources:
          requests:
            cpu: "2m"
            memory: "5Mi"
          limits:
            memory: "5Mi"
  portal:
    revisionHistoryLimit: 0
  registry:
    revisionHistoryLimit: 0
  database:
    type: external
    external:
      host: harbor-pgsql-rw
      username: harbor
      existingSecret: harbor-pgsql-app
  redis:
    type: external
    external:
      addr: harbor-redis:6379


# Tag retention and garbage collection, applied through the Harbor API by the
# harbor-policies CronJob (Harbor stores both in its database, not in config).
# Each run creates or updates the policies to match these values.
policies:
  enabled: false
  # When the CronJob applies the policies (Kubernetes cron, 5 fields).
  schedule: "0 1 * * *"
  # Log what would be created or updated without changing anything.
  dryRun: false
  # Defaults to http://<release>-core, user admin, and the password from
  # harbor.existingSecretAdminPassword / existingSecretAdminPasswordKey.
  # harborURL: ""
  # username: admin
  # passwordSecret: ""
  # passwordSecretKey: HARBOR_ADMIN_PASSWORD
  #
  # One policy per project. An artifact is kept if any rule keeps it; all
  # others are deleted when the policy runs. Rule templates (Harbor's names):
  #   latestPushedK       keep the <value> most recently pushed
  #   latestPulledN       keep the <value> most recently pulled
  #   nDaysSinceLastPush  keep those pushed within the last <value> days
  #   nDaysSinceLastPull  keep those pulled within the last <value> days
  #   always              keep everything matched (no value)
  # repositories and tags are doublestar patterns (default "**"); {a,b} matches
  # either. untagged: true makes the rule also keep untagged artifacts.
  # schedule is Harbor cron, 6 fields with seconds first; "" means manual only.
  retention: []
  # - project: library
  #   schedule: "0 0 2 * * 0"
  #   rules:
  #     - template: latestPushedK
  #       value: 10
  #     - template: nDaysSinceLastPull
  #       value: 30
  #     - template: always
  #       tags: "{latest,v1.2.3}"
  #
  # Retention only deletes artifacts; GC is what frees the registry storage.
  # schedule is Harbor cron (6 fields).
  gc:
    enabled: false
    schedule: "0 0 5 * * 0"
    deleteUntagged: true
    workers: 1

redis:
  replicas: 3
  name: harbor-redis
  storage: 4Gi
