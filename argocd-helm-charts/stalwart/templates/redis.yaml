{{- if .Values.redis.enabled }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ include "stalwart.redisName" . }}
  # Not stalwart.labels: the operator copies these onto the Redis pod, and the
  # Stalwart Services/PDB select on app.kubernetes.io/name + instance.
  labels:
    app.kubernetes.io/name: {{ include "stalwart.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  kubernetesConfig:
    image: {{ .Values.redis.image }}
    imagePullPolicy: IfNotPresent
    {{- with .Values.redis.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    imagePullPolicy: IfNotPresent
  storage:
    volumeClaimTemplate:
      spec:
        {{- with .Values.redis.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
{{- end }}
