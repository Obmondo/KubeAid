## Global Docker image parameters
## Please, note that this will override the image parameters, configured to use the global value
## Current available global Docker image parameters: imageRegistry, imagePullSecrets and storageClass
 # -- Globals settings
global:
  ## As:
  ## imageRegistry: "docker.io"
  # -- Global image registry
  imageRegistry: ""
  ## As:
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  # -- Global image pull secrets
  imagePullSecrets: []

# -- Namespace to install Matomo in, default matomo.
namespace: matomo

matomo:
  # -- Image registry to use.
  imageRegistry: ""
  ## As:
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  # -- Image pull secrets for Matomo.
  imagePullSecrets: []
  # -- Which image to use for Matomo deployment.
  image: digitalist/matomo:5.12.0
  # -- Image for the php-fpm_exporter (fpm-metrics) sidecar shared by the
  # dashboard and tracker pods. Override per-workload via
  # `matomo.dashboard.exporter.image` / `matomo.tracker.exporter.image`.
  exporterImage: hipages/php-fpm_exporter:2.2.0
  # -- run container as user id.
  runAsUser: 82
  # -- Mount the service account token into Matomo pods. No workload in this
  # chart uses the Kubernetes API; enable only if a custom sidecar needs it.
  automountServiceAccountToken: false
  # -- Default resources for the Matomo php-fpm container (dashboard). Sized
  # for matomo.phpfpm's default pm.max_children (32): ~120Mi/worker realistic
  # average plus headroom for the FPM master and occasional heavier requests.
  # If you change pm.max_children, revisit this limit (and vice versa).
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi

  # -- Resources for the shared matomo-init init container (runs on every
  # workload: dashboard, tracker, cli, cronjobs, queuedtracking, pre-upgrade
  # and post-install Jobs).
  initResources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # -- Resources for the wait-for-db init container (pre-upgrade and
  # post-install Jobs only).
  waitForDbResources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 16Mi

  # -- Command run by the matomo-warmup init container (dashboard and tracker
  # only), after matomo-init and before php-fpm/nginx start. `matomo:install
  # --force` (in installCommand above) doesn't itself fire the plugin
  # install/update events some plugins (e.g. TagManager) hook to regenerate
  # generated assets - normally left to happen lazily on the first web
  # request(s) after a (re)start. Since static-data is an emptyDir, that
  # bookkeeping resets on every fresh pod, so without this, concurrent
  # probes/traffic on every restart each independently race to redo that
  # (expensive) regeneration. Running it once here, synchronously, avoids
  # that. Unless matomo.tagManagerRegenerate.enabled is true, this is also
  # followed by a guarded `tagmanager:regenerate-released-containers` call
  # (see matomo.tagManagerRegenerateGuarded in _helpers.tpl); when that
  # feature is enabled, the regenerate-tagmanager CronJob owns that work
  # instead, so it's skipped here.
  warmupCommand: ./console core:update --yes --no-interaction
  # -- Resources for the matomo-warmup init container (dashboard and tracker).
  warmupResources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  ## Moves TagManager's generated container JS (/var/www/html/js) out of each
  ## pod's own ephemeral static-data and onto a single ReadWriteMany
  ## PersistentVolumeClaim, kept fresh by a dedicated CronJob instead of by
  ## the dashboard/tracker pods themselves. Disabled by default because it
  ## requires a StorageClass that supports ReadWriteMany; when enabled, the
  ## dashboard and tracker no longer regenerate TagManager containers at
  ## all (see matomo.warmupCommand above) - they just read the shared
  ## volume, which the CronJob refreshes on its own schedule.
  tagManagerRegenerate:
    # -- Enable the regenerate-tagmanager CronJob and the shared
    # ReadWriteMany PersistentVolumeClaim mounted at /var/www/html/js on the
    # dashboard and tracker pods.
    enabled: false
    # @schema
    # type: [integer, "null"]
    # required: false
    # @schema
    # -- fsGroup applied to the dashboard, tracker, and regenerate-tagmanager
    # pods when this feature is enabled. nginx (nginx.runAsUser) and matomo
    # (matomo.runAsUser) run as different UIDs but both need access to the
    # shared PVC; fsGroup is pod-wide, unlike runAsUser, so it's what lets
    # them actually share it. Defaults to matomo.runAsUser. Note this has no
    # effect on hostPath-backed volumes (e.g. the kind e2e test fixture) -
    # only on real volume plugins/CSI drivers (NFS, CephFS, etc).
    fsGroup:
    # -- Cron schedule for the regenerate-tagmanager CronJob.
    schedule: "*/2 * * * *"
    # -- concurrencyPolicy for the regenerate-tagmanager CronJob.
    concurrencyPolicy: Forbid
    # -- activeDeadlineSeconds for the regenerate-tagmanager Job.
    activeDeadlineSeconds: 300
    # -- Default resources for the regenerate-tagmanager CronJob container.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    # -- Path inside the matomo image the matomo-seed-tagmanager-js init
    # container copies from when seeding the shared volume on its
    # first-ever mount. Defaults to the default JS assets bundled in the
    # image, alongside the rest of Matomo's source under /usr/src/matomo.
    seedSourcePath: /usr/src/matomo/js
    # -- Resources for the dashboard/tracker matomo-seed-tagmanager-js init
    # container that seeds the shared volume on its first-ever mount.
    seedResources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 256Mi
    volume:
      # -- Whether this chart creates the shared TagManager JS
      # PersistentVolumeClaim (matomo-tagmanager-js). Set to false and
      # provide existingClaim to use a PVC you've already created instead
      # (e.g. one provisioned/managed outside this chart, or shared with
      # other releases). storageClassName and size below only apply when
      # this is true.
      create: true
      # -- Name of a pre-existing PersistentVolumeClaim to use instead of
      # the one this chart creates. Only used when create is false; must
      # already exist in this release's namespace and support the
      # ReadWriteMany access mode.
      existingClaim: ""
      # -- storageClassName for the shared TagManager JS PersistentVolumeClaim
      # created by this chart (only used when create is true). Must support
      # the ReadWriteMany access mode. Empty uses the cluster's default
      # StorageClass (only suitable if that default supports RWX).
      storageClassName: ""
      # -- Extra labels for the tagmanager JS PersistentVolumeClaim.
      # Labels set here will override or add to the default label
      # (app: matomo-jobs-regenerate-tagmanager).
      # @schema
      # additionalProperties: true
      # @schema
      labels:
        {}
      # -- Size of the shared TagManager JS PersistentVolumeClaim created by
      # this chart (only used when create is true).
      size: 1Gi

  # -- Install command. If already installed, it just creates the needed config.
  installCommand: ./console plugin:activate ExtraTools && ./console matomo:install --install-file=/tmp/matomo/install.json --force --do-not-drop-db
  ## Full replacement for the default install.json used by installCommand.
  ## When empty, the chart's built-in default (see configmap-matomo.yaml) is
  ## used instead. As:
  ## config:
  ##   PluginsInstalled: [...]
  ##   Site:
  ##     name: My Site
  ##     url: https://example.com
  ##   Config:
  ##     General:
  ##       ...
  # @schema
  # additionalProperties: true
  # @schema
  # -- Full install.json content, replacing the chart's built-in default when set.
  config: {}
  # -- Seconds the post-install Job sleeps before running `postInstallCommand`
  # (gives Matomo time to finish bootstrapping).
  postInstallSleepTime: 5
  # -- Command to run in a post-install Job. The Job (and its resources) is
  # only created when this is non-empty.
  postInstallCommand: ""
  # -- Default resources for the post-install Job container.
  postInstallResources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # -- Seconds the pre-upgrade Job sleeps before running `preUpgradeCommand`.
  preUpgradeSleepTime: 5
  # -- Command to run in a pre-upgrade Job. The Job (and its resources) is
  # only created when this is non-empty.
  preUpgradeCommand: ""
  # -- Default resources for the pre-upgrade Job container.
  preUpgradeResources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # @schema
  # additionalProperties: true
  # @schema
  # -- Extra labels applied to Matomo pods (dashboard, tracker, cli, cronjobs, queuedtracking).
  extralabels: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Readiness probe for the Matomo php-fpm containers (dashboard, tracker).
  readinessProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Liveness probe for the Matomo php-fpm containers (dashboard, tracker).
  livenessProbe: {}
  ## matomo:
  ##   env:
  ##     - name: BAR
  ##       value: foo
  ##     - name: FOO
  ##       valueFromSecret:
  ##         secretName: foo
  ##         key: bar
  # @schema
  # items:
  #   type: object
  #   additionalProperties: true
  # @schema
  # -- Env variables to inject, if any.
  env: []
  ## If you have a premium license for plugins, set it here.
  ## you need to create the secret before referring it.
  ## As:
  ## license:
  ##   secretKeyRef:
  ##     name: matomo-license
  ##     key: matomo-license
  # @schema
  # type: [object, "null"]
  # additionalProperties: true
  # required: false
  # @schema
  # -- Reference to a secret holding a premium plugin license, if any.
  license:

  ## php.ini overrides shared by the dashboard and core:archive cronjob
  ## php-fpm containers. Only rendered (as a ConfigMap) when set; otherwise
  ## the chart's built-in defaults are used. As:
  ## php:
  ##   memory_limit: 2G
  ##   max_execution_time: 300
  # @schema
  # type: [object, "null"]
  # additionalProperties: true
  # required: false
  # @schema
  # -- php.ini overrides for the dashboard and core:archive php-fpm containers.
  php:
  ## php-fpm pool tuning (pm, max_children, spare servers, status_path, ...)
  ## for the dashboard's php-fpm container. Only rendered (as a ConfigMap)
  ## when set; otherwise the chart's built-in defaults are used. Default
  ## `pm` is `dynamic`, keeping `min_spare_servers` warm workers resident at
  ## all times to avoid fork latency on the next request; switch to
  ## `ondemand` if you'd rather scale workers to zero when idle (then
  ## `process_idle_timeout` applies instead of the spare-server settings).
  ## This ConfigMap is also mounted into the core:archive CronJob container,
  ## but pm.*/php_admin_value directives are php-fpm-pool-only and have no
  ## effect there since core:archive runs via the php CLI SAPI, not php-fpm.
  ## Also always enables the php-fpm slowlog (any request running longer than
  ## `request_slowlog_timeout`, default 10s, gets a full PHP stack trace
  ## logged to stderr/`kubectl logs`) to help diagnose stuck or hanging
  ## requests, e.g. a blocked database call.
  ## As:
  ## phpfpm:
  ##   type: dynamic
  ##   max_children: 32
  ##   request_slowlog_timeout: 10s
  # @schema
  # type: [object, "null"]
  # additionalProperties: true
  # required: false
  # @schema
  # -- php-fpm pool tuning for the dashboard's php-fpm container.
  phpfpm:

  ingress:
    # -- Create Ingress resources for the dashboard and tracker.
    enabled: true
    # @schema
    # additionalProperties: true
    # @schema
    # -- Extra labels for the dashboard and tracker Ingress resources.
    extralabels: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Extra annotations applied to both the dashboard and tracker Ingress resources.
    annotations: {}

  # -- Gateway API support. When enabled, HTTPRoutes are created for the
  # dashboard and tracker (using their `hostname` values) instead of - or
  # alongside - the Ingress resources. Requires the Gateway API CRDs and a
  # Gateway; TLS is terminated on the Gateway listener, not in the chart.
  gatewayApi:
    enabled: false
    # -- parentRefs applied to all HTTPRoutes, e.g.:
    # parentRefs:
    #   - name: my-gateway
    #     namespace: my-namespace
    #     sectionName: http
    parentRefs: []
    # @schema
    # additionalProperties: true
    # @schema
    # -- Extra labels for the HTTPRoutes.
    extralabels: {}

  cli:
    # -- Number of replicas for the cli Deployment.
    replicas: 1
    # -- Enable the cli Deployment (runs supervisord for one-off `console` commands via `kubectl exec`).
    enabled: true
    # -- Default resources for the Matomo cli container.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # @schema
    # additionalProperties: true
    # @schema
    # -- Liveness probe for the cli container (checks supervisord is running).
    livenessProbe: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Readiness probe for the cli container (checks supervisord is running).
    readinessProbe: {}

  cronJobs:
    coreArchive:
      # -- Enable the core:archive CronJob.
      enabled: true
      # -- Labels applied to the coreArchive CronJob (name, instance, component, part-of, managed-by).
      labels:
        name: matomo-jobs-corearchive
        instance: matomo
        component: cronjob
        partOf: matomo
        managedBy: helm
      # -- Cron schedule for core:archive.
      schedule: "*/60 * * * *"
      # -- concurrencyPolicy for the core:archive CronJob.
      concurrencyPolicy: Allow
      # -- activeDeadlineSeconds for the core:archive Job.
      activeDeadlineSeconds: 43200
      # -- Command run by the core:archive CronJob.
      command: ./console core:archive --disable-scheduled-tasks
      # -- Default resources for the core:archive cronjob.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    scheduledTasks:
      ## PHP ini overrides for the scheduled-tasks CronJob container. Only
      ## rendered (as a ConfigMap) when set. As:
      ## php:
      ##   memory_limit: 4G
      ##   max_execution_time: 0
      # @schema
      # type: [object, "null"]
      # additionalProperties: true
      # required: false
      # @schema
      # -- PHP configuration overrides for the scheduled-tasks CronJob.
      php:
      # -- Enable the scheduled-tasks CronJob.
      enabled: true
      # -- Labels applied to the scheduledTasks CronJob (name, instance, component, part-of, managed-by).
      labels:
        name: matomo-jobs-scheduled-tasks
        instance: matomo
        component: cronjob
        partOf: matomo
        managedBy: helm
      # -- Cron schedule for scheduled-tasks:run.
      schedule: "*/60 * * * *"
      # -- activeDeadlineSeconds for the scheduled-tasks Job.
      activeDeadlineSeconds: 43200
      # -- Command run by the scheduled-tasks CronJob.
      command: ./console scheduled-tasks:run
      # -- Default resources for the scheduled-tasks cronjob.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 1Gi

  dashboard:
    # -- Extra containers to run alongside the dashboard pod. Added like this:
    # sidecars:
    # - name: fpm-metrics
    #   image: hipages/php-fpm_exporter:2.2.0
    #   imagePullPolicy: IfNotPresent
    #   resources:
    #     limits:
    #       cpu: 500m
    #       memory: 256Mi
    #     requests:
    #       cpu: 40m
    #       memory: 32Mi
    sidecars: []
    # -- Enable the dashboard Deployment and Service.
    enabled: true
    # -- Number of replicas for the dashboard Deployment.
    replicas: 1
    # -- Create a LoadBalancer Service for the dashboard, used as the Ingress/HTTPRoute backend when true.
    loadbalancer: false
    # -- Hostname used for the dashboard Ingress/HTTPRoute rule.
    hostname: my.host
    # -- Add a TLS block to the dashboard Ingress for `hostname`.
    tls: false
    # -- Existing TLS secret name for the dashboard ingress.
    secretName: ""
    # -- Credentials for the first (super)user, applied by the init container on install.
    firstuser:
      username: admin
      password: admin123
      email: foo@example.com
    # -- php-fpm_exporter (fpm-metrics) sidecar for the dashboard pod.
    exporter:
      # -- Enable the dashboard php-fpm_exporter (fpm-metrics) sidecar and
      # its `metrics` port on the matomo-dashboard Service.
      enabled: true
      # -- Override the php-fpm_exporter image used for the dashboard
      # (falls back to `matomo.exporterImage` when empty).
      image: ''
      # -- Default resources for the dashboard php-fpm_exporter (fpm-metrics) container.
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 15m
          memory: 32Mi
      # @schema
      # additionalProperties: true
      # @schema
      # -- Liveness probe for the dashboard php-fpm_exporter (fpm-metrics) container.
      livenessProbe: {}
      # @schema
      # additionalProperties: true
      # @schema
      # -- Readiness probe for the dashboard php-fpm_exporter (fpm-metrics) container.
      readinessProbe: {}
    nginx:
      # -- Worker process count for the dashboard nginx.
      nginxWorkerProcesses: 5
      # -- Override the nginx image used for the dashboard (falls back to `nginx.image` when empty).
      image: ''
      # @schema
      # type: [string, object]
      # additionalProperties: true
      # @schema
      # -- Override the full dashboard nginx configuration (nginx.conf, fastcgi_params, mime.types). As:
      # conf:
      #   nginx.conf: |
      #     worker_processes 5;
      #     load_module modules/ngx_http_geoip2_module.so;
      #     ...
      #   fastcgi_params: |
      #     fastcgi_param   COUNTRY_CODE            $geoip2_data_country_code;
      #     fastcgi_param   QUERY_STRING            $query_string;
      #     fastcgi_param   REQUEST_METHOD          $request_method;
      #     ...
      #   mime.types: |
      #     types {
      #       text/html                                        html htm shtml;
      #       text/css                                         css;
      #       text/xml                                         xml;
      #       ...
      conf: ''
      # @schema
      # additionalProperties: true
      # @schema
      # -- Liveness probe for the dashboard nginx container.
      livenessProbe: {}
      # @schema
      # additionalProperties: true
      # @schema
      # -- Readiness probe for the dashboard nginx container.
      readinessProbe: {}
    # -- ingressClassName for the dashboard Ingress.
    ingressClassName: ""
    # -- List of CIDRs allowed to reach the dashboard Ingress (nginx.ingress.kubernetes.io/whitelist-source-range). Empty disables the restriction.
    whitelist: []
    ingress:
      # @schema
      # additionalProperties: true
      # @schema
      # -- Extra annotations for the dashboard Ingress.
      annotations:
        digitalist.cloud/instance: "matomo"

  queuedTrackingMonitor:
    # -- Enable the queuedtracking:monitor Deployment.
    enabled: true
    # -- Number of replicas for the queuedtracking-monitor Deployment.
    replicas: 1
    # -- Default resources for the queuedtracking-monitor container.
    resources:
      requests:
        memory: 128Mi
        cpu: 300m
      limits:
        memory: 180Mi
        cpu: 500m
    # @schema
    # additionalProperties: true
    # @schema
    # -- Liveness probe for the queuedtracking-monitor container (checks supervisord is running).
    livenessProbe: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Readiness probe for the queuedtracking-monitor container (checks supervisord is running).
    readinessProbe: {}
  queuedTrackingProcess:
    # -- Enable the queuedtracking:process worker deployment. Required when
    # QueuedTracking runs with processDuringTrackingRequest disabled.
    enabled: false
    # -- Number of replicas for the queuedtracking-process Deployment.
    replicas: 1
    # -- Number of supervisord worker processes for queuedtracking:process per pod.
    numProcs: 1
    # -- Default resources for the queuedtracking-process container.
    resources:
      requests:
        memory: 128Mi
        cpu: 250m
      limits:
        memory: 220Mi
        cpu: "1"
    # @schema
    # additionalProperties: true
    # @schema
    # -- Liveness probe for the queuedtracking-process container (checks supervisord is running). Overriding replaces the default entirely. Example:
    # livenessProbe:
    #   exec:
    #     command:
    #     - /bin/sh
    #     - -c
    #     - "ps -A | grep supervisord"
    #   initialDelaySeconds: 15
    #   periodSeconds: 20
    livenessProbe: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Readiness probe for the queuedtracking-process container (checks supervisord is running).
    readinessProbe: {}

  tracker:
    # -- Enable the tracker Deployment and Service.
    enabled: true
    # -- Number of replicas for the tracker Deployment.
    replicas: 1
    # -- Hostname used for the tracker Ingress/HTTPRoute rule.
    hostname: tracker.my.host
    # -- Add a TLS block to the tracker Ingress for `hostname`.
    tls: false
    # -- Existing TLS secret name for the tracker ingress.
    secretName: ""
    # -- Create a LoadBalancer Service for the tracker, used as the Ingress/HTTPRoute backend when true.
    loadbalancer: false
    # -- Default resources for the Matomo php-fpm container in the tracker.
    resources:
      requests:
        cpu: 300m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 768Mi
    # -- php-fpm_exporter (fpm-metrics) sidecar for the tracker pod.
    exporter:
      # -- Enable the tracker php-fpm_exporter (fpm-metrics) sidecar and its
      # `metrics` port on the matomo-tracker Service.
      enabled: true
      # -- Override the php-fpm_exporter image used for the tracker (falls
      # back to `matomo.exporterImage` when empty).
      image: ''
      # -- Default resources for the tracker php-fpm_exporter (fpm-metrics) container.
      resources:
        limits:
          cpu: 40m
          memory: 32Mi
        requests:
          cpu: 40m
          memory: 32Mi
      # @schema
      # additionalProperties: true
      # @schema
      # -- Liveness probe for the tracker php-fpm_exporter (fpm-metrics) container.
      livenessProbe: {}
      # @schema
      # additionalProperties: true
      # @schema
      # -- Readiness probe for the tracker php-fpm_exporter (fpm-metrics) container.
      readinessProbe: {}
    nginx:
      # -- Default resources for the tracker nginx container.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      # -- Worker process count for the tracker nginx.
      nginxWorkerProcesses: 5
      # @schema
      # additionalProperties: true
      # @schema
      # -- Liveness probe for the tracker nginx container.
      livenessProbe: {}
      # @schema
      # additionalProperties: true
      # @schema
      # -- Readiness probe for the tracker nginx container.
      readinessProbe: {}
    # -- php-fpm pool tuning for the tracker (process manager type, max/spare children, idle timeout, max requests, status path).
    phpfpm:
      type: ondemand
      max_children: 75
      process_idle_timeout: 600s
      max_requests: 500
      start_servers: 5
      min_spare_servers: 5
      max_spare_servers: 75
      memory_limit: 2048M
      status_path: /status
    # -- ingressClassName for the tracker Ingress.
    ingressClassName: ""
    ingress:
      # @schema
      # additionalProperties: true
      # @schema
      # -- Extra annotations for the tracker Ingress.
      annotations:
        digitalist.cloud/instance: "matomo"

# -- Default nginx image and settings shared by the dashboard (unless
# `matomo.dashboard.nginx.image` is set) and the tracker.
nginx:
  # -- nginx image used for the dashboard and tracker.
  image: digitalist/nginx:1.21.6
  # -- Image pull secrets for the nginx image.
  imagePullSecrets: []
  # -- run the nginx container as this user id.
  runAsUser: 100
  # -- Default resources for the dashboard nginx container.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

db:
  # -- Database hostname.
  hostname: matomo-db-mysql
  # -- Database port.
  port: 3306
  password:
    secretKeyRef:
      # -- Name of the secret holding the database password.
      name: matomo-db-mysql
      # -- Key within the secret holding the database password.
      key: mysql-root-password
  # -- Database name.
  name: matomo
  # -- Database username.
  username: root
  # -- Table prefix.
  prefix: matomo_

# -- Extra secrets
extraSecrets:
  create: false
  # @schema
  # additionalProperties: true
  # @schema
  data: {}
# * secrets need to base64 encoded.
#  data:
#    name: Zm9vCg==
#    bar: YmFyCg==
# @schema
# type: [object, array]
# additionalProperties: true
# @schema
# -- Extra services
extraServices: {}
#  - name: foo
    ## Service port type
#    type: ClusterIP
    ## Service protocol
#    protocol: TCP
    ## The container target port
#    containerPort: 12001
    ## The service port
#    port: 12001
#    selector:
#      app: matomo-dashboard
    ## The node port (only relevant for type LoadBalancer or NodePort)
#    nodePort:
    ## The cluster ip address (only relevant for type LoadBalancer or NodePort)
