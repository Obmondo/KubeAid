apiVersion: batch/v1
kind: CronJob
metadata:
  name: matomo-archive
spec:
  schedule: {{ .Values.archive.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # a full run can take over 30 min, this is only for one stuck on the PVC mount
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          # the web pod's node already has the PVC mounted
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: matomo
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: archive
              image: {{ include "matomo.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # copy the code but not config/ and misc/, those are on the PVC the web pod is reading
              command: ["sh", "-c"]
              args:
                - >-
                  tar -C /usr/src/matomo --exclude=./config --exclude=./misc --owner=www-data --group=www-data -cf - . | tar -xf -
                  && exec runuser -u www-data -- php console core:archive --url={{ ternary "https" "http" .Values.ingress.tls }}://{{ .Values.host }}
              env:
                {{- include "matomo.env" . | nindent 16 }}
              resources:
                {{- toYaml .Values.archive.resources | nindent 16 }}
              volumeMounts:
                {{- include "matomo.volumeMounts" . | nindent 16 }}
          volumes:
            {{- include "matomo.volumes" . | nindent 12 }}
