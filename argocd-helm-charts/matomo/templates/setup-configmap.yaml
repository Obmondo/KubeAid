apiVersion: v1
kind: ConfigMap
metadata:
  name: matomo-setup
data:
  setup.sh: |
    #!/bin/bash
    set -euo pipefail
    cd /var/www/html
    console() { runuser -u www-data -- php console "$@"; }
    {{- range .Values.plugins }}
    {{- $name := required "plugins: every entry needs a name" .name }}
    {{- $version := required "plugins: every entry needs a version" .version }}

    if ! grep -qs '"version": *"{{ $version }}"' extra-plugins/{{ $name }}/plugin.json; then
      echo "Installing {{ $name }} {{ $version }}"
      curl -fsSL https://plugins.matomo.org/api/2.0/plugins/{{ $name }}/download/{{ $version }} -o /tmp/plugin.zip
      rm -rf extra-plugins/{{ $name }}
      php -r '$z = new ZipArchive; exit($z->open("/tmp/plugin.zip") === true && $z->extractTo("extra-plugins/") ? 0 : 1);'
      chown -R www-data:www-data extra-plugins/{{ $name }}
    fi
    {{- end }}

    if [ ! -f config/config.ini.php ]; then
      echo "No config.ini.php yet: finish the web installer, then restart the pod to apply the settings"
      exit 0
    fi

    console core:update --yes
    # again, for columns of plugins the first run activated
    console core:update --yes
    {{- range .Values.plugins }}
    console plugin:activate {{ .name }}
    {{- end }}
    console config:set \
      'General.trusted_hosts={{ include "matomo.hosts" . }}' \
      'General.enable_trusted_host_check=1' \
      'General.assume_secure_protocol={{ ternary 1 0 .Values.ingress.tls }}' \
      'General.proxy_client_headers=["HTTP_X_FORWARDED_FOR"]' \
      'General.enable_auto_update=0' \
      'General.enable_update_communication=0'
    {{- $o := .Values.oidc }}
    {{- if $o.enabled }}
    {{- $kc := printf "%s/realms/%s/protocol/openid-connect" (required "set oidc.keycloakUrl" $o.keycloakUrl) (required "set oidc.realm" $o.realm) }}
    console config:set \
      'LoginOIDC.authenticationName="{{ $o.buttonName | default "Login with Keycloak" }}"' \
      'LoginOIDC.authorizeUrl="{{ $kc }}/auth"' \
      'LoginOIDC.tokenUrl="{{ $kc }}/token"' \
      'LoginOIDC.userinfoUrl="{{ $kc }}/userinfo"' \
      'LoginOIDC.endSessionUrl="{{ $kc }}/logout"' \
      'LoginOIDC.userinfoId="{{ $o.userinfoId | default "email" }}"' \
      'LoginOIDC.clientId="{{ $o.clientId | default "matomo" }}"' \
      'LoginOIDC.scope="{{ $o.scope | default "openid email" }}"' \
      'LoginOIDC.allowSignup={{ if hasKey $o "allowSignup" }}{{ ternary 1 0 $o.allowSignup }}{{ else }}1{{ end }}' \
      'LoginOIDC.allowedSignupDomains="{{ $o.allowedSignupDomains | default "" }}"'
    console config:set "LoginOIDC.clientSecret=\"${MATOMO_OIDC_CLIENT_SECRET}\"" > /dev/null
    {{- end }}
