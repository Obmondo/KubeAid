global:
  postgresql:
    enabled: true
    instanceName: buzz
    instances: 1
    size: 5Gi
    database: buzz
    owner: buzz
    # Pins the owner's password so the DATABASE_URL sealed into buzz-secrets
    # keeps matching the database. See README.md.
    existingSecret: buzz-pgsql-credentials
    monitoring:
      enablePodMonitor: true
    resources:
      limits:
        memory: 800Mi
      requests:
        memory: 500Mi
        cpu: 100m
    backups:
      enabled: false
    logicalbackup:
      enabled: false

# Redis for buzz-pubsub, rendered by templates/redis-standalone.yaml through the
# Redis operator. Reachable without auth as redis://buzz-redis:6379.
externalRedis:
  enabled: true
  mode: standalone
  replicas: 1
  name: buzz-redis
  storage: 2Gi
  image: quay.io/opstree/redis:v7.2.6
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 101m
      memory: 128Mi
    limits:
      memory: 256Mi

buzz:
  # Public wss:// URL clients dial. Also derives the ingress host and media URL.
  relayUrl: wss://buzz.example.com

  # Pinned rather than inherited from the chart's appVersion, which is still
  # 0.1.0. That relay predates the startup migration step, so it silently leaves
  # the schema uncreated and every query fails on a missing relation while the
  # process looks healthy. See README.md.
  image:
    tag: "0.2.0"

  # Every relay env var is read from this one Secret, and DATABASE_URL is
  # mandatory, so the chart-managed Secret path is unusable under ArgoCD.
  # README.md lists the keys.
  secrets:
    existingSecret: buzz-secrets

  replicaCount: 1

  relay:
    # Open relay: no ownerPubkey needed. Set this true and supply the operator's
    # 64-char hex ownerPubkey to gate on relay membership.
    requireRelayMembership: false

  # Backing services come from the CNPG and Redis operators above, and from
  # external object storage, so the chart's bundled ones stay off.
  postgresql:
    enabled: false
  redis:
    enabled: false
  minio:
    enabled: false

  # External S3-compatible object storage. Credentials are supplied out of band
  # as BUZZ_S3_ACCESS_KEY / BUZZ_S3_SECRET_KEY in buzz-secrets. Chart 0.1.7
  # addresses the bucket as <endpoint>/<bucket>/<key> and exposes no region or
  # addressing-style knob, so the endpoint must serve path-style requests.
  s3:
    endpoint: https://buckets.example.com
    bucket: buzz-media

  # emptyDir by default: the upstream Deployment hardcodes maxUnavailable: 0, so
  # a rollout needs the new pod running before the old one exits, which a
  # ReadWriteOnce volume can never satisfy — every rollout deadlocks on
  # Multi-Attach. Nothing durable lives here. See README.md before enabling.
  persistence:
    git:
      enabled: false
      size: 10Gi

  # Both run before the relay on every start and assume the chart defaults
  # above: host buzz-pgsql-rw from global.postgresql.instanceName, and the
  # DATABASE_URL key from secrets.existingSecret. Change either and change
  # these to match. See README.md.
  extraInitContainers:
    # CNPG is often still bootstrapping when the relay first rolls out, and the
    # relay exits rather than retries. psql rather than pg_isready: this has to
    # prove auth and the database itself, not just an open socket.
    - name: wait-for-db
      image: postgres:16-alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: buzz-secrets
              key: DATABASE_URL
      command:
        - sh
        - -c
        - |
          until psql "$DATABASE_URL" -c 'select 1' >/dev/null 2>&1; do
            echo "Waiting for database..."
            sleep 2
          done
          echo "Database is ready!"
    # Repairs installs that passed through relay 0.1.0. That image created
    # audit_log at runtime but shipped no migration runner, so sqlx recorded
    # nothing; migration 1 then aborts on "relation audit_log already exists"
    # and rolls back the entire schema, leaving a relay that starts, serves
    # WebSockets and fails every query. Guarded on _sqlx_migrations being
    # absent, so it is a no-op on a fresh install and after the first migrate.
    # Removable once no install predates 0.2.0.
    - name: reconcile-legacy-schema
      image: postgres:16-alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: buzz-secrets
              key: DATABASE_URL
      command:
        - sh
        - -c
        - |
          set -e
          applied=$(psql "$DATABASE_URL" -At -c "select to_regclass('public._sqlx_migrations')")
          orphan=$(psql "$DATABASE_URL" -At -c "select to_regclass('public.audit_log')")
          if [ -z "$applied" ] && [ -n "$orphan" ]; then
            echo "Pre-0.2.0 schema found: dropping orphan audit_log so migration 1 can run"
            psql "$DATABASE_URL" -c 'drop table if exists audit_log cascade'
          else
            echo "Nothing to reconcile"
          fi

  # Class and annotations are left to the cluster: Helm merges annotation maps,
  # so anything set here leaks into every install and cannot be removed
  # downstream. See README.md for the NGINX WebSocket timeouts.
  ingress:
    enabled: true
    className: ""
    annotations: {}
    tls:
      - hosts:
          - buzz.example.com
        secretName: buzz-tls

  serviceMonitor:
    enabled: true
