{{- if  and .Values.certificates.enabled  .Values.indexer }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wazuh.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
spec:
  # Secret names are always required.
  secretName: node-tls
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  duration: {{ .Values.certificates.duration }}
  renewBefore: {{ .Values.certificates.renewBefore }}
  isCA: false
  commonName: {{ include "wazuh.indexer.fullname" . }}-indexer
  subject:
    organizations:
      - {{ .Values.certificates.subject.organization }}
    countries:
      - {{ .Values.certificates.subject.country }}
    localities:
      - {{ .Values.certificates.subject.locality }}
  dnsNames:
    - {{ include "wazuh.indexer.fullname" . }}-indexer
    - {{ include "wazuh.indexer.fullname" . }}-indexer.{{ .Release.Namespace }}
    - {{ include "wazuh.indexer.fullname" . }}-indexer.{{ .Release.Namespace }}.svc
    - {{ include "wazuh.indexer.fullname" . }}-indexer.{{ .Release.Namespace }}.svc.cluster.local
    - "*.{{ include "wazuh.indexer.fullname" . }}-indexer-nodes.{{ .Release.Namespace }}.svc.cluster.local"
    {{- range $i, $e := until (int .Values.indexer.replicas) }}
    - {{ include "wazuh.indexer.fullname" $ }}-indexer-{{ $i }}.{{ include "wazuh.indexer.fullname" $ }}-indexer-nodes.{{ $.Release.Namespace }}.svc.cluster.local
    {{- end }}
  issuerRef:
    # Indexer have to use the CA Issuer so that the certificate can be validated with node-tls secret.
    # KubeAid patch: with certificates.issuer.name set (a shared CA issuer), the node certificate
    # comes from it directly, so ca.crt is that CA and indexers of several releases trust each
    # other (cross-cluster search).
    name: {{ .Values.certificates.issuer.name | default (printf "%s-ca-issuer" (include "wazuh.fullname" .)) }}
    {{- if and .Values.certificates.issuer.name (eq .Values.certificates.issuer.type "ClusterIssuer") }}
    kind: ClusterIssuer
    {{- end }}
{{- end }}