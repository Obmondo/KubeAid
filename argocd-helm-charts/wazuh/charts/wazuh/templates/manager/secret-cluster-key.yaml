{{- /* KubeAid patch: not rendered when wazuh.clusterKeySecret.name names an existing Secret. */}}
{{- if and .Values.wazuh.enabled (not .Values.wazuh.clusterKeySecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-cluster-key
  namespace: {{ .Release.Namespace }}
data:
  key: {{ .Values.wazuh.key | b64enc }}
{{- end }}