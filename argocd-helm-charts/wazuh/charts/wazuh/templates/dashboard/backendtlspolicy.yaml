{{- if and .Values.dashboard.enabled .Values.dashboard.gateway.enabled .Values.dashboard.enable_ssl }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "wazuh.fullname" . }}-dashboard
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ include "wazuh.fullname" . }}-dashboard
  validation:
    # Must match a SAN on the certificate served by the dashboard Service (see certs/dashboard/certificate.yaml).
    hostname: {{ include "wazuh.fullname" . }}-dashboard
    caCertificateRefs:
      - kind: ConfigMap
        name: {{ required "dashboard.gateway.backendTLS.caCertificateRef.name is required when dashboard.gateway.enabled and dashboard.enable_ssl are both true (ConfigMap with a ca.crt key)" .Values.dashboard.gateway.backendTLS.caCertificateRef.name }}
{{- end }}
