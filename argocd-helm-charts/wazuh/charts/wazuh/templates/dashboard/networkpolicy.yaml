{{- if .Values.dashboard.enabled }}
{{- if .Values.dashboard.networkPolicy.enabled -}}
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "wazuh.fullname" . }}-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- /* KubeAid patch: ingressFrom null keeps the upstream rule (any source); a list
         restricts the dashboard port to those peers, and an empty list drops the rule
         (other policies, e.g. the security-operations chart's, then admit peers). */}}
    {{- $from := .Values.dashboard.networkPolicy.ingressFrom }}
    {{- if kindIs "slice" $from }}
    {{- if $from }}
    - ports:
        - protocol: TCP
          port: {{ .Values.dashboard.service.httpPort }}
      from:
        {{- toYaml $from | nindent 8 }}
    {{- end }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.dashboard.service.httpPort }}
    {{- end }}
    {{- with .Values.dashboard.networkPolicy.extraIngresses }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Indexer
    - ports:
        - protocol: TCP
          port: {{ .Values.indexer.service.httpPort }}
      to:
        - podSelector:
            matchLabels:
              app: {{ include "wazuh.indexer.fullname" . }}-indexer
    # Wazuh Manager
    - ports:
        - protocol: TCP
          port: {{ include "wazuh.getPortByName" (dict "portName" "api" "ports" .Values.wazuh.master.service.ports) }}
      to:
        - podSelector:
            matchLabels:
              app: {{ include "wazuh.fullname" . }}-manager
              node-type: master
    # DNS
    {{- range $dnsServerLabelsList := list "kube-dns" "coredns" }}
    - ports:
        - protocol: UDP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: {{ $dnsServerLabelsList }}
    {{- end }}
    {{- with .Values.dashboard.networkPolicy.extraEgresses }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
{{- end }}
