wazuh:
  dashboard:
    ingress:
      enabled: true
      className: traefik-internal
      tls: 
      - hosts:
        - wazuh.kam.obmondo.com                                                                                                                                                                                                                 
        secretName: wazuh-tls                                                                                                                                                                                                                   
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      host: wazuh.kam.obmondo.com

  indexer:
    replicas: 1
    storageSize: 5Gi

  agent:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  wazuh:
    master:
      storageSize: 5Gi
    worker:
      replicas: 1
      storageSize: 5Gi

# Wazuh -> DFIR-IRIS integration (templates/iris-integration.yaml). Places
# custom-iris and custom-iris.py in the managers' /var/ossec/integrations so an
# alert becomes an IRIS alert carrying the full SIEM context.
#
# This only creates the ConfigMap. Mount it and declare the <integration> block
# in the same values file - README section 3 has the exact snippet, including
# the Secret that holds the IRIS API key so it never reaches git.
irisIntegration:
  enabled: false
