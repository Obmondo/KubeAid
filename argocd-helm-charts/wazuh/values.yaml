wazuh:
  dashboard:
    # Publish from kubeaid-config: the class and hostname are per-cluster.
    ingress:
      enabled: false
      className: nginx
      host: wazuh.example.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls:
        - hosts:
            - wazuh.example.com
          secretName: wazuh-tls

  indexer:
    replicas: 1
    storageSize: 5Gi

  agent:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  wazuh:
    # The managers hold far more than their own queues. Vulnerability detection
    # unpacks the upstream CTI feed into /var/ossec/queue/vd* and needs ~25 GB on
    # every manager, master and worker alike, independently of agent count or
    # retention. Sized at 5Gi both filled within a day and the API then answered
    # 200 while writing nothing (ENOSPC), so detection silently stopped updating.
    # 60Gi leaves room for the queue, the CDB lists and logs on top of that.
    master:
      storageSize: 60Gi
    worker:
      replicas: 1
      storageSize: 60Gi

# Wazuh -> DFIR-IRIS integration (templates/iris-integration.yaml). Places
# custom-iris and custom-iris.py in the managers' /var/ossec/integrations so an
# alert becomes an IRIS alert carrying the full SIEM context.
#
# This only creates the ConfigMap. Mount it and declare the <integration> block
# in the same values file - README section 10 has the exact snippet, including
# the Secret that holds the IRIS API key so it never reaches git.
irisIntegration:
  enabled: false

# Raw TCP routes for agents outside the cluster (templates/agent-ingressroutetcp.yaml).
# Service names follow the subchart: `<fullname>` serves 1515 (authd), the
# worker Service `<fullname>-manager-worker` serves 1514; an empty serviceName
# uses those. <fullname> is the subchart's name (wazuh for a release called
# wazuh, or wazuh.fullnameOverride). Each entryPoint must exist in the traefik
# values.
agentTcpRoutes:
  enabled: false
  enrolment:
    entryPoint: wazuh-authd
    serviceName: ""
    port: 1515
  events:
    entryPoint: wazuh-agent
    serviceName: ""
    port: 1514
