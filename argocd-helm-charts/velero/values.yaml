networkpolicies: false
schedule:
  daily: true
  weekly: true
  sixhourly: false
  dailyTTL: 720h
  weeklyTTL: 2160h
  excludedResources:
    - workloadconfigurationscansummaries.spdx.softwarecomposition.kubescape.io
# PVCs matching any of these label sets have their volume data skipped, while their
# Kubernetes objects are still backed up.
#
# Keyed by name rather than a plain list: Helm merges maps but replaces lists
# (helm/helm#3767), so a cluster adds entries in its own values file without copying
# these defaults, and can opt out of one by setting its key to null.
skipVolumePolicies:
  rabbitmq:
    app: rabbitmq
  redisCluster:
    redis_setup_type: cluster
  redisStandalone:
    redis_setup_type: standalone
  mongodbReplicaSet:
    app: mongodb-replica-set-svc
  opensearch:
    app.kubernetes.io/name: opensearch
  cloudnativePg:
    app.kubernetes.io/managed-by: cloudnative-pg
velero:
  revisionHistoryLimit: "0"
  configuration:
    logLevel: info
    features: EnableCSI
  # Read-only backup PVC for CephFS, so ceph-csi mounts the snapshot instead of
  # cloning it file by file. The clone ran past the prepare timeout on volumes with
  # lots of small files.
  # https://velero.io/docs/v1.18/data-movement-backup-pvc-configuration/
  #
  # The flag assumes the release is called velero. A cluster that sets its own
  # nodeAgent.extraArgs has to keep it.
  nodeAgent:
    extraArgs:
      - --node-agent-configmap=velero-node-agent-config
  configMaps:
    node-agent-config:
      data:
        node-agent-config.json: |
          {
            "backupPVC": {
              "ceph-filesystem": {
                "readOnly": true
              }
            }
          }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      # Schedules named *-offsite (see templates/velero-schedules.yaml) write to a second
      # storage location. Velero's metrics only carry the schedule name, so mark those
      # samples with location=offsite at scrape time; rules and dashboards can then tell
      # the two copies apart without repeating the name convention.
      metricRelabelings:
        - sourceLabels: [schedule]
          regex: ".*-offsite"
          targetLabel: location
          replacement: offsite
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 3m
      memory: 2Gi
  upgradeJobResources:
    requests:
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 300Mi
  kubectl:
    image:
      repository: docker.io/bitnamilegacy/kubectl
      tag: 1.33.4
