networkpolicies: false
schedule:
  daily: true
  weekly: false
  sixhourly: false
  dailyTTL: 720h
  weeklyTTL: 2160h
  excludedResources:
    - workloadconfigurationscansummaries.spdx.softwarecomposition.kubescape.io
# PVCs matching any of these label sets have their volume data skipped, while their
# Kubernetes objects are still backed up.
#
# Keyed by name rather than a plain list: Helm merges maps but replaces lists
# (helm/helm#3767), so a cluster adds entries in its own values file without copying
# these defaults, and can opt out of one by setting its key to null.
skipVolumePolicies:
  rabbitmq:
    app: rabbitmq
  redisCluster:
    redis_setup_type: cluster
  redisStandalone:
    redis_setup_type: standalone
  mongodbReplicaSet:
    app: mongodb-replica-set-svc
  opensearch:
    app.kubernetes.io/name: opensearch
  cloudnativePg:
    app.kubernetes.io/managed-by: cloudnative-pg
velero:
  revisionHistoryLimit: "0"
  configuration:
    logLevel: info
    features: EnableCSI
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 3m
      memory: 2Gi
  upgradeJobResources:
    requests:
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 300Mi
  kubectl:
    image:
      repository: docker.io/bitnamilegacy/kubectl
      tag: 1.33.4
