global:
  postgresql:
    enabled: true
    instanceName: netbird
    instances: 1
    revision: 1
    database: netbird
    owner: netbird
    size: 8Gi
    monitoring:
      enablePodMonitor: true
    backups:
      # Off by default — backups need an operator-supplied destinationPath
      # + schedule; enabling without them renders an invalid ObjectStore.
      enabled: false
      # cloud: aws
      # destinationPath: ""
      # endpointURL: ""
      # secretName: ""
    logicalbackup:
      enabled: true
      schedule: "48 02 * * *"
      provider: s3
      retention: "30d"

externalDatabases:
  netbird:
    enabled: false

netbird:
  fullnameOverride: netbird
  management:
    # Keep at 1: management generates its WireGuard key in-process on startup
    # (NewTimeBasedAuthSecretsManager -> wgtypes.GeneratePrivateKey) and never persists it.
    # A second replica has a different key, so a peer that fetched the key from one pod
    # fails against the other: "error while decrypting peer's message with Wireguard
    # public key". Upstream HA for management is an enterprise-licensed feature.
    replicaCount: 1
    configmap: |-
      {
        "Stuns": [
          {
            "Proto": "udp",
            "URI": "{{ .STUN_SERVER }}",
            "Username": "",
            "Password": ""
          }
        ],
        "TURNConfig": {
          "TimeBasedCredentials": false,
          "CredentialsTTL": "12h0m0s",
          "Secret": "secret",
          "Turns": [
            {
              "Proto": "udp",
              "URI": "{{ .TURN_SERVER }}",
              "Username": "{{ .TURN_SERVER_USER }}",
              "Password": "{{ .TURN_SERVER_PASSWORD }}"
            }
          ]
        },
        "Relay": {
          "Addresses": ["rels://vpn.example.com:443/relay"],
          "CredentialsTTL": "24h",
          "Secret": "{{ .RELAY_PASSWORD }}"
        },
        "Signal": {
          "Proto": "https",
          "URI": "vpn.example.com:443",
          "Username": "",
          "Password": ""
        },
        "Datadir": "/var/lib/netbird/",
        "DataStoreEncryptionKey": "{{ .DATASTORE_ENCRYPTION_KEY }}",
        "HttpConfig": {
          "LetsEncryptDomain": "",
          "CertFile": "",
          "CertKey": "",
          "AuthAudience": "{{ .IDP_CLIENT_ID }}",
          "AuthIssuer": "https://keycloak.example.com/auth/realms/netbird",
          "AuthUserIDClaim": "",
          "AuthKeysLocation": "https://keycloak.example.com/auth/realms/netbird/protocol/openid-connect/certs",
          "OIDCConfigEndpoint": "https://keycloak.example.com/auth/realms/netbird/.well-known/openid-configuration",
          "IdpSignKeyRefreshEnabled": false
        },
        "IdpManagerConfig": {
          "ManagerType": "keycloak",
          "ClientConfig": {
            "Issuer": "https://keycloak.example.com/auth/realms/netbird/.well-known/openid-configuration",
            "TokenEndpoint": "https://keycloak.example.com/auth/realms/netbird/protocol/openid-connect/token",
            "ClientID": "{{ .IDP_CLIENT_MGMT_ID }}",
            "ClientSecret": "{{ .IDP_CLIENT_MGMT_SECRET }}",
            "GrantType": "client_credentials"
          },
          "ExtraConfig": {
            "Password": "{{ .IDP_SERVICE_ACCOUNT_PASSWORD }}",
            "Username": "{{ .IDP_SERVICE_ACCOUNT_USER }}",
            "AdminEndpoint": "https://keycloak.example.com/auth/admin/realms/netbird"
          },
          "KeycloakClientCredentials": null
        },
        "DeviceAuthorizationFlow": {
          "Provider": "hosted",
          "ProviderConfig": {
            "ClientID": "{{ .IDP_CLIENT_ID }}",
            "ClientSecret": "",
            "Domain": "keycloak.example.com",
            "Audience": "{{ .IDP_CLIENT_ID }}",
            "TokenEndpoint": "https://keycloak.example.com/auth/realms/netbird/protocol/openid-connect/token",
            "DeviceAuthEndpoint": "https://keycloak.example.com/auth/realms/netbird/protocol/openid-connect/auth/device",
            "AuthorizationEndpoint": "",
            "Scope": "openid",
            "UseIDToken": false,
            "RedirectURLs": null
          }
        },
        "PKCEAuthorizationFlow": {
          "ProviderConfig": {
            "ClientID": "{{ .IDP_CLIENT_ID }}",
            "ClientSecret": "",
            "Domain": "keycloak.example.com",
            "Audience": "{{ .IDP_CLIENT_ID }}",
            "TokenEndpoint": "https://keycloak.example.com/auth/realms/netbird/protocol/openid-connect/token",
            "DeviceAuthEndpoint": "",
            "AuthorizationEndpoint": "https://keycloak.example.com/auth/realms/netbird/protocol/openid-connect/auth",
            "Scope": "openid profile email offline_access api",
            "UseIDToken": false,
            "RedirectURLs": ["http://localhost:53000"]
          }
        },
        "StoreConfig": {
          "Engine": "postgres"
        },
        "ReverseProxy": {
          "TrustedHTTPProxies": null,
          "TrustedHTTPProxiesCount": 0,
          "TrustedPeers": null
        }
      }

    podCommand:
      args:
        - --port=80
        - --log-file=console
        - --log-level=debug
        - --disable-anonymous-metrics=false
        - --single-account-mode-domain=vpn.example.com
        - --dns-domain=netbird.selfhosted
    image:
      tag: 0.76.1
    persistentVolume:
      enabled: false
    envFromSecret:
      NETBIRD_STORE_ENGINE_POSTGRES_DSN: netbird/postgresDSN
      STUN_SERVER: netbird/stunServer
      TURN_SERVER: netbird/turnServer
      TURN_SERVER_USER: netbird/turnServerUser
      TURN_SERVER_PASSWORD: netbird/turnServerPassword
      RELAY_PASSWORD: netbird/relayPassword
      IDP_CLIENT_ID: netbird/idpClientID
      IDP_CLIENT_MGMT_ID: netbird/idpClientMgmtID
      IDP_CLIENT_MGMT_SECRET: netbird/idpClientMgmtSecret
      IDP_SERVICE_ACCOUNT_USER: netbird/idpServiceAccountUser
      IDP_SERVICE_ACCOUNT_PASSWORD: netbird/idpServiceAccountPassword
      DATASTORE_ENCRYPTION_KEY: netbird/datastoreEncryptionKey
    useBackwardsGrpcService: true
    serviceGrpc:
      annotations:
        traefik.ingress.kubernetes.io/service.serversscheme: h2c
    ingressGrpc:
      enabled: true
      className: traefik-cert-manager
      tls:
        - hosts:
            - vpn.example.com
          secretName: vpn.example.com
      hosts:
        - host: vpn.example.com
          paths:
            - path: /management
              pathType: ImplementationSpecific
    ingress:
      enabled: true
      className: traefik-cert-manager
      tls:
        - hosts:
            - vpn.example.com
          secretName: vpn.example.com
      hosts:
        - host: vpn.example.com
          paths:
            - path: /api
              pathType: ImplementationSpecific

  signal:
    # Keep at 1: signal keeps its connected-peer registry in an in-memory sync.Map with
    # no shared state, and only looks the destination peer up locally, so peers registered
    # on different replicas can never exchange offers.
    replicaCount: 1
    image:
      tag: 0.76.1
    service:
      annotations:
        traefik.ingress.kubernetes.io/service.serversscheme: h2c
    ingress:
      enabled: true
      className: traefik-cert-manager
      tls:
        - hosts:
            - vpn.example.com
          secretName: vpn.example.com
      hosts:
        - host: vpn.example.com
          paths:
            - path: /signalexchange
              pathType: ImplementationSpecific

  relay:
    # Keep at 1: each relay keeps its connected peers in an in-memory map and every replica
    # advertises the same NB_EXPOSED_ADDRESS, so two peers can land on different pods and
    # never reach each other. A multi-relay setup needs one distinct address per instance.
    replicaCount: 1
    image:
      tag: 0.76.1
    env:
      NB_LOG_LEVEL: info
      NB_LISTEN_ADDRESS: ":33080"
      NB_EXPOSED_ADDRESS: rels://vpn.example.com:443/relay
    envFromSecret:
      NB_AUTH_SECRET: netbird/relayPassword
    ingress:
      enabled: true
      className: traefik-cert-manager
      tls:
        - hosts:
            - vpn.example.com
          secretName: vpn.example.com
      hosts:
        - host: vpn.example.com
          paths:
            - path: /relay
              pathType: ImplementationSpecific

  dashboard:
    enabled: true
    image:
      tag: v2.90.9
    envFromSecret:
      AUTH_CLIENT_ID: netbird/idpClientID
      AUTH_AUDIENCE: netbird/idpClientID
    env:
      # Endpoints
      NETBIRD_MGMT_API_ENDPOINT: https://vpn.example.com:443
      NETBIRD_MGMT_GRPC_API_ENDPOINT: https://vpn.example.com:443
      # OIDC
      AUTH_AUTHORITY: https://keycloak.example.com/auth/realms/Obmondo
      USE_AUTH0: false
      AUTH_SUPPORTED_SCOPES: openid profile email offline_access netbird-vpn-api
      NETBIRD_TOKEN_SOURCE: accessToken
    ingress:
      enabled: true
      className: traefik-cert-manager
      tls:
        - hosts:
            - vpn.example.com
          secretName: vpn.example.com
      hosts:
        - host: vpn.example.com
          paths:
            - path: /
              pathType: ImplementationSpecific

coturn:
  image:
    tag: 4.14.0
  # STUN/TURN needs a fixed port (3478) plus a dynamically chosen UDP relay port,
  # and no Service type can express a port range — so coturn runs on the host
  # network and the Services below exist only for in-cluster discovery. As a
  # DaemonSet every node answers on its own public IP, so the stun/turn DNS
  # records can point at any of them.
  deployment:
    type: DaemonSet
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    # A DaemonSet with no toleration schedules nowhere on tainted nodes: if the
    # stun/turn records point at control planes, add the toleration here.
    tolerations: []
    nodeSelector: {}
  service:
    type: ClusterIP
    # The API server rejects this on a ClusterIP Service; the chart renders the
    # field only when it is non-empty.
    externalTrafficPolicy: ""
  coturn:
    realm: "turn.vpn.example.com"
    ports:
      # Above the kernel's ephemeral range (32768-60999) so relay allocations
      # don't race the host's own outbound sockets. 2000 ports is 2000 concurrent
      # relays, and 2000 UDP ports to open on the firewall rather than 16384.
      min: 61000
      max: 63000
    # Every peer is handed the same static TURN credentials, so the relay has to
    # be treated as reachable by anyone on the mesh. no-tcp-relay drops RFC 6062,
    # which is the route to the node's own TCP services (apiserver, kubelet,
    # etcd); the deny list closes the UDP side. Per-cluster addresses the chart
    # cannot know — the node public IPs above all — go in extraDeniedPeerIPs.
    extraTurnserverConfiguration: |
      verbose
      no-multicast-peers
      no-tcp-relay
      denied-peer-ip=0.0.0.0-0.255.255.255
      denied-peer-ip=10.0.0.0-10.255.255.255
      denied-peer-ip=100.64.0.0-100.127.255.255
      denied-peer-ip=127.0.0.0-127.255.255.255
      denied-peer-ip=169.254.0.0-169.254.255.255
      denied-peer-ip=172.16.0.0-172.31.255.255
      denied-peer-ip=192.168.0.0-192.168.255.255
      denied-peer-ip=240.0.0.0-255.255.255.255
      denied-peer-ip=::1
      denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
  # coturn keeps its own user database in the built-in sqlite userdb. Databases
  # belong to the db operators, not to an application chart, so both bundled
  # database subcharts stay off and are pruned from the vendored copy — see
  # .helm-prune. NetBird's own database is a separate CNPG cluster.
  externalDatabase:
    enabled: false
  cnpg:
    enabled: false
  mysql:
    enabled: false
