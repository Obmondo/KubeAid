{{- if and .Values.config.enabled .Values.config.driftCorrection.enabled }}
# Re-applies the config on a schedule, undoing any drift inside OpenBao
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openbao.fullname" . }}-config-drift
  namespace: {{ .Release.Namespace }}
  {{- include "openbao.config.labels" . | nindent 2 }}
  {{- with .Values.config.driftCorrection.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.config.driftCorrection }}
spec:
  schedule: {{ .schedule | quote }}
  {{- with .timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: {{ .concurrencyPolicy }}
  suspend: {{ .suspend }}
  {{- if not (kindIs "invalid" .startingDeadlineSeconds) }}
  startingDeadlineSeconds: {{ .startingDeadlineSeconds }}
  {{- end }}
  successfulJobsHistoryLimit: {{ .successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      {{- include "openbao.config.jobSpec" . | nindent 6 }}
{{- end }}
      template:
        {{- include "openbao.config.podTemplate" . | nindent 8 }}
{{- end }}
