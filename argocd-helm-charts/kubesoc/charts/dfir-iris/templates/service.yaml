apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfir-iris.fullname" . }}-app
  labels:
    {{- include "dfir-iris.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "dfir-iris.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
