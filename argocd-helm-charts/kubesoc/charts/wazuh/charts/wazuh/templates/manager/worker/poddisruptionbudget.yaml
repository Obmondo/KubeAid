{{- if .Values.wazuh.worker.enabled }}
{{- if .Values.wazuh.worker.pdb.enabled }}
kind: PodDisruptionBudget
apiVersion: policy/v1
metadata:
  name: {{ include "wazuh.fullname" . }}-manager-worker
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ include "wazuh.fullname" . }}-manager
      node-type: worker
  {{- /* KubeAid patch: minAvailable, so a highly available release can require a
      quorum to stay up rather than only cap the pods an eviction may take. */}}
  {{- if .Values.wazuh.worker.pdb.minAvailable }}
  minAvailable: {{ .Values.wazuh.worker.pdb.minAvailable }}
  {{- else }}
  {{- with .Values.wazuh.worker.pdb.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}