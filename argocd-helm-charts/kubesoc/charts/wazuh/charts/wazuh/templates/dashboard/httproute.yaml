---
{{- if and .Values.dashboard.enabled .Values.dashboard.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "wazuh.fullname" . }}-dashboard
spec:
  parentRefs:
    {{- if .Values.dashboard.gateway.listenerSet.enabled }}
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "wazuh.fullname" . }}-dashboard
    {{- else }}
    - group: {{ .Values.dashboard.gateway.parentRef.group }}
      kind: {{ .Values.dashboard.gateway.parentRef.kind }}
      name: {{ required "dashboard.gateway.parentRef.name is required when dashboard.gateway.enabled is true" .Values.dashboard.gateway.parentRef.name }}
      {{- with .Values.dashboard.gateway.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
    {{- end }}
  hostnames:
    - {{ .Values.dashboard.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "wazuh.fullname" . }}-dashboard
          port: {{ .Values.dashboard.service.httpPort }}
{{- end }}
