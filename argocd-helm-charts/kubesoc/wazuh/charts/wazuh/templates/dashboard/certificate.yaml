{{- if and .Values.dashboard.enabled .Values.dashboard.gateway.enabled .Values.dashboard.gateway.tls.enabled .Values.dashboard.gateway.tls.certificate.create }}
{{- $secretName := include "wazuh.dashboard.gateway.tlsSecretName" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "wazuh.fullname" . }}-dashboard
spec:
  secretName: {{ $secretName }}
  issuerRef:
    name: {{ required "dashboard.gateway.tls.issuerRef.name is required when dashboard.gateway.tls.certificate.create is true" .Values.dashboard.gateway.tls.issuerRef.name }}
    kind: {{ .Values.dashboard.gateway.tls.issuerRef.kind }}
    group: {{ .Values.dashboard.gateway.tls.issuerRef.group }}
  dnsNames:
    - {{ .Values.dashboard.gateway.host | quote }}
{{- end }}
