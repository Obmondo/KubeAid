{{- $v := .Values.velociraptor.velociraptor | default dict }}
{{- $ac := $v.apiClient | default dict }}
{{- if and .Values.velociraptor.enabled $ac.enabled }}
{{- $name := "velociraptor-api-client" }}
{{- $secret := $ac.secretName | default "velociraptor-api-client" }}
{{- $sa := (($v.serviceAccount | default dict).name) | default ($v.fullnameOverride | default "velociraptor") }}
# The api-client-publish init container of the Velociraptor pod
# (velociraptor.velociraptor.apiClient) writes the reconciler's api_client config
# into Secret {{ $secret }}. create cannot be limited by resourceNames, so it applies
# to any Secret in this namespace; everything else only to that one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secops.labels" . | nindent 4 }}
    app.kubernetes.io/component: velociraptor
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secops.labels" . | nindent 4 }}
    app.kubernetes.io/component: velociraptor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
