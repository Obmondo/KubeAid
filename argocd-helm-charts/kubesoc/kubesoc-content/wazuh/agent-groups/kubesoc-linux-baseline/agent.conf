<agent_config os="Linux">
  <!-- Optional baseline for Linux agents (values: optional / tenants.<code>.include). -->
  <syscheck>
    <directories realtime="yes" check_all="yes">/etc/ssh</directories>
    <directories check_all="yes">/etc/sudoers,/etc/sudoers.d</directories>
  </syscheck>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</agent_config>
