{{- /*
  Monitoring of the platform itself (README "Monitoring"): a ServiceMonitor for
  the reconciler's metrics (reconciler.mode: deployment) and the PrometheusRule.
  Rules on kubesoc_* metrics need the reconciler Deployment; the others read
  kube-state-metrics and kubelet volume stats, which KubeAid's kube-prometheus
  always scrapes. Every alert carries alert_id and severity (KubeAid convention).
*/ -}}
{{- $m := .Values.monitoring | default dict }}
{{- $r := .Values.reconciler }}
{{- $ns := .Release.Namespace }}
{{- $long := and $r.enabled (eq ($r.mode | default "cronjob") "deployment") }}
{{- $sm := $m.serviceMonitor | default dict }}
{{- if and $sm.enabled $long }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: siem-reconciler
  namespace: {{ $ns }}
  labels:
    {{- include "secops.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciler
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: siem-reconciler
      app.kubernetes.io/component: reconciler
  namespaceSelector:
    matchNames:
      - {{ $ns }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $sm.interval | default "60s" }}
      scrapeTimeout: {{ $sm.scrapeTimeout | default "30s" }}
{{- end }}
{{- $pr := $m.prometheusRule | default dict }}
{{- if $pr.enabled }}
{{- $tw := .Values.tenantWazuh }}
{{- /* This namespace and every tenant namespace. */ -}}
{{- $nsRe := printf "%s|%s.+" (regexQuoteMeta $ns) (regexQuoteMeta $tw.namespacePrefix) }}
{{- $warn := $pr.diskWarningPercent | default 75 }}
{{- $crit := $pr.diskCriticalPercent | default 85 }}
{{- $pvc := printf "kubelet_volume_stats_used_bytes{namespace=~\"%s\", persistentvolumeclaim=~\"wazuh-indexer-.*\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"%s\", persistentvolumeclaim=~\"wazuh-indexer-.*\"}" $nsRe $nsRe }}
{{- /* CronJobs to watch: name -> what it does. */ -}}
{{- $cronjobs := dict }}
{{- if and $r.enabled (ne ($r.mode | default "cronjob") "deployment") }}
{{- $_ := set $cronjobs "siem-reconciler" "SIEM reconciler" }}
{{- end }}
{{- if and .Values.misp.enabled (.Values.misp.wazuhCdbExport | default dict).enabled }}
{{- $_ := set $cronjobs "misp-wazuh-cdb-export" "MISP indicator export to the Wazuh CDB lists" }}
{{- end }}
{{- if and (index .Values "dfir-iris").enabled ((index .Values "dfir-iris").aiTriage | default dict).enabled }}
{{- $_ := set $cronjobs "dfir-iris-ai-triage" "IRIS AI alert triage" }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-operations
  namespace: {{ $pr.namespace | default $ns }}
  labels:
    {{- include "secops.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
    {{- with $pr.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kubesoc-indexer
      rules:
        - alert: KubeSocIndexerHealthRed
          expr: max by (indexer) (kubesoc_indexer_cluster_status{status="red"}) == 1
          for: 5m
          labels:
            alert_id: KubeSocIndexerHealthRed
            severity: critical
          annotations:
            summary: 'Wazuh indexer {{ `{{ $labels.indexer }}` }} is red'
            description: 'Indexer {{ `{{ $labels.indexer }}` }} has unassigned primary shards: some events cannot be searched or written.'
        - alert: KubeSocIndexerHealthYellow
          expr: max by (indexer) (kubesoc_indexer_cluster_status{status="yellow"}) == 1
          for: 30m
          labels:
            alert_id: KubeSocIndexerHealthYellow
            severity: warning
          annotations:
            summary: 'Wazuh indexer {{ `{{ $labels.indexer }}` }} is yellow'
            description: 'Indexer {{ `{{ $labels.indexer }}` }} has unassigned replica shards for 30 minutes.'
        - alert: KubeSocIndexerDown
          expr: max by (indexer) (kubesoc_indexer_up) == 0
          for: 15m
          labels:
            alert_id: KubeSocIndexerDown
            severity: critical
          annotations:
            summary: 'Wazuh indexer {{ `{{ $labels.indexer }}` }} does not answer'
            description: 'The reconciler cannot read the health of indexer {{ `{{ $labels.indexer }}` }} (down, or its REST port or credentials are not reachable). See /status of siem-reconciler-metrics.'
        # Disk: the volume stats work in both reconciler modes; the reconciler's
        # figure (fullest data node) covers indexers without volume stats.
        - alert: KubeSocIndexerVolumeWarning
          expr: 100 * max by (namespace, persistentvolumeclaim) ({{ $pvc }}) > {{ $warn }}
          for: 15m
          labels:
            alert_id: KubeSocIndexerVolumeWarning
            severity: warning
          annotations:
            summary: 'Wazuh indexer volume {{ `{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}` }} is {{ `{{ $value | humanize }}` }}% full'
            description: 'Above {{ $warn }}%. At 95% the indexer makes the indices read-only and drops new alerts. Lower the tenant retentionDays or grow the volume (README "Retention").'
        - alert: KubeSocIndexerDiskWarning
          expr: max by (indexer) (kubesoc_indexer_disk_used_percent) > {{ $warn }}
          for: 15m
          labels:
            alert_id: KubeSocIndexerDiskWarning
            severity: warning
          annotations:
            summary: 'Wazuh indexer {{ `{{ $labels.indexer }}` }} disk is {{ `{{ $value | humanize }}` }}% full'
            description: 'Above {{ $warn }}%. At 95% the indexer makes the indices read-only and drops new alerts. Lower the tenant retentionDays or grow the volume (README "Retention").'
        - alert: KubeSocIndexerVolumeCritical
          expr: 100 * max by (namespace, persistentvolumeclaim) ({{ $pvc }}) > {{ $crit }}
          for: 5m
          labels:
            alert_id: KubeSocIndexerVolumeCritical
            severity: critical
          annotations:
            summary: 'Wazuh indexer volume {{ `{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}` }} is {{ `{{ $value | humanize }}` }}% full'
            description: 'Above {{ $crit }}%: the indexer no longer allocates shards; at 95% it goes read-only and alerts are lost. Act now (README "Retention").'
        - alert: KubeSocIndexerDiskCritical
          expr: max by (indexer) (kubesoc_indexer_disk_used_percent) > {{ $crit }}
          for: 5m
          labels:
            alert_id: KubeSocIndexerDiskCritical
            severity: critical
          annotations:
            summary: 'Wazuh indexer {{ `{{ $labels.indexer }}` }} disk is {{ `{{ $value | humanize }}` }}% full'
            description: 'Above {{ $crit }}%: the indexer no longer allocates shards; at 95% it goes read-only and alerts are lost. Act now (README "Retention").'
    - name: kubesoc-wazuh
      rules:
        - alert: KubeSocWazuhManagerDown
          expr: max by (tenant) (kubesoc_wazuh_manager_up) == 0
          for: 15m
          labels:
            alert_id: KubeSocWazuhManagerDown
            severity: critical
          annotations:
            summary: 'Wazuh manager of tenant {{ `{{ $labels.tenant }}` }} does not answer'
            description: 'The manager API of tenant {{ `{{ $labels.tenant }}` }} has not answered the reconciler for 15 minutes.'
        - alert: KubeSocWazuhEventsDropped
          expr: max by (tenant) (increase(kubesoc_wazuh_analysisd_events_dropped[30m])) > 0
          labels:
            alert_id: KubeSocWazuhEventsDropped
            severity: warning
          annotations:
            summary: 'Wazuh manager of tenant {{ `{{ $labels.tenant }}` }} dropped events'
            description: 'analysisd discarded {{ `{{ $value | humanize }}` }} events in 30 minutes (queues full or EPS limit): they never became alerts.'
        - alert: KubeSocWazuhAgentsDisconnected
          expr: |-
            max by (tenant) (kubesoc_wazuh_agents{status="disconnected"})
              / clamp_min(max by (tenant) (kubesoc_wazuh_agents{status="total"}) - max by (tenant) (kubesoc_wazuh_agents{status="never_connected"}), 1)
              > {{ $pr.agentsDisconnectedRatio | default 0.2 }}
          for: 30m
          labels:
            alert_id: KubeSocWazuhAgentsDisconnected
            severity: warning
          annotations:
            summary: 'Many agents of tenant {{ `{{ $labels.tenant }}` }} are disconnected'
            description: '{{ `{{ $value | humanizePercentage }}` }} of the agents that ever connected to the tenant manager are disconnected.'
    - name: kubesoc-reconciler
      rules:
        - alert: KubeSocReconcilerErrors
          expr: sum by (component) (kubesoc_reconciler_objects{action="error"}) > 0
          for: 30m
          labels:
            alert_id: KubeSocReconcilerErrors
            severity: warning
          annotations:
            summary: 'SIEM reconciler cannot reconcile {{ `{{ $labels.component }}` }}'
            description: '{{ `{{ $value }}` }} objects of {{ `{{ $labels.component }}` }} failed in every run for 30 minutes. Read the siem-reconciler log.'
        {{- if $long }}
        - alert: KubeSocReconcilerNoSuccessfulRun
          expr: |-
            (time() - max(kubesoc_reconciler_last_success_timestamp_seconds) > {{ $pr.reconcilerStaleSeconds | default 1800 }})
              or absent(kubesoc_reconciler_last_run_timestamp_seconds)
          for: 10m
          labels:
            alert_id: KubeSocReconcilerNoSuccessfulRun
            severity: warning
          annotations:
            summary: 'SIEM reconciler has not completed a run without errors'
            description: 'No error-free reconcile run for {{ div ($pr.reconcilerStaleSeconds | default 1800) 60 }} minutes, or the reconciler is not scraped. Tenant onboarding, retention and access changes are not applied.'
        {{- end }}
        - alert: KubeSocComponentUnreachable
          expr: max by (component) (kubesoc_component_up) == 0
          for: 15m
          labels:
            alert_id: KubeSocComponentUnreachable
            severity: warning
          annotations:
            summary: 'SOC component {{ `{{ $labels.component }}` }} does not answer the reconciler'
            description: 'The {{ `{{ $labels.component }}` }} API has not answered for 15 minutes.'
    {{- if $cronjobs }}
    - name: kubesoc-cronjobs
      rules:
        {{- range $cj, $what := $cronjobs }}
        {{- $id := printf "KubeSoc%s" (camelcase (replace "-" "_" $cj)) }}
        - alert: {{ $id }}Failing
          expr: |-
            max(kube_cronjob_status_last_schedule_time{namespace="{{ $ns }}", cronjob="{{ $cj }}"})
              - max(kube_cronjob_status_last_successful_time{namespace="{{ $ns }}", cronjob="{{ $cj }}"}) > 0
          for: 45m
          labels:
            alert_id: {{ $id }}Failing
            severity: warning
          annotations:
            summary: '{{ $what }} is failing'
            description: 'The latest runs of CronJob {{ $ns }}/{{ $cj }} have not succeeded for 45 minutes.'
        - alert: {{ $id }}Stale
          expr: |-
            (time() - max(kube_cronjob_status_last_successful_time{namespace="{{ $ns }}", cronjob="{{ $cj }}"}) > {{ ternary ($pr.reconcilerStaleSeconds | default 1800) ($pr.jobStaleSeconds | default 3600) (eq $cj "siem-reconciler") }})
              or (time() - max(kube_cronjob_created{namespace="{{ $ns }}", cronjob="{{ $cj }}"}) > {{ ternary ($pr.reconcilerStaleSeconds | default 1800) ($pr.jobStaleSeconds | default 3600) (eq $cj "siem-reconciler") }}
                unless max(kube_cronjob_status_last_successful_time{namespace="{{ $ns }}", cronjob="{{ $cj }}"}))
          labels:
            alert_id: {{ $id }}Stale
            severity: {{ ternary "warning" "critical" (eq $cj "dfir-iris-ai-triage") }}
          annotations:
            summary: '{{ $what }} has not succeeded recently'
            description: 'CronJob {{ $ns }}/{{ $cj }} has had no successful run for {{ div (ternary ($pr.reconcilerStaleSeconds | default 1800) ($pr.jobStaleSeconds | default 3600) (eq $cj "siem-reconciler")) 60 }} minutes.'
        {{- end }}
    {{- end }}
{{- if include "secops.backup.enabled" . }}
{{- $b := .Values.backup }}
{{- $staleHours := $pr.backupStaleHours | default 36 }}
    {{- /*
      Backups (values.yaml `backup`). A backup that stopped working is only
      discovered when it is needed, so every backend gets an alert on its own
      age rather than on the last run's exit status alone. The snapshot
      CronJobs live in this namespace and in every tenant's.
    */}}
    - name: kubesoc-backups
      rules:
{{- if $b.velero.enabled }}
        - alert: KubeSocVeleroBackupFailing
          expr: |-
            increase(velero_backup_failure_total{schedule=~"kubesoc-(daily|weekly)"}[6h]) > 0
              or increase(velero_backup_partial_failure_total{schedule=~"kubesoc-(daily|weekly)"}[6h]) > 0
          labels:
            alert_id: KubeSocVeleroBackupFailing
            severity: warning
          annotations:
            summary: 'Velero schedule {{ `{{ $labels.schedule }}` }} is failing'
            description: 'A backup of the SOC volumes failed or was partial in the last 6 hours. Check `velero backup logs`.'
        - alert: KubeSocVeleroBackupStale
          expr: |-
            time() - max by (schedule) (velero_backup_last_successful_timestamp{schedule=~"kubesoc-(daily|weekly)"}) > {{ mul $staleHours 3600 }}
              or absent(velero_backup_last_successful_timestamp{schedule="kubesoc-daily"}) == 1
          for: 1h
          labels:
            alert_id: KubeSocVeleroBackupStale
            severity: critical
          annotations:
            summary: 'No SOC volume backup for {{ $staleHours }} hours'
            description: 'Velero schedule {{ `{{ $labels.schedule }}` }} has no successful backup in {{ $staleHours }} hours: the Wazuh manager data, the Velociraptor datastore, the IRIS files and the MISP attachments are unprotected.'
{{- end }}
{{- if $b.opensearch.enabled }}
        - alert: KubeSocIndexerSnapshotStale
          expr: |-
            time() - max by (namespace) (kube_cronjob_status_last_successful_time{namespace=~"{{ $nsRe }}", cronjob="kubesoc-indexer-snapshot"}) > {{ mul $staleHours 3600 }}
          for: 1h
          labels:
            alert_id: KubeSocIndexerSnapshotStale
            severity: critical
          annotations:
            summary: 'No alert index snapshot in {{ `{{ $labels.namespace }}` }} for {{ $staleHours }} hours'
            description: 'The OpenSearch snapshot CronJob in {{ `{{ $labels.namespace }}` }} has had no successful run in {{ $staleHours }} hours: the alerts of that tenant are only on the indexer volumes.'
{{- end }}
{{- if $b.verifyRestore.enabled }}
        - alert: KubeSocRestoreCheckFailing
          expr: |-
            max(kube_cronjob_status_last_schedule_time{namespace="{{ $ns }}", cronjob="kubesoc-restore-check"})
              - max(kube_cronjob_status_last_successful_time{namespace="{{ $ns }}", cronjob="kubesoc-restore-check"}) > 0
          for: 2h
          labels:
            alert_id: KubeSocRestoreCheckFailing
            severity: critical
          annotations:
            summary: 'The IRIS database backup did not restore'
            description: 'The monthly restore check could not recover the newest CloudNativePG backup into a scratch cluster and query it: the database backups cannot be relied on.'
{{- end }}
{{- end }}
    - name: kubesoc-workloads
      rules:
        - alert: KubeSocJobFailed
          expr: max by (namespace, job_name) (kube_job_failed{namespace=~"{{ $nsRe }}", condition="true"}) > 0
          for: 15m
          labels:
            alert_id: KubeSocJobFailed
            severity: warning
          annotations:
            summary: 'Job {{ `{{ $labels.namespace }}/{{ $labels.job_name }}` }} failed'
            description: 'A Job of the SOC (backup, export, triage or reconcile) failed. It stays listed until the CronJob history or a manual delete removes it.'
        # Any Deployment or StatefulSet of the SOC (IRIS, MISP, Velociraptor, the
        # Wazuh indexers, managers and dashboards, databases) without a ready pod.
        - alert: KubeSocComponentDown
          expr: |-
            label_replace(
              (max by (namespace, deployment) (kube_deployment_spec_replicas{namespace=~"{{ $nsRe }}"}) > 0)
                and (max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace=~"{{ $nsRe }}"}) == 0),
              "workload", "deployment/$1", "deployment", "(.+)")
            or label_replace(
              (max by (namespace, statefulset) (kube_statefulset_replicas{namespace=~"{{ $nsRe }}"}) > 0)
                and (max by (namespace, statefulset) (kube_statefulset_status_replicas_ready{namespace=~"{{ $nsRe }}"}) == 0),
              "workload", "statefulset/$1", "statefulset", "(.+)")
          for: 10m
          labels:
            alert_id: KubeSocComponentDown
            severity: critical
          annotations:
            summary: '{{ `{{ $labels.namespace }}/{{ $labels.workload }}` }} has no ready pod'
            description: '{{ `{{ $labels.workload }}` }} in {{ `{{ $labels.namespace }}` }} has been unavailable for 10 minutes.'
        {{- with $pr.keycloak }}
        {{- if and .namespace .statefulset }}
        - alert: KubeSocKeycloakDown
          expr: max(kube_statefulset_status_replicas_ready{namespace="{{ .namespace }}", statefulset="{{ .statefulset }}"}) == 0 or absent(kube_statefulset_status_replicas_ready{namespace="{{ .namespace }}", statefulset="{{ .statefulset }}"})
          for: 10m
          labels:
            alert_id: KubeSocKeycloakDown
            severity: critical
          annotations:
            summary: 'Keycloak is down: nobody can log in to the SOC'
            description: 'StatefulSet {{ .namespace }}/{{ .statefulset }} has no ready replica.'
        {{- end }}
        {{- end }}
{{- end }}
