{{- $keys := include "prometheus-linuxaid.jwtKeys" . }}
{{- if $keys }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-jwt
  namespace: {{ template "prometheus-linuxaid.namespace" . }}
spec:
  plugin:
    jwt:
      PayloadFields:
        - exp
      Required: true
      Keys:
{{ $keys | indent 8 }}
      JwtHeaders: {{ toYaml .Values.middleware.jwt.headers | nindent 8 }}
      JwtCookieKey: jwt
{{- end }}
