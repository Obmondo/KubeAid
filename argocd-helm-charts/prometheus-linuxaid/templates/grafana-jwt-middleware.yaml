{{- $jwt := .Values.middleware.jwt }}
{{- $keys := default (list) $jwt.public_keys }}
{{- if and (eq (len $keys) 0) $jwt.public_key }}
{{- $keys = list $jwt.public_key }}
{{- end }}
{{- if and $jwt.enabled (gt (len $keys) 0) }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-jwt
  namespace: {{ template "prometheus-linuxaid.namespace" . }}
spec:
  plugin:
    jwt:
      PayloadFields:
        - exp
      Required: true
      Keys:
{{ toYaml $keys | indent 8 }}
      JwtHeaders: {{ toYaml $jwt.headers | nindent 8 }}
      JwtCookieKey: jwt
{{- end }}
