groups:
  - name: monitor::system::dns
    rules:
      - alert: monitor::system::dns::resolution
        # One alert per certname; the failing domains are listed in the description.
        expr: |
          count by (certname) (
            node_dns_test_result{status="failed"} == 1
          ) and on(certname) obmondo_monitoring{alert_id="monitor::system::dns::resolution"} > 0
        for: 5m
        labels:
          severity: critical
          alert_id: monitor::system::dns::resolution
        annotations:
          summary: "DNS resolution failed for {{ $value }} domain(s) on {{ $labels.certname }}"
          description: |
            DNS resolution has failed on certname **{{ $labels.certname }}** for the following domain(s):
            {{ range query (printf `node_dns_test_result{status="failed",certname="%s"} == 1` $labels.certname) | sortByLabel "host" }}- **{{ .Labels.host }}**: {{ .Labels.result }}
            {{ end -}}
