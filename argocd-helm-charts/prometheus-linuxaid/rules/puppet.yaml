groups:
  - name: monitor::system::puppet
    rules:
    - alert: monitor::system::puppet::last_run
      expr: time() - puppet_report{environment=~"v?[0-9]+_[0-9]+_[0-9]+",host!~".+.niwyocdmk2"} >= 86400 * 1
      for: 24h
      labels:
        alert_id: 'monitor::system::puppet::last_run'
        severity: warning
      annotations:
        summary: 'Puppet has not run on **{{ $labels.host }}** for more than 2 days'
        description: |-2
          Last Puppet run on **{{ $labels.host }}** was on {{ $labels.host | printf "puppet_report{host=\"%s\"}" | query | first | value | humanizeTimestamp }}, more than the limit of 2 days ago.

          This could be due to any number of things, e.g. Puppet crashing or hanging, or cron/systemd timers being broken.

    - alert: monitor::system::puppet::run_failed
      expr: puppet_status{state="failed",environment=~"v?[0-9]+_[0-9]+_[0-9]+"} == 1
      for: 3h
      labels:
        alert_id: 'monitor::system::puppet::run_failed'
        severity: warning
      annotations:
        summary: 'Puppet run is failing on **{{ $labels.host }}** in environment **{{ $labels.environment }}**'
        description: |-2
          Puppet runs on **{{ $labels.host }}** in environment **{{ $labels.environment }}** have been failing for more than 3 hours.

          Check the failed resources on Puppetboard:
          https://dashboard.obmondo.com/nodes?status=failed

    - alert: monitor::system::puppet::pending_changes
      expr: count(puppet_report_events{name="Total",environment=~"v?[0-9]+_[0-9]+_[0-9]+"} > 0) > 5
      for: 3h
      labels:
        alert_id: 'monitor::system::puppet::pending_changes'
        severity: warning
      annotations:
        summary: 'Puppet has pending changes on more than 5 servers'
        description: |-2
          Puppet has pending changes on {{ $value }} servers for more than 3 hours:
          {{ range query `sort_desc(puppet_report_events{name="Total",environment=~"v?[0-9]+_[0-9]+_[0-9]+"} > 0)` }}
          - **{{ .Labels.host }}** ({{ .Labels.environment }}): {{ .Value }} pending changes
          {{- end }}
