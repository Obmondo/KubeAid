---
evaluation_interval: 1m

rule_files:
  - ../rules/puppet.yaml

tests:
  - interval: 1m
    input_series:
      # last run at t=0, never again
      - series: 'puppet_report{host="atat.example",environment="v1_0_0"}'
        values: 0x3000
      # failing in a release environment
      - series: 'puppet_status{state="failed",host="fail.example",environment="v1_0_0"}'
        values: 1x1600
      # healthy node
      - series: 'puppet_status{state="failed",host="ok.example",environment="v1_0_0"}'
        values: 0x1600
      # failing outside a release environment: ignored
      - series: 'puppet_status{state="failed",host="branch.example",environment="master"}'
        values: 1x1600

    alert_rule_test:
      - alertname: 'monitor::system::puppet::last_run'
        eval_time: 47h
        exp_alerts: []
      - alertname: 'monitor::system::puppet::last_run'
        eval_time: 49h
        exp_alerts:
          - exp_labels:
              severity: warning
              host: atat.example
              environment: v1_0_0
              alert_id: 'monitor::system::puppet::last_run'
            exp_annotations:
              summary: 'Puppet has not run on **atat.example** for more than 2 days'
              description: |-2
                Last Puppet run on **atat.example** was on 1970-01-01 00:00:00 +0000 UTC, more than the limit of 2 days ago.

                This could be due to any number of things, e.g. Puppet crashing or hanging, or cron/systemd timers being broken.
      - alertname: 'monitor::system::puppet::run_failed'
        eval_time: 2h
        exp_alerts: []
      - alertname: 'monitor::system::puppet::run_failed'
        eval_time: 4h
        exp_alerts:
          - exp_labels:
              severity: warning
              host: fail.example
              state: failed
              environment: v1_0_0
              alert_id: 'monitor::system::puppet::run_failed'
            exp_annotations:
              summary: 'Puppet run is failing on **fail.example** in environment **v1_0_0**'
              description: |-2
                Puppet runs on **fail.example** in environment **v1_0_0** have been failing for more than 3 hours.

                Check the failed resources on Puppetboard:
                https://dashboard.obmondo.com/nodes?status=failed
