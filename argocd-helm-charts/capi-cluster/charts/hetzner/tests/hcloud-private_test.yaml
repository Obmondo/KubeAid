suite: hcloud mode with private network
templates:
  - "*.yaml"
release:
  name: demo
chart:
  version: 1.0.0
  appVersion: 1.0.0
values:
  - ../values.example.hcloud.yaml
set:
  mode: hcloud
  network.type: private
  global.clusterName: demo
  global.kubernetes.version: v1.33.0
  global.pods.cidrBlock: 10.244.0.0/16
  global.additionalUsers: []
tests:
  - it: renders the core CAPI Cluster resource
    template: Cluster.yaml
    asserts:
      - isKind:
          of: Cluster
      - equal:
          path: metadata.name
          value: demo

  - it: renders HetznerCluster with an HCloud private network
    template: HetznerCluster.yaml
    asserts:
      - isKind:
          of: HetznerCluster
      - equal:
          path: spec.hcloudNetwork.enabled
          value: true
      - equal:
          path: spec.hcloudNetwork.cidrBlock
          value: 10.0.0.0/16
      - equal:
          path: spec.hcloudNetwork.subnetCidrBlock
          value: 10.0.0.0/24

  - it: gives every HCloud machine a public IPv4 and no IPv6, also on the private network
    template: HCloudMachineTemplate.yaml
    asserts:
      - equal:
          path: spec.template.spec.publicNetwork.enableIPv4
          value: true
      - equal:
          path: spec.template.spec.publicNetwork.enableIPv6
          value: false

  - it: ships no NAT gateway bootstrap on the control plane
    template: KubeadmControlPlane.yaml
    asserts:
      - notContains:
          path: spec.kubeadmConfigSpec.preKubeadmCommands
          content: chmod +x /connect-nat-gateway.sh && /connect-nat-gateway.sh
      - notContains:
          path: spec.kubeadmConfigSpec.files
          content:
            path: /connect-nat-gateway.sh
          any: true

  - it: ships no NAT gateway bootstrap on HCloud workers
    template: KubeadmConfigTemplate.yaml
    asserts:
      - notContains:
          path: spec.template.spec.preKubeadmCommands
          content: chmod +x /connect-nat-gateway.sh && /connect-nat-gateway.sh
      - notContains:
          path: spec.template.spec.files
          content:
            path: /connect-nat-gateway.sh
          any: true

  - it: renders no bare-metal resources in hcloud mode
    template: HetznerBareMetalHost.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: pins the kubeadm advertise address on the first control-plane node to the private-network IP
    template: KubeadmControlPlane.yaml
    asserts:
      - equal:
          path: spec.kubeadmConfigSpec.initConfiguration.localAPIEndpoint.advertiseAddress
          value: "{{ds.meta_data.private_networks[0].ip}}"

  - it: pins the kubeadm advertise address on joining control-plane nodes to the private-network IP
    template: KubeadmControlPlane.yaml
    asserts:
      - equal:
          path: spec.kubeadmConfigSpec.joinConfiguration.controlPlane.localAPIEndpoint.advertiseAddress
          value: "{{ds.meta_data.private_networks[0].ip}}"

  - it: leaves kubelet's node IP to ccm-hcloud
    template: KubeadmControlPlane.yaml
    asserts:
      - notContains:
          path: spec.kubeadmConfigSpec.initConfiguration.nodeRegistration.kubeletExtraArgs
          content:
            name: node-ip
          any: true
      - notContains:
          path: spec.kubeadmConfigSpec.joinConfiguration.nodeRegistration.kubeletExtraArgs
          content:
            name: node-ip
          any: true
      - notMatchRegex:
          path: spec.kubeadmConfigSpec.files[0].content
          pattern: "nodeIP:"

  - it: binds the Floating IPs on eth0 with link scope
    template: KubeadmControlPlane.yaml
    set:
      controlPlane.hcloud.floatingIPs:
        - 203.0.113.10
    asserts:
      - contains:
          path: spec.kubeadmConfigSpec.files
          content:
            path: /etc/systemd/network/10-netplan-eth0.network.d/60-floating-ip.conf
            owner: root:root
            permissions: "0644"
            content: |
              [Address]
              Address=203.0.113.10/32
              Scope=link
      - contains:
          path: spec.kubeadmConfigSpec.preKubeadmCommands
          content: ip addr replace 203.0.113.10/32 dev eth0 scope link

  - it: binds no Floating IP when none are configured
    template: KubeadmControlPlane.yaml
    asserts:
      - notContains:
          path: spec.kubeadmConfigSpec.files
          content:
            path: /etc/systemd/network/10-netplan-eth0.network.d/60-floating-ip.conf
          any: true

  - it: keeps the control-plane taint when node-groups exist
    template: KubeadmControlPlane.yaml
    asserts:
      - notExists:
          path: spec.kubeadmConfigSpec.initConfiguration.nodeRegistration.taints
      - notExists:
          path: spec.kubeadmConfigSpec.joinConfiguration.nodeRegistration.taints

  - it: registers the control plane untainted when there are no node-groups
    template: KubeadmControlPlane.yaml
    set:
      nodeGroups.hcloud: []
      nodeGroups.bareMetal: []
    asserts:
      - equal:
          path: spec.kubeadmConfigSpec.initConfiguration.nodeRegistration.taints
          value: []
      - equal:
          path: spec.kubeadmConfigSpec.joinConfiguration.nodeRegistration.taints
          value: []
