suite: hcloud mode with a public control plane on the private network
templates:
  - "*.yaml"
release:
  name: demo
chart:
  version: 1.0.0
  appVersion: 1.0.0
values:
  - ../values.example.hcloud.yaml
set:
  mode: hcloud
  network.type: private
  global.clusterName: demo
  global.kubernetes.version: v1.33.0
  global.pods.cidrBlock: 10.244.0.0/16
  global.additionalUsers: []
  controlPlane.hcloud.publicNetwork.enabled: true
tests:
  - it: keeps the HCloud private network
    template: HetznerCluster.yaml
    asserts:
      - isKind:
          of: HetznerCluster
      - exists:
          path: spec.hcloudNetwork

  - it: gives the control plane a public IPv4 and IPv6
    template: HCloudMachineTemplate.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.publicNetwork.enableIPv4
          value: true
      - equal:
          path: spec.template.spec.publicNetwork.enableIPv6
          value: true

  - it: leaves node groups private
    template: HCloudMachineTemplate.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.publicNetwork.enableIPv4
          value: false
      - equal:
          path: spec.template.spec.publicNetwork.enableIPv6
          value: false

  - it: pins the kubeadm advertise address on the first control-plane node
    template: KubeadmControlPlane.yaml
    asserts:
      - equal:
          path: spec.kubeadmConfigSpec.initConfiguration.localAPIEndpoint.advertiseAddress
          value: __KUBEAID_NODE_IP__

  - it: pins the kubeadm advertise address on joining control-plane nodes
    template: KubeadmControlPlane.yaml
    asserts:
      - equal:
          path: spec.kubeadmConfigSpec.joinConfiguration.controlPlane.localAPIEndpoint.advertiseAddress
          value: __KUBEAID_NODE_IP__

  - it: passes kubelet's node IP as a flag and fills the placeholders in from the private subnet at boot
    template: KubeadmControlPlane.yaml
    asserts:
      - contains:
          path: spec.kubeadmConfigSpec.initConfiguration.nodeRegistration.kubeletExtraArgs
          content:
            name: node-ip
            value: __KUBEAID_NODE_IP__
      - contains:
          path: spec.kubeadmConfigSpec.joinConfiguration.nodeRegistration.kubeletExtraArgs
          content:
            name: node-ip
            value: __KUBEAID_NODE_IP__
      - notMatchRegex:
          path: spec.kubeadmConfigSpec.files[0].content
          pattern: "nodeIP:"
      - matchRegex:
          path: spec.kubeadmConfigSpec.preKubeadmCommands[1]
          pattern: "ip -4 -o addr show scope global to 10\\.0\\.0\\.0/24"
      - matchRegex:
          path: spec.kubeadmConfigSpec.preKubeadmCommands[1]
          pattern: "for kubeadm_config in"

  - it: binds the controller-manager and scheduler to the private IP through kubeadm patches
    template: KubeadmControlPlane.yaml
    asserts:
      - equal:
          path: spec.kubeadmConfigSpec.initConfiguration.patches.directory
          value: /etc/kubernetes/kubeaid-patches
      - equal:
          path: spec.kubeadmConfigSpec.joinConfiguration.patches.directory
          value: /etc/kubernetes/kubeaid-patches

  - it: does not ship the NAT gateway bootstrap on a public control plane
    template: KubeadmControlPlane.yaml
    asserts:
      - notContains:
          path: spec.kubeadmConfigSpec.preKubeadmCommands
          content: chmod +x /connect-nat-gateway.sh && /connect-nat-gateway.sh

  - it: still ships the NAT gateway bootstrap on private HCloud workers
    template: KubeadmConfigTemplate.yaml
    asserts:
      - contains:
          path: spec.template.spec.preKubeadmCommands
          content: chmod +x /connect-nat-gateway.sh && /connect-nat-gateway.sh

  - it: keeps the control-plane taint when node-groups exist
    template: KubeadmControlPlane.yaml
    asserts:
      - notExists:
          path: spec.kubeadmConfigSpec.initConfiguration.nodeRegistration.taints
      - notExists:
          path: spec.kubeadmConfigSpec.joinConfiguration.nodeRegistration.taints

  - it: registers the control plane untainted when there are no node-groups
    template: KubeadmControlPlane.yaml
    set:
      nodeGroups.hcloud: []
      nodeGroups.bareMetal: []
    asserts:
      - equal:
          path: spec.kubeadmConfigSpec.initConfiguration.nodeRegistration.taints
          value: []
      - equal:
          path: spec.kubeadmConfigSpec.joinConfiguration.nodeRegistration.taints
          value: []
