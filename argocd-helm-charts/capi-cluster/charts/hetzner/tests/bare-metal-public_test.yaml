suite: bare-metal mode with public network
templates:
  - "*.yaml"
release:
  name: demo
chart:
  version: 1.0.0
  appVersion: 1.0.0
values:
  - ../values.example.bare-metal.yaml
set:
  mode: bare-metal
  network.type: public
  global.clusterName: demo
  global.kubernetes.version: v1.33.0
  global.pods.cidrBlock: 10.244.0.0/16
  global.additionalUsers: []
tests:
  - it: renders the core CAPI Cluster resource
    template: Cluster.yaml
    asserts:
      - isKind:
          of: Cluster
      - equal:
          path: metadata.name
          value: demo

  - it: does not render an HCloud private network in bare-metal mode
    template: HetznerCluster.yaml
    asserts:
      - isKind:
          of: HetznerCluster
      - notExists:
          path: spec.hcloudNetwork

  - it: renders a HetznerBareMetalMachineTemplate for the control plane
    template: HetznerBareMetalMachineTemplate.yaml
    asserts:
      - isKind:
          of: HetznerBareMetalMachineTemplate

  - it: renders a HetznerBareMetalHost per configured control-plane + worker host
    template: HetznerBareMetalHost.yaml
    asserts:
      - hasDocuments:
          count: 6

  - it: does not ship the NAT gateway bootstrap on the control plane
    template: KubeadmControlPlane.yaml
    asserts:
      - notContains:
          path: spec.kubeadmConfigSpec.preKubeadmCommands
          content: chmod +x /connect-nat-gateway.sh && /connect-nat-gateway.sh

  - it: renders no HCloud machine templates in bare-metal mode
    template: HCloudMachineTemplate.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: lays down an EFI System Partition by default
    template: HetznerBareMetalMachineTemplate.yaml
    asserts:
      - contains:
          path: spec.template.spec.installImage.partitions
          content:
            fileSystem: esp
            mount: /boot/efi
            size: 512M

  - it: omits the EFI System Partition on legacy BIOS servers
    template: HetznerBareMetalMachineTemplate.yaml
    set:
      bareMetal.installImage.firmware: bios
    asserts:
      - notContains:
          path: spec.template.spec.installImage.partitions
          content:
            fileSystem: esp
            mount: /boot/efi
            size: 512M
      - equal:
          path: spec.template.spec.installImage.partitions[0].mount
          value: /boot

  - it: omits the EFI System Partition on worker machines too
    template: HetznerBareMetalMachine.yaml
    documentIndex: 0
    set:
      bareMetal.installImage.firmware: bios
    asserts:
      - notContains:
          path: spec.installImage.partitions
          content:
            fileSystem: esp
            mount: /boot/efi
            size: 512M
      - equal:
          path: spec.installImage.partitions[0].mount
          value: /boot

  - it: passes kubelet's node IP as a flag and fills it in from the vSwitch privateIP at boot
    template: KubeadmControlPlane.yaml
    asserts:
      - contains:
          path: spec.kubeadmConfigSpec.initConfiguration.nodeRegistration.kubeletExtraArgs
          content:
            name: node-ip
            value: __KUBEAID_NODE_IP__
      - contains:
          path: spec.kubeadmConfigSpec.joinConfiguration.nodeRegistration.kubeletExtraArgs
          content:
            name: node-ip
            value: __KUBEAID_NODE_IP__
      - notMatchRegex:
          path: spec.kubeadmConfigSpec.files[0].content
          pattern: "nodeIP:"
      - matchRegex:
          path: spec.kubeadmConfigSpec.preKubeadmCommands[14]
          pattern: "for kubeadm_config in /run/kubeadm/kubeadm.yaml /run/kubeadm/kubeadm-join-config.yaml /kubeadm-join-config.yaml"

  - it: binds the controller-manager and scheduler to the vSwitch IP through kubeadm patches
    template: KubeadmControlPlane.yaml
    asserts:
      - equal:
          path: spec.kubeadmConfigSpec.initConfiguration.patches.directory
          value: /etc/kubernetes/kubeaid-patches
      - equal:
          path: spec.kubeadmConfigSpec.joinConfiguration.patches.directory
          value: /etc/kubernetes/kubeaid-patches
      - matchRegex:
          path: spec.kubeadmConfigSpec.preKubeadmCommands[14]
          pattern: "kube-scheduler\\+json\\.json; do"

  - it: pins nothing to a private IP without a vSwitch
    template: KubeadmControlPlane.yaml
    set:
      bareMetal.vSwitch: null
    asserts:
      - notExists:
          path: spec.kubeadmConfigSpec.initConfiguration.patches
      - notExists:
          path: spec.kubeadmConfigSpec.joinConfiguration.patches
      - notContains:
          path: spec.kubeadmConfigSpec.initConfiguration.nodeRegistration.kubeletExtraArgs
          content:
            name: node-ip
            value: __KUBEAID_NODE_IP__
