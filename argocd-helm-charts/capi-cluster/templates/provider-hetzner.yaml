{{- if (.Values.provider).hetzner }}

{{- $name := "hetzner" }}
{{- /* Namespace defaults to "capi-cluster". Existing deployments that
       used the old per-customer suffix (e.g. capi-cluster-enableit) can
       opt back in by setting global.capiClusterNamespace in values. */ -}}
{{- $namespace := default "capi-cluster" .Values.global.capiClusterNamespace }}

{{- $image := printf "ghcr.io/syself/caph:%s" .Values.global.caph.version }}

apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  configSecret:
    name: {{ .Values.hetzner.cloudCredentialsSecretName }}
    namespace: {{ $namespace }}
  version: {{ .Values.global.caph.version }}
  fetchConfig:
    url: https://github.com/syself/cluster-api-provider-hetzner/releases/download/{{ .Values.global.caph.version }}/infrastructure-components.yaml
  manager:
    cacheNamespace: {{ $namespace }}
    # BUG : ClusterAPI renders --metrics-bind-addr but CAPH wants --metrics-bind-address.
    # metrics:
    #   bindAddress: ":8181"
    # syncPeriod: 10m0s
  manifestPatches:
    - |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: caph-controller-manager
        namespace: {{ $namespace }}
      spec:
        template:
          spec:
            containers:
            - args:
                - --leader-elect=true
                - --namespace={{ $namespace }}
                # CAPH's built-in CSR approver builds its allow-list from
                # HetznerBareMetalMachine.status.addresses, which comes from the
                # hardwareDetails NIC snapshot taken in the rescue system — before
                # cloud-init creates the vSwitch VLAN. A worker's kubelet advertises
                # its vSwitch IP (--node-ip=10.0.1.x), so the serving CSR carries an
                # address CAPH can never know and is Denied ("the IP address ... is
                # not allowed"). kubelet then has no serving cert and every
                # apiserver→kubelet call (logs, exec, port-forward, metrics) fails
                # with "remote error: tls: internal error".
                # KubeAid ships kubelet-csr-approver, which validates the same CSRs
                # against providerIpPrefixes (10.0.0.0/16 by default — covering both
                # the HCloud network and the vSwitch subnet), so CAPH's approver is
                # redundant here. REFER: https://github.com/syself/cluster-api-provider-hetzner/issues/2095
                - --disable-csr-approval
              command:
                - /manager
              image: {{ $image }}
              imagePullPolicy: IfNotPresent
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /healthz
                  port: healthz
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              name: manager
              ports:
                - containerPort: 9443
                  name: webhook-server
                  protocol: TCP
                - containerPort: 9440
                  name: healthz
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /readyz
                  port: healthz
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              resources:
                limits:
                  cpu: 150m
                  memory: 250Mi
                requests:
                  cpu: 100m
                  memory: 100Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: FallbackToLogsOnError
              volumeMounts:
              - mountPath: /tmp/k8s-webhook-server/serving-certs
                name: cert
                readOnly: true
{{- end }}
