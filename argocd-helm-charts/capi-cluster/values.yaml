global:
  kubernetes:
    version: v1.33.0
  clusterAPI:
    version: v1.11.3
  enableClusterAutoscaler: true
  capa:
    # v2.11+ is required for EKS clusters : NodeadmConfig (the AL2023 worker
    # bootstrap) isn't shipped in earlier releases. v2.11.1 also matches the
    # clusterawsadm library embedded in kubeaid-cli.
    version: v2.11.1
    enableMachinePools: false
  caph:
    version: v1.1.8
    # Rendered into the InfrastructureProvider's spec.deployment. Prefers
    # worker nodes; CAPH's upstream control-plane toleration still allows
    # falling back to control-plane nodes when no worker is schedulable.
    deployment:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
  capz:
    # v1.26.0 (latest, Jun 2026) for AKS clusters : the classic managed API
    # (AzureManagedControlPlane), networkPlugin "none" (BYO CNI) and
    # asoManagedClusterPatches (the kube-proxy disable) are all verified
    # present at this release.
    version: v1.26.0
  kubeaid:
    repo: https://github.com/Obmondo/KubeAid.git
    # KubeAid git ref the postKubeadmCommands `git clone` checks out
    # on every control-plane node. Set to a release tag (e.g. "29.0.4")
    # to pin the in-node clone to the same version kubeaid-cli rendered
    # this chart against — otherwise the in-node clone takes master HEAD
    # and the manifests Cilium / CCM are installed from can drift from
    # the rendered chart. Empty leaves the clone unpinned (master).
    version: ""
  # kubeaid-storagectl is fetched at cloud-init by the Hetzner bare-metal
  # KubeadmConfig / KubeadmControlPlane templates. The binary is published
  # as a standalone release asset by kubeaid-cli's goreleaser config.
  # Set version to a release tag (e.g. "v0.22.5") to pin; leave empty to
  # use the "latest release" redirect.
  kubeaidStoragectl:
    version: ""
  pods:
    cidrBlock: 10.244.0.0/16
  # -- Extra OS users to create on every node during bootstrap.
  # Each entry expects:
  #   name           : login name to create.
  #   sshPublicKeys  : list of SSH public keys to authorize for the user.
  additionalUsers: []

provider:
  hetzner: false
  aws: false
  azure: false
