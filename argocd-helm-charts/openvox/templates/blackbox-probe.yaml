{{- if ((.Values).blackbox).probe }}
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: blackbox-probe-puppetserver
spec:
  interval: 30m
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:19115
  targets:
    staticConfig:
      static:
        - https://{{ (((((.Values).puppetserver).puppetserver).masters).fqdns).alternateServerNames }}/status/v1/services
      # `url` is the probed URL, the label the blackbox alerts and opsmondo identify a probe by.
      relabelingConfigs:
        - sourceLabels: [__param_target]
          targetLabel: url
  # Drop `instance` (prometheus-operator sets it to the probed URL too) so the URL only appears as `url`.
  metricRelabelings:
    - action: labeldrop
      regex: instance
{{- end}}
