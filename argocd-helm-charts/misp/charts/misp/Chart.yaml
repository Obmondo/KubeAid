apiVersion: v2
name: misp
description: A Helm chart for deploying the MISP Threat Sharing web application.
maintainers:
  - name: maheckathorn
    email: maheckathorn@sei.cmu.edu
  - name: sei-avesey
    email: avesey@sei.cmu.edu
  - name: sei-mtrdina
    email: mtrdina@sei.cmu.edu
  - name: sei-mfrank
    email: mfrank@sei.cmu.edu
type: application
version: 5.0.1
appVersion: "2.5.44"

# KubeAid: the upstream mariadb (Bitnami) and smtp dependencies are removed.
# The database comes from the mariadb-operator (see ../../templates/mariadb.yaml)
# and mail goes through the cluster relay. Only valkey is vendored.
dependencies:
  - name: valkey
    repository: "oci://ghcr.io/valkey-io/valkey-helm"
    version: "0.9.4"
    condition: valkey.enabled

keywords:
  - misp
  - threat-sharing
