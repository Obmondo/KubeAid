suite: azure ProviderConfig
templates:
  - providers/azure.yaml
release:
  name: crossplane
  namespace: crossplane
set:
  providers.azure.enabled: true
# The ProviderConfig is the last document of providers/azure.yaml, after the five Providers.
tests:
  - it: renders the default ProviderConfig reading the credentials Secret from the release namespace in sync wave 2
    documentSelector:
      path: kind
      value: ProviderConfig
    asserts:
      - isKind:
          of: ProviderConfig
      - isAPIVersion:
          of: azure.upbound.io/v1beta1
      - equal:
          path: metadata.name
          value: default
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "2"
            argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      - equal:
          path: spec.credentials.secretRef
          value:
            namespace: crossplane
            name: azure-credentials
            key: credentials

  - it: honours a custom Secret name and key
    documentSelector:
      path: kind
      value: ProviderConfig
    set:
      providers.azure.credentials:
        secretName: azure-sp
        secretKey: creds.json
    asserts:
      - equal:
          path: spec.credentials.secretRef.name
          value: azure-sp
      - equal:
          path: spec.credentials.secretRef.key
          value: creds.json
