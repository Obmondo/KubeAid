apiVersion: v2
name: crossplane
description: Crossplane core, the providers KubeAid supports with their provider configs, and the composite APIs KubeAid models on top of them
version: 2.0.0
dependencies:
  - name: crossplane
    version: "2.4.3"
    repository: https://charts.crossplane.io/stable
  - name: crossview
    version: 4.6.0
    repository: https://crossplane-contrib.github.io/crossview
    condition: crossview.enabled
  - name: compositions
    version: 1.0.0
    repository: file://charts/compositions
    condition: compositions.enabled
