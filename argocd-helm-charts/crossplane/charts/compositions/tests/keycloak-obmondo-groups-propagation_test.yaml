suite: keycloak obmondo groups propagation
templates:
  - keycloak/obmondo-keycloak-groups-propagation/composite-resource-definition.yaml
  - keycloak/obmondo-keycloak-groups-propagation/composition.yaml
release:
  name: compositions
  namespace: crossplane
set:
  keycloak.obmondoKeycloakGroupsPropagation.enabled: true
tests:
  - it: renders nothing when the propagation is switched off
    set:
      keycloak.obmondoKeycloakGroupsPropagation.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: keycloak/obmondo-keycloak-groups-propagation/composite-resource-definition.yaml
      - hasDocuments:
          count: 0
        template: keycloak/obmondo-keycloak-groups-propagation/composition.yaml

  - it: renders a namespaced Crossplane v2 XRD in sync wave 1
    template: keycloak/obmondo-keycloak-groups-propagation/composite-resource-definition.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CompositeResourceDefinition
      - isAPIVersion:
          of: apiextensions.crossplane.io/v2
      - equal:
          path: metadata.name
          value: obmondokeycloakgroupspropagations.keycloak.kubeaid.org
      - equal:
          path: spec.scope
          value: Namespaced
      - equal:
          path: spec.group
          value: keycloak.kubeaid.org
      - equal:
          path: spec.names.kind
          value: ObmondoKeycloakGroupsPropagation
      - equal:
          path: spec.enforcedCompositionRef.name
          value: obmondo-keycloak-groups-propagation
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.required
          value:
            - realm
            - issuerURL
            - credentialsSecret

  - it: renders the Composition in sync wave 2, patching static base manifests
    template: keycloak/obmondo-keycloak-groups-propagation/composition.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Composition
      - equal:
          path: metadata.name
          value: obmondo-keycloak-groups-propagation
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
      - equal:
          path: spec.compositeTypeRef
          value:
            apiVersion: keycloak.kubeaid.org/v1alpha1
            kind: ObmondoKeycloakGroupsPropagation
      - equal:
          path: spec.pipeline[0].functionRef.name
          value: patch-and-transform
      - equal:
          path: spec.pipeline[1].functionRef.name
          value: auto-ready
      - lengthEqual:
          path: spec.pipeline[0].input.resources
          count: 4
      - equal:
          path: spec.pipeline[0].input.resources[0].name
          value: identity-provider
      - equal:
          path: spec.pipeline[0].input.resources[1].name
          value: identity-provider-mapper
      - equal:
          path: spec.pipeline[0].input.resources[2].name
          value: client-scope
      - equal:
          path: spec.pipeline[0].input.resources[3].name
          value: client-scope-groups-mapper
      # keycloak-oidc, not oidc : the upstream is another Keycloak.
      - equal:
          path: spec.pipeline[0].input.resources[0].base.spec.forProvider.providerId
          value: keycloak-oidc
      - equal:
          path: spec.pipeline[0].input.resources[0].base.spec.forProvider.syncMode
          value: FORCE
      - equal:
          path: spec.pipeline[0].input.resources[1].base.spec.forProvider.identityProviderMapper
          value: oidc-user-attribute-idp-mapper
      - equal:
          path: spec.pipeline[0].input.resources[3].base.spec.forProvider.protocolMapper
          value: oidc-usermodel-attribute-mapper
