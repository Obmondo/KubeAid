{{- if .Values.keycloak.obmondoKeycloakGroupsPropagation.enabled }}

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: obmondo-keycloak-groups-propagation
  annotations:
    {{- include "compositions.wave3" . | nindent 4 }}

spec:
  compositeTypeRef:
    apiVersion: keycloak.kubeaid.org/v1alpha1
    kind: ObmondoKeycloakGroupsPropagation

  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources

        patchSets:
          - name: realm
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realm
                toFieldPath: spec.forProvider.realm

          - name: realmId
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realm
                toFieldPath: spec.forProvider.realmId

        resources:
          # Obmondo's Keycloak as an OIDC identity provider, with this Keycloak acting as the
          # identity broker.
          - name: identity-provider
            base:
              apiVersion: oidc.keycloak.m.crossplane.io/v1alpha1
              kind: IdentityProvider
              metadata:
                name: obmondo-keycloak
              spec:
                forProvider:
                  alias: Obmondo
                  displayName: Obmondo

                  # keycloak-oidc, not oidc : this is another Keycloak being added as an identity
                  # provider.
                  # REFER : https://www.keycloak.org/docs/latest/server_admin/index.html#configuring-a-keycloak-openid-connect-identity-provider.
                  providerId: keycloak-oidc

                  defaultScopes: openid

                  syncMode: FORCE

                  storeToken: true
                  trustEmail: true
                  validateSignature: true
                  loginHint: "true"

                  extraConfig:
                    clientAuthMethod: client_secret_post
                    useJwksUrl: "true"
                    isAccessTokenJWT: "true"
            patches:
              - type: PatchSet
                patchSetName: realm
              - type: FromCompositeFieldPath
                fromFieldPath: spec.credentialsSecret.name
                toFieldPath: spec.forProvider.clientIdSecretRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.credentialsSecret.clientIdKey
                toFieldPath: spec.forProvider.clientIdSecretRef.key
              - type: FromCompositeFieldPath
                fromFieldPath: spec.credentialsSecret.name
                toFieldPath: spec.forProvider.clientSecretSecretRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.credentialsSecret.clientSecretKey
                toFieldPath: spec.forProvider.clientSecretSecretRef.key
              - type: FromCompositeFieldPath
                fromFieldPath: spec.issuerURL
                toFieldPath: spec.forProvider.issuer
                transforms:
                  - type: string
                    string:
                      type: TrimSuffix
                      trim: "/"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.issuerURL
                toFieldPath: spec.forProvider.authorizationUrl
                transforms:
                  - type: string
                    string:
                      type: TrimSuffix
                      trim: "/"
                  - type: string
                    string:
                      type: Format
                      fmt: "%s/protocol/openid-connect/auth"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.issuerURL
                toFieldPath: spec.forProvider.tokenUrl
                transforms:
                  - type: string
                    string:
                      type: TrimSuffix
                      trim: "/"
                  - type: string
                    string:
                      type: Format
                      fmt: "%s/protocol/openid-connect/token"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.issuerURL
                toFieldPath: spec.forProvider.userInfoUrl
                transforms:
                  - type: string
                    string:
                      type: TrimSuffix
                      trim: "/"
                  - type: string
                    string:
                      type: Format
                      fmt: "%s/protocol/openid-connect/userinfo"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.issuerURL
                toFieldPath: spec.forProvider.logoutUrl
                transforms:
                  - type: string
                    string:
                      type: TrimSuffix
                      trim: "/"
                  - type: string
                    string:
                      type: Format
                      fmt: "%s/protocol/openid-connect/logout"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.issuerURL
                toFieldPath: spec.forProvider.jwksUrl
                transforms:
                  - type: string
                    string:
                      type: TrimSuffix
                      trim: "/"
                  - type: string
                    string:
                      type: Format
                      fmt: "%s/protocol/openid-connect/certs"

          - name: identity-provider-mapper
            base:
              apiVersion: identityprovider.keycloak.m.crossplane.io/v1alpha1
              kind: IdentityProviderMapper
              metadata:
                name: obmondo-keycloak-groups
              spec:
                forProvider:
                  identityProviderAlias: Obmondo
                  name: idp-groups
                  identityProviderMapper: oidc-user-attribute-idp-mapper
                  extraConfig:
                    claim: groups
                    user.attribute: idp-groups
                    syncMode: FORCE
            patches:
              - type: PatchSet
                patchSetName: realm

          - name: client-scope
            base:
              apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
              kind: ClientScope
              metadata:
                name: obmondo-keycloak-groups
              spec:
                forProvider:
                  name: obmondo-keycloak-groups
                  includeInTokenScope: true
                  consentScreenText: ""
            patches:
              - type: PatchSet
                patchSetName: realmId

          - name: client-scope-groups-mapper
            base:
              apiVersion: client.keycloak.m.crossplane.io/v1alpha1
              kind: ProtocolMapper
              metadata:
                name: obmondo-keycloak-groups
              spec:
                forProvider:
                  name: obmondo-keycloak-groups
                  clientScopeIdRef:
                    name: obmondo-keycloak-groups
                  protocol: openid-connect
                  protocolMapper: oidc-usermodel-attribute-mapper
                  config:
                    user.attribute: idp-groups
                    claim.name: groups
                    jsonType.label: String
                    multivalued: "true"
                    aggregate.attrs: "true"
                    id.token.claim: "true"
                    access.token.claim: "true"
                    userinfo.token.claim: "true"
                    introspection.token.claim: "true"
                    lightweight.claim: "false"
            patches:
              - type: PatchSet
                patchSetName: realmId
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.clientScopeIdRef.namespace

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: auto-ready
{{- end }}
