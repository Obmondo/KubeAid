{{- $checksums := fromYaml (include "checksums" .) }}
{{- $components := fromYaml (include "components" .) }}
{{- $configurations := fromYaml (include "configurations" .) }}
{{- if $components.storage.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.storage.name }}
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.storage.name "tier" .Values.global.namespaceTier) | nindent 4 }}
    kubescape.io/tier: "core"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.storage.name) | nindent 6 }}
  template:
    metadata:
      {{- $podAnnotations := include "kubescape-operator.annotations" (dict "Values" .Values) }}
      annotations:
        {{- with $podAnnotations }}{{- . | nindent 8 }}{{- end }}
        {{- with .Values.storage.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
        checksum/storage-config: {{ $checksums.storageConfig }}
        checksum/cloud-config: {{ $checksums.cloudConfig }}
      labels:
        {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.storage.name "tier" .Values.global.namespaceTier) | nindent 8 }}
        {{- with .Values.storage.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
        kubescape.io/tier: "core"
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- if kindIs "string" .Values.imagePullSecrets }}
      - name: {{ .Values.imagePullSecrets }}
      {{- else }}
      {{- range .Values.imagePullSecrets }}
      - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- end }}
      serviceAccountName: {{ .Values.storage.name }}
      {{- if .Values.storage.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- if and .Values.storage.mtls.enabled (eq (include "kubescape.certificates.strategy" .) "initContainer") }}
      {{- $certgenImage := printf "%s:%s" .Values.kubescapeOpsTool.image.repository (.Values.kubescapeOpsTool.image.tag | toString) }}
      {{- $certgenSecret := include "storage.certgen.secretName" . }}
      {{- $certgenHosts := printf "%s,%s" .Values.storage.name (include "storage.certgen.svcDomainName" .) }}
      initContainers:
        - name: certgen-create
          image: {{ $certgenImage }}
          imagePullPolicy: {{ .Values.kubescapeOpsTool.image.pullPolicy }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/usr/bin/kubescape-ops-tool", "certgen-create"]
          args:
            - --namespace
            - {{ .Values.ksNamespace }}
            - --secret-name
            - {{ $certgenSecret }}
            - --host
            - {{ $certgenHosts }}
            - --out-dir
            - /etc/storage-ca-certificates
            - --ca-name
            - ca.crt
            - --cert-name
            - tls.crt
            - --key-name
            - tls.key
          volumeMounts:
            - name: ca-certificates
              mountPath: /etc/storage-ca-certificates
            - name: tmp-dir
              mountPath: /tmp
        - name: certgen-patch
          image: {{ $certgenImage }}
          imagePullPolicy: {{ .Values.kubescapeOpsTool.image.pullPolicy }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/usr/bin/kubescape-ops-tool", "certgen-patch"]
          args:
            - --namespace
            - {{ .Values.ksNamespace }}
            - --secret-name
            - {{ $certgenSecret }}
            - --ca-name
            - ca.crt
            - --resource-type
            - apiservice
            - --resource-name
            - {{ include "storage.certgen.apiServiceName" . }}
            - --retries
            - {{ .Values.storage.mtls.certgen.retries | quote }}
            - --retry-interval
            - {{ .Values.storage.mtls.certgen.retryIntervalSeconds | quote }}
      {{- end }}
      containers:
      - name: apiserver
        image: "{{ .Values.storage.image.repository }}:{{ .Values.storage.image.tag }}"
        imagePullPolicy: {{ .Values.storage.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        livenessProbe:
          httpGet:
            path: /livez
            port: {{ .Values.storage.serverPort }}
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.storage.serverPort }}
            scheme: HTTPS
        {{- if or .Values.storage.containerProfileSqliteBackend .Values.storage.containerProfileMigrationDryRun }}
        startupProbe:
          httpGet:
            path: /livez
            port: {{ .Values.storage.serverPort }}
            scheme: HTTPS
          periodSeconds: {{ .Values.storage.containerProfileMigrationStartupProbe.periodSeconds }}
          failureThreshold: {{ .Values.storage.containerProfileMigrationStartupProbe.failureThreshold }}
        {{- end }}
        env:
          {{- if .Values.storage.resources.limits.memory }}
          - name: GOMEMLIMIT
            value: {{ include "kubescape-operator.gomemlimit" (dict "memory" .Values.storage.resources.limits.memory "percentage" .Values.storage.gomemlimitPercentage) | quote }}
          {{- end }}
          - name: KS_LOGGER_LEVEL
            value: "{{ .Values.logger.level }}"
          - name: KS_LOGGER_NAME
            value: "{{ .Values.logger.name }}"
        volumeMounts:
          - name: "data"
            mountPath: "/data"
          - name: tmp-dir
            mountPath: /tmp
          - name: {{ .Values.global.cloudConfig }}
            mountPath: /etc/config/clusterData.json
            readOnly: true
            subPath: "clusterData.json"
          - name: config
            mountPath: /etc/config/config.json
            readOnly: true
            subPath: "config.json"
          {{- if .Values.storage.mtls.enabled }}
          - name: "ca-certificates"
            mountPath: /etc/storage-ca-certificates
            readOnly: true
          {{- end }}
        resources:
{{ toYaml .Values.storage.resources | indent 12 }}
      nodeSelector:
      {{- if .Values.storage.nodeSelector }}
      {{- toYaml .Values.storage.nodeSelector | nindent 8 }}
      {{- else if .Values.customScheduling.nodeSelector }}
      {{- toYaml .Values.customScheduling.nodeSelector | nindent 8 }}
      {{- end }}
      affinity:
      {{- if .Values.storage.affinity }}
      {{- toYaml .Values.storage.affinity | nindent 8 }}
      {{- else if .Values.customScheduling.affinity }}
      {{- toYaml .Values.customScheduling.affinity | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.storage.tolerations }}
      {{- toYaml .Values.storage.tolerations | nindent 8 }}
      {{- else if .Values.customScheduling.tolerations }}
      {{- toYaml .Values.customScheduling.tolerations | nindent 8 }}
      {{- end }}
      {{- include "kubescape-operator.priorityClassName" (dict "component" .Values.storage "global" .Values.customScheduling) | nindent 6 }}
      volumes:
        - name: "data"
          {{- if eq .Values.configurations.persistence "enable" }}
          persistentVolumeClaim:
            claimName: kubescape-{{ .Values.storage.name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp-dir
          emptyDir: {}
        - name: {{ .Values.global.cloudConfig }}
          configMap:
            name: {{ .Values.global.cloudConfig }}
            items:
            - key: "clusterData"
              path: "clusterData.json"
        - name: config
          configMap:
            name: {{ .Values.storage.name }}
            items:
              - key: "config.json"
                path: "config.json"
        {{- if .Values.storage.mtls.enabled }}
        {{- if eq (include "kubescape.certificates.strategy" .) "initContainer" }}
        - name: "ca-certificates"
          emptyDir: {}
        {{- else }}
        - name: "ca-certificates"
          secret:
            secretName: {{ include "storage.certgen.secretName" . }}
        {{- end }}
        {{- end }}
{{- end }}
