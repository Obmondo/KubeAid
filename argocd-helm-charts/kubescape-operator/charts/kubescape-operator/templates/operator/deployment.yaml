{{- $checksums := fromYaml (include "checksums" .) }}
{{- $components := fromYaml (include "components" .) }}
{{- if $components.operator.enabled }}
{{- $no_proxy_envar_list := (include "no_proxy_envar_list" .) -}}
{{- $offline := eq .Values.capabilities.kubescapeOffline "enable" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name "tier" .Values.global.namespaceTier) | nindent 4 }}
    kubescape.io/tier: "core"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    rollingUpdate:
      maxSurge: 0%
      maxUnavailable: 100%
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 8 }}
        {{- with .Values.operator.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
        checksum/operator-config: {{ $checksums.operatorConfig }}
        checksum/cloud-secret: {{ $checksums.cloudSecret }}
        checksum/cloud-config: {{ $checksums.cloudConfig }}
        checksum/capabilities-config: {{ $checksums.capabilitiesConfig }}
        checksum/matching-rules-config: {{ $checksums.matchingRulesConfig }}
      {{- if ne .Values.global.proxySecretFile "" }}
        checksum/proxy-config: {{ $checksums.proxySecret }}
      {{- end }}
      labels:
        {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name "tier" .Values.global.namespaceTier) | nindent 8 }}
        {{- with .Values.operator.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
        kubescape.io/tier: "core"
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- if kindIs "string" .Values.imagePullSecrets }}
      - name: {{ .Values.imagePullSecrets }}
      {{- else }}
      {{- range .Values.imagePullSecrets }}
      - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- if and (eq .Values.capabilities.admissionController "enable") (eq (include "kubescape.certificates.strategy" .) "initContainer") }}
      {{- $admissionName := include "kubescape-admission.name" . }}
      {{- $admissionSecret := include "kubescape-admission.secretName" . }}
      {{- $admissionHosts := printf "%s,%s" $admissionName (include "kubescape-admission.svcDomainName" .) }}
      {{- $certgenImage := printf "%s:%s" .Values.kubescapeOpsTool.image.repository (.Values.kubescapeOpsTool.image.tag | toString) }}
      initContainers:
        - name: certgen-create
          image: {{ $certgenImage }}
          imagePullPolicy: {{ .Values.kubescapeOpsTool.image.pullPolicy }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/usr/bin/kubescape-ops-tool", "certgen-create"]
          args:
            - --namespace
            - {{ .Values.ksNamespace }}
            - --secret-name
            - {{ $admissionSecret }}
            - --host
            - {{ $admissionHosts }}
            - --out-dir
            - /etc/certs
            - --ca-name
            - ca.crt
            - --cert-name
            - tls.crt
            - --key-name
            - tls.key
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/certs
            - name: tmp-dir
              mountPath: /tmp
        - name: certgen-patch
          image: {{ $certgenImage }}
          imagePullPolicy: {{ .Values.kubescapeOpsTool.image.pullPolicy }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/usr/bin/kubescape-ops-tool", "certgen-patch"]
          args:
            - --namespace
            - {{ .Values.ksNamespace }}
            - --secret-name
            - {{ $admissionSecret }}
            - --ca-name
            - ca.crt
            - --resource-type
            - vwc
            - --resource-name
            - {{ $admissionName }}
            - --retries
            - {{ .Values.operator.admissionWebhooks.patch.retries | quote }}
            - --retry-interval
            - {{ .Values.operator.admissionWebhooks.patch.retryIntervalSeconds | quote }}
      {{- end }}
      containers:
        - name: {{ .Values.operator.name }}
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: "trigger-port"
              containerPort: 4002
              protocol: TCP
            - name: "readiness-port"
              containerPort: 8000
              protocol: TCP
            {{- if eq .Values.capabilities.admissionController "enable" }}
            - name: "admission-port"
              containerPort: 8443
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/liveness
              port: readiness-port
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /v1/readiness
              port: readiness-port
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
{{ toYaml .Values.operator.resources | indent 12 }}
          env:
            {{- include "apiauth.serverEnv" . | nindent 12 }}
            - name: KS_API_TOKEN_FILE
              value: {{ include "apiauth.tokenFile" . | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HELM_RELEASE
              value: kubescape-operator-{{ .Chart.Version | replace "+" "_" }}
            {{- if .Values.operator.resources.limits.memory }}
            - name: GOMEMLIMIT
              value: {{ include "kubescape-operator.gomemlimit" (dict "memory" .Values.operator.resources.limits.memory "percentage" .Values.operator.gomemlimitPercentage) | quote }}
            {{- end }}
            - name: KS_LOGGER_LEVEL
              value: "{{ .Values.logger.level }}"
            - name: KS_LOGGER_NAME
              value: "{{ .Values.logger.name }}"
            {{- if $offline }}
            - name: KS_SKIP_UPDATE_CHECK
              value: "true"
            {{- end }}
            {{- range .Values.operator.env }}
            {{- if not (and $offline (eq .name "KS_SKIP_UPDATE_CHECK")) }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
            {{- end }}
            {{- if ne .Values.global.httpsProxy "" }}
            - name: HTTPS_PROXY
              value: "{{ .Values.global.httpsProxy }}"
            - name : no_proxy
              value: "{{ $no_proxy_envar_list }}"
            {{- end }}
          volumeMounts:
            {{- include "apiauth.callerVolumeMount" . | nindent 12 }}
            - name: {{ $components.cloudSecret.name }}
              mountPath: /etc/credentials
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
            - name: {{ .Values.global.cloudConfig }}
              mountPath: /etc/config/clusterData.json
              readOnly: true
              subPath: "clusterData.json"
            - name: ks-capabilities
              mountPath: /etc/config/capabilities.json
              readOnly: true
              subPath: "capabilities.json"
            - name: {{ .Values.continuousScanning.configMapName }}
              mountPath: /etc/config/matchingRules.json
              readOnly: true
              subPath: "matchingRules.json"
            - name: config
              mountPath: /etc/config/config.json
              readOnly: true
              subPath: "config.json"
            {{- if and $components.nodeAgent.enabled .Values.nodeAgent.autoscaler.enabled }}
            - name: node-agent-template
              mountPath: /etc/templates
              readOnly: true
            {{- end }}
            {{- if .Values.global.overrideDefaultCaCertificates.enabled }}
            - name: custom-ca-certificates
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
            {{- end }}
            {{- if .Values.global.extraCaCertificates.enabled }}
            {{- range $key, $value := (lookup "v1" "Secret" .Values.ksNamespace .Values.global.extraCaCertificates.secretName).data }}
            - name: extra-ca-certificates
              mountPath: /etc/ssl/certs/{{ $key }}
              subPath: {{ $key }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.capabilities.admissionController "enable" }}
            - name: tls-certs
              mountPath: /etc/certs
              readOnly: true
            {{- end }}
{{- if .Values.volumeMounts }}
{{ toYaml .Values.volumeMounts | indent 12 }}
{{- end }}
{{- if .Values.operator.volumeMounts }}
{{ toYaml .Values.operator.volumeMounts | indent 12 }}
{{- end }}
{{- if ne .Values.global.proxySecretFile "" }}
            - name: proxy-secret
              mountPath: /etc/ssl/certs/proxy.crt
              subPath: proxy.crt
{{- end }}
      volumes:
        {{- include "apiauth.callerVolume" . | nindent 8 }}
        - name: {{ $components.cloudSecret.name }}
          secret:
            secretName: {{ $components.cloudSecret.name }}
        {{- if ne .Values.global.proxySecretFile "" }}
        - name: proxy-secret
          secret:
            secretName: {{ .Values.global.proxySecretName }}
        {{- end }}
        {{- if .Values.global.overrideDefaultCaCertificates.enabled }}
        - name: custom-ca-certificates
          secret:
            secretName: {{ $components.customCaCertificates.name }}
        {{- end }}
        {{- if .Values.global.extraCaCertificates.enabled }}
        - name: extra-ca-certificates
          secret:
            secretName: {{ .Values.global.extraCaCertificates.secretName }}
        {{- end }}
        {{- if eq .Values.capabilities.admissionController "enable" }}
        {{- if eq (include "kubescape.certificates.strategy" .) "initContainer" }}
        - name: tls-certs
          emptyDir: {}
        {{- else }}
        - name: tls-certs
          secret:
            secretName: {{ include "kubescape-admission.secretName" . }}
        {{- end }}
        {{- end }}
        - name: tmp-dir
          emptyDir: {}
        - name: {{ .Values.global.cloudConfig }}
          configMap:
            name: {{ .Values.global.cloudConfig }}
            items:
            - key: "clusterData"
              path: "clusterData.json"
        - name: ks-capabilities
          configMap:
            name: ks-capabilities
            items:
              - key: "capabilities"
                path: "capabilities.json"
        - name: config
          configMap:
            name: {{ .Values.operator.name }}
            items:
            - key: "config.json"
              path: "config.json"
        - name: {{ .Values.continuousScanning.configMapName }}
          configMap:
            name: {{ .Values.continuousScanning.configMapName }}
            items:
              - key: "matchingRules.json"
                path: "matchingRules.json"
        {{- if and $components.nodeAgent.enabled .Values.nodeAgent.autoscaler.enabled }}
        - name: node-agent-template
          configMap:
            name: node-agent-daemonset-template
        {{- end }}
{{- if .Values.volumes }}
{{ toYaml .Values.volumes | indent 8 }}
{{- end }}
{{- if .Values.operator.volumes }}
{{ toYaml .Values.operator.volumes | indent 8 }}
{{- end }}
      serviceAccountName: {{ .Values.operator.name }}
      automountServiceAccountToken: true
      nodeSelector:
      {{- if .Values.operator.nodeSelector }}
      {{- toYaml .Values.operator.nodeSelector | nindent 8 }}
      {{- else if .Values.customScheduling.nodeSelector }}
      {{- toYaml .Values.customScheduling.nodeSelector | nindent 8 }}
      {{- end }}
      affinity:
      {{- if .Values.operator.affinity }}
      {{- toYaml .Values.operator.affinity | nindent 8 }}
      {{- else if .Values.customScheduling.affinity }}
      {{- toYaml .Values.customScheduling.affinity | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.operator.tolerations }}
      {{- toYaml .Values.operator.tolerations | nindent 8 }}
      {{- else if .Values.customScheduling.tolerations }}
      {{- toYaml .Values.customScheduling.tolerations | nindent 8 }}
      {{- end }}
      {{- include "kubescape-operator.priorityClassName" (dict "component" .Values.operator "global" .Values.customScheduling) | nindent 6 }}
{{- end }}
