# Default values for the Kubescape operator chart

# -- Overrides the name of the helm chart
nameOverride: ""
# -- Overrides the full name of the helm chart
fullnameOverride: "kubescape"

# -----------------------------------------------------------------------------------------
# ------------------------------- Basic ---------------------------------------------------
# -----------------------------------------------------------------------------------------

# cluster name: cluster name must be defined by the user!
# --set clusterName=`kubectl config current-context`
clusterName: "cluster"

# Default posture frameworks used when a scan has no targetNames
# (empty scheduler scanV1, startup scan, exception-triggered rescan).
# Empty by default (opt-in) so upgrades do not narrow scheduled scans from "all".
# Explicit scanV1/API targetNames override this list.
# Clear with: --set defaultFrameworks=null
# Example (AKS CIS): --set 'defaultFrameworks={cis-aks-t1.2.0}'
# Example (allcontrols + current CIS): --set 'defaultFrameworks={allcontrols,cis-v1.10.0}'
# Note: when operator.triggerSecurityFramework is true (default), "security" is also scanned.
defaultFrameworks: []

# Omit these control IDs (or legacy CIS section numbers) from every operator scan.
# Per-request exclusions are added to this list; empty means scan every selected control.
excludeControls: []

# The namespace for running the chart
# If you wish to run the chart in a different namespace, make sure to update this value
ksNamespace: kubescape
ksLabel: kubescape

# Additional annotations and labels that should be applied to all resources
additionalAnnotations: {}
additionalLabels: {}

# Certificate handling for the admission webhook and storage mTLS endpoints.
# - `template`     : certs rendered at helm install/upgrade time via Sprig `genSignedCert`. Fastest install, but certs rotate on every `helm upgrade` unless the CA Secret is preserved.
# - `initContainer`: certs generated at runtime by init containers on the consuming pod. GitOps/ArgoCD-safe (no Helm hooks), idempotent across pod restarts, and the CA is reused from a Secret once created.
certificates:
  strategy: template

# Shared operational tooling image. Used by the certificate init containers, the
# grype-offline-db rollout CronJob and the Helm release upgrader CronJob.
kubescapeOpsTool:
  image:
    repository: quay.io/kubescape/kubescape-ops-tool
    tag: "0.2.0-r1"
    pullPolicy: IfNotPresent

# global logger name and level
# the logger level and name are mapped to environment variables in each component
logger:
  level: info
  name: zap

# Targeted scanning
# If you wish to exclude specific namespaces from scanning, provide the comma-separated list here
excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,kubeconfig,gmp-system,gmp-public"
# If you wish to scan only specific namespaces, provide the comma-separated list here (takes precedence over excludeNamespaces)
includeNamespaces: ""
# Live namespace filtering. Initial enablement requires a rollout; later edits
# to namespaceFilters.json do not. See docs/features/live-namespace-filters.md.
namespaceFilters:
  enabled: false
  # External ConfigMap in ksNamespace, containing namespaceFilters.json. Leave
  # empty to create kubescape-namespace-filters from the namespace lists above.
  existingConfigMap: ""
# If you wish to exclude workloads having specific labels from scanning, provide them here as a map
excludeLabels:
  # "app.kubernetes.io/component": ["kubescape"]

# Additional volumes applied to all containers
volumes: []

# Additional volumeMounts applied to all containers
volumeMounts: []

customScheduling:
  affinity:
    # Specify affinity rules here
  nodeSelector:
    # Define nodeSelector rules here
  tolerations:
    # Set tolerations for nodes here
  priorityClassName: ""

# -- reference to an exsiting image pull secret for private registry support.
# -- can be used in conjunction with `imagePullSecret` below to generate a secret with provided credentials
imagePullSecrets: ""

# -- (optional) generate image pull secret with the provided credentials. Secret name must be provided in the imagePullSecrets field
# -- must pass in server, username, and password for the secret to be generated
imagePullSecret:
  server: ""
  username: ""
  password: ""
  email: ""

# -----------------------------------------------------------------------------------------
# ----------------------------- Providers -------------------------------------------------
# -----------------------------------------------------------------------------------------

# Host and credentials for third-party providers
# Here you can find the list of providers -> https://kubescape.io/docs/providers/#compatible-providers
server:

# The chart will create a secret with the "account" and "accessKey", in case you have a pre-created secret, use "credentials.cloudSecret" instead
account:
accessKey:

# When left blank, the secret will be generated using the default name. Override this option if you already have a secret and wish to prevent Helm from creating the default secret on your behalf
credentials:
  cloudSecret:

# -----------------------------------------------------------------------------------------
# --------------------------- Capabilities ------------------------------------------------
# -----------------------------------------------------------------------------------------

capabilities:
  # ====== Base operator ======
  operator: enable

  # ====== configuration scanning related capabilities ======
  #
  # Default configuration scanning setup
  configurationScan: enable
  # Continuous Scanning continuously evaluates the security posture of your cluster.
  continuousScan: disable
  nodeScan: enable

  # ====== Image vulnerabilities scanning related capabilities ======
  #
  nodeSbomGeneration: enable # Warning: When disabled along with enableClusterWideSecretAccess: false, vulnerability scanning capabilities will be limited
  # Instruct Syft to also scan for SBOM files in the filesystem container
  scanEmbeddedSBOMs: disable
  vulnerabilityScan: enable
  relevancy: enable
  # Generate VEX documents alongside the image vulnerabilities report (experimental)
  vexGeneration: disable

  # ====== Runtime related capabilities ======
  #
  runtimeObservability: enable
  networkPolicyService: enable
  networkEventsStreaming: enable
  runtimeDetection: disable
  malwareDetection: disable
  nodeProfileService: enable
  admissionController: enable
  httpDetection: enable
  seccompProfileService: enable
  # Storage backend for SeccompProfile resources: "crd" (Kubernetes CRD) or "storage" (aggregated API)
  seccompProfileBackend: crd
  # Experimental: enforce SandboxPolicy privilege syscall rules with seccomp. Profiles
  # are injected through NRI (containerd >= 2.2) and apply when a container starts.
  # Requires the SandboxPolicy CRDs and a node-agent release that includes the seccomp
  # layer (kubescape/node-agent#1064); older node-agent images ignore the setting.
  sandboxSeccomp: disable
  manageWorkloads: disable
  syncSBOM: disable

  # ====== Agent runtime posture ======
  # Grants the scanner read-only access to the Sandbox, SandboxTemplate, and
  # WorkerPool CRDs currently covered by the scan contract. Tracking issue:
  # https://github.com/kubescape/kubescape/issues/2557
  # Keep disabled by default so existing installations do not gain extra RBAC or
  # change their scan selection. Enable it for clusters that use these resources.
  agentRuntimePosture: disable

  # ====== Risk acceptance ======
  riskAcceptance: disable

  # ====== Post-scan remediation ======
  #
  # Lets the operator perform reactive cluster operations on scan findings
  # (annotate, quarantine) when triggered via the Kubescape CLI or an
  # OperatorCommand. This is an opt-in capability with an elevated security
  # risk: enabling it grants the operator mutating RBAC. The default install
  # keeps the operator read-only.
  #
  # Enabling provisions the mutating RBAC the implemented actions use. Concretely it grants:
  #   - patch on apps workloads (deployments/statefulsets/daemonsets) and pods,
  #     which backs annotate;
  #   - create/delete/get/list/update on networkpolicies, which backs quarantine.
  # cordon (patch on nodes, which is cluster-wide) is granted when it lands in the operator.
  #
  # Read the design before enabling:
  # https://github.com/kubescape/designs-and-proposals/blob/main/proposals/cli-cluster-operations.md
  remediation: disable

  # ====== Other capabilities ======
  #
  # This is an experimental capability with an elevated security risk. Read the
  # matching docs before enabling.
  autoUpgrading: disable
  # Forces KS_SKIP_UPDATE_CHECK=true on the Operator to suppress daily reports.
  # Supported by the default image; overrides require v0.2.181 or later with operator#421.
  kubescapeOffline: disable
  prometheusExporter: disable
  # seccompGenerator: disable

  testing:
    nodeAgentMultiplication:
      enabled: false
      replicas: 5

serviceScanConfig:
  enabled: false
  interval: 1h

configurations:
  otelUrl: # default is empty
  persistence: enable

  # Enable Prometheus annotations, to allow open-source Prometheus (not operator) to scrape metrics
  prometheusAnnotations: disable

  priorityClass:
    enabled: true
    daemonset: 100000100 # PriorityClass value for the node-agent DaemonSet; higher than other components so it schedules on all nodes. Override the name via nodeAgent.priorityClassName.

  # List of json paths to exclude from the pod spec hash computation - used for aggregating CronJob generated CRDs
  excludeJsonPaths:
    # - ".containers[*].env[?(@.name==\"DD_INJECT_ID\")]"

# installation of the alertCRD chart
alertCRD:
  installDefault: false # install the default CRD
  scopeClustered: true # it is better to have the CRDs in the cluster scope
  scopeNamespaced: false # enable scopeNamespaced when there are no permissions for creating cluster scoped CRDs

# -----------------------------------------------------------------------------------------
# ------------------------ Cloud Providers ------------------------------------------------
# -----------------------------------------------------------------------------------------

# It is recommended to setup the cloud info when installing the chart on a managed cluster, this will enable to check the related settings
# cloud support
cloudProviderMetadata:
  # -- cloud region
  cloudRegion:

  # -- AWS IAM arn role
  awsIamRoleArn:

  # -- GKE service account
  gkeServiceAccount:

  # -- GKE project
  gkeProject:

  # -- AKS subscription ID
  aksSubscriptionID:

  # -- AKS resource group
  aksResourceGroup:

  # -- AKS client ID
  aksClientID:

  # -- AKS client secret
  aksClientSecret:

  # -- AKS tenant ID
  aksTenantID:

  # -- Azure Workload Identity client ID (user-assigned managed identity or
  # app registration) federated with the kubevuln ServiceAccount. Lets kubevuln
  # pull images from private Azure Container Registries without static credentials.
  #
  # Prerequisites:
  # - The Azure Workload Identity mutating webhook must be installed on the cluster.
  # - Requires a kubevuln image supporting ambient ACR authentication (introduced in
  #   kubescape/kubevuln#1163). The default chart image supports GCP, ECR, and Azure
  #   and ECR ambient providers; to use ambient ACR authentication, override
  #   `kubevuln.image.tag` with v0.3.545 or later, the first release that includes it.
  #
  # Ignored when awsIamRoleArn or gkeServiceAccount is set: those take precedence
  # on the kubevuln ServiceAccount, so neither the annotations nor the pod label render.
  #
  # Note: aksWorkloadIdentityClientID and aksWorkloadIdentityTenantID are public GUIDs
  # used for ServiceAccount annotations and pod labels; they are always configured inline
  # and are not read from nor overridden by cloudProviderMetadata.secretRef.
  aksWorkloadIdentityClientID:

  # -- Azure Workload Identity tenant ID (optional, defaults to the tenant
  # configured on the Azure Workload Identity webhook). Always read inline.
  aksWorkloadIdentityTenantID:

  # Provider Metadata can also be pulled from a kubernetes secret instead of
  # the values above. As soon as secretRef is non-empty the inline values are
  # ignored (except aksWorkloadIdentityClientID and aksWorkloadIdentityTenantID,
  # which are always read inline) and the metadata comes from the secret, so set
  # `name` plus only the *Key mappings the selected provider needs. Setting only
  # `name` renders no cloud metadata env vars at all.
  secretRef: {}
  #   name: kubescape-secret
  #   cloudRegionKey: cloudRegion
  #   gkeProjectKey: gkeProject
  #   subscriptionIdKey: aksSubscriptionID
  #   clientIdKey: aksClientID
  #   clientSecretKey: aksClientSecret
  #   tenantIdKey: aksTenantID
  #   resourceGroupKey: aksResourceGroup

# -----------------------------------------------------------------------------------------
# ------------------------- Configurations ------------------------------------------------
# -----------------------------------------------------------------------------------------

# Enable persistence using Persistent Volume Claims
persistence:
  # -- persistence storage class
  #    ref: https://kubernetes.io/docs/concepts/storage/storage-classes/
  #    note: set to "-" (dash) for default storage class
  storageClass: "-"

  # -- persistence access mode
  #    ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
  accessMode: ReadWriteOnce

  # -- persistence size
  size:
    backingStorage: 5Gi
    kubevuln: 5Gi

global:
  httpsProxy: ""
  noProxy: ""
  proxySecretFile: "" # file content (not file path), e.g. `global.proxySecretFile=(cat /path/to/file)`
  proxySecretName: kubescape-proxy-certificate
  enableClusterWideSecretAccess: true
  namespaceTier: ks-control-plane
  cloudConfig: ks-cloud-config
  proxySecretDirectory: proxy-support
  configMapsDirectory: configs
  kubescapePsp:
    name: ks-allow-privileged
    enabled: false
  # NetworkPolicies for the kubescape components.
  # NOTE: enabled by default. They only restrict INGRESS between our own components
  # (see docs/features/network-policies.md); traffic leaving the namespace is untouched unless
  # createEgressRules is set. On clusters whose CNI does not enforce NetworkPolicies they are no-ops.
  networkPolicy:
    # -- create ingress NetworkPolicies for the kubescape components
    enabled: true
    # -- also restrict egress (opt-in, see docs/features/network-policies.md for what each component may reach)
    createEgressRules: false
    # -- pin the kube-apiserver egress rule to this endpoint IP; empty allows the API server port(s) to any destination
    apiServerIP: ""
    # -- kube-apiserver port allowed by the egress rules; the ports of the `default/kubernetes` EndpointSlice are added when it can be looked up
    apiServerPort: 443
    # -- pin the HTTPS proxy egress rule to this IP (optional; destination left open if empty)
    httpsProxyIP: ""
    # -- HTTPS proxy port allowed by the egress rules (defaults to the port parsed from global.httpsProxy)
    httpsProxyPort: ""
  overrideRuntimePath: ""
  overrideDefaultCaCertificates:
    enabled: false
    caCertificates: ""
  extraCaCertificates:
    enabled: false
    secretName: ""
  openshift: # Openshift Security Context Constraint support
    scc:
      enabled: false
  # In-cluster API authentication: installs the RBAC, the projected caller
  # tokens for this audience and the server env so that kubescape, kubevuln,
  # synchronizer and the operator accept only callers presenting a
  # service-account token (TokenReview) authorized by RBAC
  # (SubjectAccessReview). Enforced by the images this chart pins (operator
  # v0.2.209, kubescape v4.0.20, kubevuln v0.3.578, synchronizer v0.0.175,
  # node-agent v0.3.310 and later). Set enabled: false to turn the check off
  # on every server. The chart also turns it off on its
  # own when nodeAgent.gke.allowlist is enabled with an allowlist that lacks
  # the token mount (nodeAgent.gke.allowlist.supportsApiToken: false).
  apiAuth:
    enabled: true
    audience: kubescape.io

# Image scanning configurations
imageScanning:
  # Provide credentials here when scanning images pulled from private container registries.
  # Note: When using imagePullSecrets this configuration is not necessary.
  #   ref: https://kubescape.io/docs/operator/vulnerabilities/#scanning-images-pulled-from-private-registries
  privateRegistries:
    credentials:
      # - registry: "<registry.example.com>"
      #   username: "<username/clientID>"
      #   password: "<password/clientSecret>"
      #   skipTlsVerify: false   # optional (skip TLS verification, default is false)
      #   insecure: false        # optional (use http instead of https, default is false)
      # Add more credentials as needed

# -----------------------------------------------------------------------------------------
# ----------------------- Microservices - core --------------------------------------------
# -----------------------------------------------------------------------------------------

# +++++++++++++++++++++++++++++++ Kubescape ++++++++++++++++++++++++++++++++++++++++++++++++

# kubescape scanner - https://github.com/kubescape/kubescape
kubescape:
  # GOMEMLIMIT as a fraction of resources.limits.memory. 0.8 = 80%.
  # Lower values give the runtime more headroom. Raise toward 1.0 only
  # if GC is too aggressive; lower it if GC is not aggressive enough.
  gomemlimitPercentage: 0.8
  name: kubescape

  image:
    # -- source code: https://github.com/kubescape/kubescape/tree/master/httphandler (public repo)
    repository: quay.io/kubescape/kubescape
    tag: v4.0.20
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 250m
      memory: 400Mi
    limits:
      cpu: 600m
      memory: 1Gi

  # -- download policies every scan, we recommend it should remain true, you should change to 'false' when running in an air-gapped environment or when scanning with high frequency (when running with Prometheus). When 'false', the policy library baked into the image is used, so the controls are those of the image tag and do not change until the image does
  downloadArtifacts: true

  # -- skip check for a newer version
  skipUpdateCheck: false

  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # deploy a service monitor for prometheus (operator) integration
  serviceMonitor:
    # -- enable/disable service monitor for prometheus (operator) integration
    enabled: false

    # -- Customize prometheus interval and scrapeTimeout
    interval: 200s
    scrapeTimeout: 150s

    # Whether to skip persisting the data after scanning
    skipPersistence: false

    # If needed the service monitor can be deployed to a different namespace than the one kubescape is in
    #namespace: my-namespace

    # Additional labels, e.g. setting a label for service monitor selector as set in prometheus
    additionalLabels: {}

  # Additional volumes to be mounted on Kubescape
  volumes: []

  # Additional volumeMounts to be mounted on Kubescape
  volumeMounts: []

# +++++++++++++++++++++++++++++++ Operator ++++++++++++++++++++++++++++++++++++++++++++++++

# Operator will trigger kubescape and kubevuln scanning
operator:
  # GOMEMLIMIT as a fraction of resources.limits.memory. 0.8 = 80%.
  # Lower values give the runtime more headroom. Raise toward 1.0 only
  # if GC is too aggressive; lower it if GC is not aggressive enough.
  gomemlimitPercentage: 0.8
  # operator Deployment name
  name: operator

  image:
    # -- source code: https://github.com/kubescape/operator
    repository: quay.io/kubescape/operator
    tag: v0.2.209
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  service:
    type: ClusterIP
    port: 4002
    targetPort: 4002
    protocol: TCP
    annotations: {}

  # DEPRECATED: use operator.admissionWebhooks.service.* instead.
  # If any key under admissionService is set, it takes precedence over the matching
  # key under admissionWebhooks.service for backward compatibility.
  # This block will be removed in a future release.
  admissionService: {}
  #   type: ClusterIP
  #   port: 443
  #   targetPort: 8443
  #   annotations: {}

  admissionWebhooks:
    service:
      type: ClusterIP
      port: 443
      targetPort: 8443
      annotations: {}
    patch:
      retries: 60
      retryIntervalSeconds: 5

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 300Mi
  env: {}

  podScanGuardTime: "1h"

  # Additional volumes to be mounted on the websocket
  volumes: []

  # Additional volumeMounts to be mounted on the websocket
  volumeMounts: []

  triggerSecurityFramework: true

  # -- periodically push the admission rules from the Rule CRDs to the
  # node-agents (operator rules updater). Interval is a Go duration string.
  # Disabled by default, matching the operator's own viper default.
  rulesUpdateConfig:
    enabled: false
    interval: 5m

# +++++++++++++++++++++++++++++++ Unittest ++++++++++++++++++++++++++++++++++++++++++++++++
unittest: false
# +++++++++++++++++++++++++++++++ Kubevuln ++++++++++++++++++++++++++++++++++++++++++++++++

# kubevuln - image vulnerability scanning microservice
kubevuln:
  # -- for enable:"<any-value>", for disable:"": the print of json posted to the Kubescape cloud from the vuln scanner
  verbose: ""

  # kubevuln Deployment name
  name: kubevuln

  # GOMEMLIMIT as a fraction of resources.limits.memory. 0.8 = 80%.
  # Lower values give the runtime more headroom. Raise toward 1.0 only
  # if GC is too aggressive; lower it if GC is not aggressive enough.
  gomemlimitPercentage: 0.8

  image:
    # -- source code: https://github.com/kubescape/kubevuln
    repository: quay.io/kubescape/kubevuln
    # Note: v0.3.571 and later support GCP, ECR, and Azure Workload Identity ambient ACR auth.
    tag: v0.3.578
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    protocol: TCP
    annotations: {}

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 300m
      memory: 1000Mi
      # Consider to increase ephemeral-storage requests in order to avoid pod eviction due to huge images
      #               https://github.com/kubescape/kubescape/issues/389
      ephemeral-storage: 5Gi
    limits:
      cpu: 1500m
      memory: 5000Mi
      ephemeral-storage: 10Gi
  config:
    maxImageSize: 5368709120 # set the maximum image size for scanning. This refers to the size of the zipped image. If the size of the non-zipped image is larger, increase the ephemeral-storage limits. It is recommended to use the same size as the requested ephemeral-storage
    maxSBOMSize: 20971520
    scanTimeout: 5m # set timeout for scanning an image
    grypeDbListingURL: "" # set the URL for the grype db listing, if empty the default URL will be used
    grypeDbPersistence: false # use a persistent volume for the grype db files
    useDefaultMatchers: false # Deprecated: use cveMatchingMode instead. Kept for backward compatibility (true -> "off", false -> "adaptive").
    # -- CVE matching mode: "off" (Grype defaults), "on" (CPE matching everywhere), or "adaptive" (CPE matching everywhere except trusted-vendor images, which rely on the vendor's authoritative feed). Empty derives the mode from useDefaultMatchers for backward compatibility (true -> "off", false -> "adaptive").
    cveMatchingMode: ""
    # -- Distro identifiers treated as trusted vendors in adaptive mode. Empty uses kubevuln's built-in default set (echo, chainguard, wolfi, minimos).
    trustedVendors: []
    storeFilteredSboms: false
    proxyRegistryMap: {} # map of source registry -> mirror registry; kubevuln rewrites image pull references accordingly (useful for air-gapped/offline registry mirrors)

  env:
    - name: CA_MAX_VULN_SCAN_ROUTINES # TODO update the kubevuln
      value: "1"

  # Additional volumes to be mounted on the vulnerability scanning microservice
  volumes: []

  # Additional volumeMounts to be mounted on the vulnerability scanning microservice
  volumeMounts: []

  tmpDirPersistence:
    enabled: false
    # -- with enabled, create the claim per pod as a generic ephemeral volume
    # (spec.volumes[].ephemeral): it is deleted together with the pod and does not
    # count against the ephemeral-storage limits. Each replacement pod gets a new
    # claim, so unlike a standalone PVC on a node-local storage class it does not
    # pin kubevuln to one node across restarts. Use a WaitForFirstConsumer class:
    # with Immediate binding a node-local volume is provisioned before scheduling
    # and the pod has to follow it to that node
    ephemeral: false
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    annotations: {}

  # -- Grype DB as a generic ephemeral volume (spec.volumes[].ephemeral) instead of an
  # emptyDir; takes precedence over config.grypeDbPersistence. The DB is re-downloaded
  # on every pod start; size it for the old and the new DB side by side during an update
  grypeDbEphemeral:
    enabled: false
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    annotations: {}

  # SBOM scanner sidecar — isolates Syft memory usage in a separate container
  sbomScanner:
    enabled: false
    command:
      - /usr/bin/sbom-scanner
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 5Gi

# +++++++++++++++++++++++++++++++ Storage ++++++++++++++++++++++++++++++++++++++++++++++++

# Values for the Kubescape Storage service that Kubescape uses for its internal
# purposes like storage
storage:
  # Values or the Aggregated APIServer
  name: "storage"
  enabled: true
  mtls:
    enabled: true
    certificateValidityInDays: 730 # NOTE: only in effect when certificates.strategy is "template"
    certgen:
      retries: 60
      retryIntervalSeconds: 5
  serverPort: 8443
  # -- Bind the storage APIServer to the host network. Required when using a custom CNI where the control plane cannot reach pod IPs
  hostNetwork: false
  service:
    type: ClusterIP
    annotations: {}

  # -- source code: https://github.com/kubescape/storage
  image:
    # -- source code: https://github.com/kubescape/storage
    repository: quay.io/kubescape/storage
    tag: v0.0.382
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  # cleanup interval is a duration string
  cleanupInterval: "6h"

  # -- read-only MCP endpoint for AI agents, served as the mcpservers/mcp subresource behind kube-apiserver
  # authentication and RBAC (designs-and-proposals storage-mcp-endpoint.md)
  mcp:
    # -- serve the MCP endpoint; off by default
    enabled: false
    # -- with `enabled`, create the `kubescape-mcp-reader` and `kubescape-mcp-runtime-reader` ClusterRoles to bind to agents
    readerClusterRoles: true

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 400Mi
    limits:
      cpu: 1500m
      memory: 1500Mi

  disableVirtualCRDs: false # set to true or false to override auto-detection

  # -- single-dedicated-writer and SQLite pool tuning
  singleWriterEnabled: true
  poolTimeout: "15s"
  sqliteBusyTimeout: "60s"
  # -- Serve ContainerProfiles from storage's SQLite-native backend (payload and metadata in one transaction). Requires `singleWriterEnabled`. Every storage start migrates existing profiles before serving; run `containerProfileMigrationDryRun` once first. See [the storage doc](https://github.com/kubescape/storage/blob/main/docs/features/containerprofile-sqlite-backend.md)
  containerProfileSqliteBackend: false
  # -- At storage start, log what the ContainerProfile migration to the SQLite backend would do, without writing anything. Cannot be combined with `containerProfileSqliteBackend`
  containerProfileMigrationDryRun: false
  # -- With `containerProfileSqliteBackend` or `containerProfileMigrationDryRun` on, storage runs the migration before it serves `/livez`. This startup probe gives it up to `periodSeconds` x `failureThreshold` seconds (10 minutes by default) before the liveness probe can restart it
  containerProfileMigrationStartupProbe:
    periodSeconds: 10
    failureThreshold: 60

  # -- queue manager configuration
  queueManagerEnabled: true # set to false to disable the queue manager, this will disable the queue manager for all kinds
  defaultQueueLength: 100
  defaultWorkerCount: 2
  defaultMaxObjectSize: 400000 # in bytes, this is the maximum size of an object that can be stored in the storage service
  maxContainerProfileSize: 40000 # item count, matches storage viper default
  # GOMEMLIMIT as a fraction of resources.limits.memory. 0.8 = 80%.
  # Lower values give the runtime more headroom. Raise toward 1.0 only
  # if GC is too aggressive; lower it if GC is not aggressive enough.
  gomemlimitPercentage: 0.8
  kindQueues:
    # -- set the queues for the different kinds, the default is to use the default queue length and worker count
    applicationprofiles:
      queueLength: 50
      workerCount: 2
      maxObjectSize: 20000000
    containerprofiles:
      queueLength: 50
      workerCount: 2
      maxObjectSize: 2500000
    networkneighborhoods:
      queueLength: 50
      workerCount: 2
      maxObjectSize: 10000000
    openvulnerabilityexchangecontainers:
      queueLength: 50
      workerCount: 1
      maxObjectSize: 500000
    sbomsyftfiltereds:
      queueLength: 50
      workerCount: 1
      maxObjectSize: 50000000
    sbomsyfts:
      queueLength: 50
      workerCount: 1
      maxObjectSize: 100000000
    vulnerabilitymanifests:
      queueLength: 50
      workerCount: 1
      maxObjectSize: 50000000

# +++++++++++++++++++++++++++++ Node-agent ++++++++++++++++++++++++++++++++++++++++++++++++

nodeAgent:
  name: node-agent
  # GOMEMLIMIT as a fraction of resources.limits.memory. 0.8 = 80%.
  # Lower values give the runtime more headroom. Raise toward 1.0 only
  # if GC is too aggressive; lower it if GC is not aggressive enough.
  gomemlimitPercentage: 0.8
  image:
    # -- source code: https://github.com/kubescape/node-agent
    repository: quay.io/kubescape/node-agent
    tag: v0.3.310
    pullPolicy: IfNotPresent

  # -- Experimental SecCheck container/start observations on prepared self-managed Linux nodes.
  # Requires a node-agent image containing node-agent#1069; v0.3.308 predates it.
  # See docs/features/gvisor-start-source.md before enabling.
  gVisorStart:
    enabled: false
    # Pre-created root-owned 0700 host directory. Never created by the chart.
    socketDirectory: /run/kubescape/gvisor
    # Empty reuses node-agent's detected CRI endpoint and existing runtime mounts.
    runtimeEndpoint: ""
    runtimeHandler: runsc

  config:
    maxLearningPeriod: 24h # duration string
    maxTsProfileSize: 2097152 # bytes, matches node-agent viper default (2 MiB)
    learningPeriod: 2m # duration string
    updatePeriod: 10m # duration string
    nodeProfileInterval: 10m # duration string
    networkStreamingInterval: 2m # duration string
    # -- Enable the in-process OpenTelemetry Prometheus metrics exporter on node-agent port 8080 (/metrics).
    # NOTE: Enabling this replaces any OTLP metric push configured by configurations.otelUrl with the
    # Prometheus reader (OTLP traces and logs are unaffected).
    # To scrape these metrics, also enable nodeAgent.serviceMonitor.enabled or configure Prometheus scraping.
    # Note: This is distinct from capabilities.prometheusExporter, which deploys a separate Prometheus exporter.
    prometheusExporter: disable
    httpExporterConfig:
      url: http://synchronizer:8089/apis/v1/kubescape.io
      # projected service-account token sent as a bearer token to the synchronizer (see global.apiAuth)
      tokenFile: /var/run/secrets/kubescape.io/api-token/token
      maxAlertsPerMinute: 1000
      method: POST
    alertManagerExporterUrls: []
    stdoutExporter: true
    syslogExporterURL: ""
    skipKernelVersionCheck: false
    malwareScanAllFiles: false
    ruleCooldown:
      ruleCooldownDuration: 1h # duration string
      ruleCooldownAfterCount: 1
      ruleCooldownOnProfileFailure: true
      ruleCooldownMaxSize: 20000
    alertDeduplication:
      bypass: false # DAST / security-testing only: disables ALL sensor-side dedup/cooldown
    # -- Generic passthrough merged flat into config.json's top level. Intended
    # for downstream/private chart consumers that need node-agent config fields
    # this public chart intentionally does not expose by name. Note: a field set
    # here can also affect other rendered output beyond config.json -- e.g.
    # backendStorageEnabled additionally drives scan-gating in the
    # "capabilities.gates" template helper (_common.tpl) -- so check _common.tpl
    # before assuming a new extra.* key has no side effects elsewhere.
    # callstackPipelineEnabled: true also raises the operator's node-agent autoscaler floor
    # (nodeAgent.autoscaler.minResources defaults) in operator/configmap.yaml.
    extra: {}
    # Host sensor configuration. One elected agent cleans stale host data at this
    # interval; see templates/node-agent-crds/README.md for cleanup and RBAC details.
    hostSensor:
      enabled: true
      interval: 5m # duration string
    # Advanced/debug options for force-disabling individual node-agent tracers.
    tracers:
      capSys: enable
      dns: enable
      exec: enable
      exit: enable
      fork: enable
      hardlink: enable
      http: enable
      iouring: enable
      network: enable
      open: enable
      ptrace: enable
      randomx: enable
      seccomp: enable
      ssh: enable
      symlink: enable
      kmod: enable
      unshare: enable
      bpf: enable
      top: enable

  # GKE Autopilot allowlist
  gke:
    allowlist:
      # When enabled, the node-agent is labeled to match `name`, AND the chart installs an
      # AllowlistSynchronizer that pulls that allowlist from Google's managed repo into the cluster.
      enabled: false
      name: armo-kubescape-node-agent-1.40-v2
      # Whether `name` includes the node-agent's projected API token volume (global.apiAuth).
      # Allowlists before 1.43 do not. While this is false and the allowlist is enabled, the chart
      # renders the node-agent without the token mount and sets KS_API_AUTH_DISABLED on the
      # servers, so upgrades keep their node-agent instead of being rejected by GKE Warden.
      # Flip to true together with `name` once the 1.43 allowlist is rolled out.
      supportsApiToken: false
      # AllowlistSynchronizer path. Leave empty to derive it from `name`
      # (ARMO/<name-without-version-suffix>/*); set explicitly to override.
      path: ""

  # prometheus (operator) service monitor
  serviceMonitor:
    # -- enable/disable service monitor for prometheus
    enabled: false

    # -- Customize prometheus interval and scrapeTimeout
    interval: 30s
    scrapeTimeout: 15s

    # Additional labels, e.g. setting a label for service monitor selector as set in prometheus
    additionalLabels: {}

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 180Mi
    limits:
      cpu: 500m
      memory: 1400Mi

  env:
    - name: NodeName
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  privileged: false
  seLinuxType: spc_t

  volumeMounts:
    - mountPath: /host
      name: host
      readOnly: true
    - mountPath: /var/lib/kubelet
      name: kubeletdir
    - mountPath: /run
      name: run
      # readOnly: false # Must be writable for the node-agent to open container runtime socket for writing
    - mountPath: /var
      name: var
      readOnly: true
    - mountPath: /lib/modules
      name: modules
      readOnly: true
    - mountPath: /sys/kernel/debug
      name: debugfs
      # readOnly: false # Must be writable for the node-agent to load eBPF programs
    - mountPath: /sys/fs/cgroup
      name: cgroup
      readOnly: true
    - mountPath: /sys/fs/bpf
      name: bpffs
      # readOnly: false # Must be writable for the node-agent to load eBPF programs
    - mountPath: /data
      name: data
      # readOnly: false # EmptyDir volume
    - mountPath: /profiles
      name: profiles
      # readOnly: false # EmptyDir volume
    - mountPath: /boot
      name: boot
      readOnly: true
  volumes:
    - hostPath:
        path: /
      name: host
    - hostPath:
        path: /var/lib/kubelet
      name: kubeletdir
    - hostPath:
        path: /run
      name: run
    - hostPath:
        path: /var
      name: var
    - hostPath:
        path: /sys/fs/cgroup
      name: cgroup
    - hostPath:
        path: /lib/modules
      name: modules
    - hostPath:
        path: /sys/fs/bpf
      name: bpffs
    - hostPath:
        path: /sys/kernel/debug
      name: debugfs
    - hostPath:
        path: /boot
      name: boot
    - emptyDir:
      name: data
    - emptyDir:
      name: profiles
    - hostPath:
        path: /
        type: Directory
      name: host-filesystem

  # Note: when the autoscaler is enabled, this affinity is honoured for normal
  # (instance-type) node groups, but the synthetic "default" group of nodes
  # missing the grouping label is targeted with an operator-managed
  # "DoesNotExist" node affinity instead, so this value does not apply to it.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux

  nodeSelector:
    kubernetes.io/os: linux

  startupJitterContainer:
    enabled: false
    maxStartupJitter: 60
    image:
      repository: busybox
      tag: latest

  multipleDaemonSets:
    enabled: false # set to true to enable multiple DaemonSets for the node-agent, with different configurations.
    configurations:
    # - nodeSelector:
    #     kubernetes.io/os: linux
    #   resources:
    #     requests:
    #       cpu: 100m
    #       memory: 180Mi
    #     limits:
    #       cpu: 500m
    #       memory: 1400Mi
    #
    # uncomment when enabled and add more configurations as needed

  # Node agent autoscaler - dynamically creates and sizes DaemonSets based on node groups
  autoscaler:
    # -- enable/disable autoscaler mode
    enabled: false
    # -- node label used to group nodes (each unique value creates a separate DaemonSet)
    nodeGroupLabel: "node.kubernetes.io/instance-type"
    # -- resource percentages relative to node allocatable resources
    # Fractional percentages are supported; for example, requestMemory: 0.5 requests 0.5% of node allocatable memory, subject to minResources.
    resourcePercentages:
      requestCPU: 2      # % of node allocatable CPU for requests
      requestMemory: 2   # % of node allocatable memory for requests
      limitCPU: 5        # % of node allocatable CPU for limits
      limitMemory: 5     # % of node allocatable memory for limits
    # -- minimum resources regardless of node size
    minResources:
      cpu: 100m
      # Note: when `capabilities.nodeSbomGeneration` is enabled, this minimum memory will be bumped to 600Mi (unless changed)
      # Note: when `nodeAgent.config.extra.callstackPipelineEnabled` is true, the chart defaults (100m and 180Mi) are raised to 200m and 768Mi; any other value is used as is
      memory: 180Mi
    # -- maximum resources regardless of node size
    maxResources:
      cpu: 2000m
      memory: 4Gi
    # -- interval for reconciliation loop
    reconcileInterval: 5m
    # -- auto-detect AWS Bottlerocket nodes and set seLinuxType: super_t on their rendered DaemonSets
    bottlerocketAutoDetect: true

  priorityClassName: ""

  # SBOM scanner sidecar — runs Syft in a separate container for memory isolation
  sbomScanner:
    enabled: false
    name: sbom-scanner
    image:
      # Same image as node-agent — shared pull, different entrypoint
      repository: quay.io/kubescape/node-agent
      tag: ""
      pullPolicy: IfNotPresent
    command: ["/usr/bin/sbom-scanner"]
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 4Gi
    volumeMounts:
      - mountPath: /sbom-comm
        name: sbom-comm
      - mountPath: /host
        name: host
        readOnly: true
      # Syft's Java cataloger needs writable temp space to process JAR archives
      - mountPath: /tmp
        name: sbom-scanner-tmp
    volumes:
      - name: sbom-comm
        emptyDir:
          medium: Memory
          sizeLimit: 10Mi
      - name: sbom-scanner-tmp
        emptyDir: {}

# +++++++++++++++++++++++++++++ Synchronizer ++++++++++++++++++++++++++++++++++++++++++++++++

synchronizer:
  # GOMEMLIMIT as a fraction of resources.limits.memory. 0.8 = 80%.
  # Lower values give the runtime more headroom. Raise toward 1.0 only
  # if GC is too aggressive; lower it if GC is not aggressive enough.
  gomemlimitPercentage: 0.8
  name: synchronizer
  image:
    # -- source code: https://github.com/kubescape/synchronizer
    repository: quay.io/kubescape/synchronizer
    tag: v0.0.175
    pullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 250Mi
    limits:
      cpu: 200m
      memory: 500Mi
  service:
    type: ClusterIP
    port: 8089
    targetPort: 8089
    protocol: TCP
    annotations: {}

# -----------------------------------------------------------------------------------------
# ------------------------ Microservice - helpers -----------------------------------------
# -----------------------------------------------------------------------------------------

# +++++++++++++++++++++++++++++ GrypeOfflineDB ++++++++++++++++++++++++++++++++++++++++++++++++

grypeOfflineDB:
  enabled: false

  name: grype-offline-db

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  # -- Cron schedule for the grype-offline-db rollout CronJob
  schedule: "5 0 * * *"

  image:
    repository: quay.io/kubescape/grype-offline-db
    tag: "" # use v6-latest for weekly updates, it will overwrite the sha if specified
    sha: sha256:56468cbe92622770860f5c2f96b43aca836f6466c1c95116a107d461f8de8592
    pullPolicy: Always

  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 150m
      memory: 200Mi
    limits:
      cpu: 150m
      memory: 200Mi

  rollout:
    nodeSelector:
      kubernetes.io/os: linux
    podAnnotations: {}
    podLabels: {}
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        cpu: 100m
        memory: 50Mi

# +++++++++++++++++++++++++++++ Prometheus exporter ++++++++++++++++++++++++++++++++++++++++++++++++

# Prometheus exporter
prometheusExporter:
  # GOMEMLIMIT as a fraction of resources.limits.memory. 0.8 = 80%.
  # Lower values give the runtime more headroom. Raise toward 1.0 only
  # if GC is too aggressive; lower it if GC is not aggressive enough.
  gomemlimitPercentage: 0.8
  name: "prometheus-exporter"
  image:
    repository: quay.io/kubescape/prometheus-exporter
    tag: v0.2.27
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 10m
      memory: 10Mi
    limits:
      cpu: 50m
      memory: 100Mi

  service:
    port: 8080
    targetPort: 8080
    protocol: TCP

  serviceMonitor:
    # -- enable/disable service monitor for prometheus-exporter integration
    enabled: false

  enableWorkloadMetrics: false

  # Additional volumes to be mounted on the prometheus exporter
  volumes: []

  # Additional volumeMounts to be mounted on the prometheus exporter
  volumeMounts: []

# +++++++++++++++++++++++++++++ Upgrader ++++++++++++++++++++++++++++++++++++++++++++++++

# Configures the Helm Release Upgrader
helmReleaseUpgrader:
  name: "helm-release-upgrader"

  # Target of the `helm upgrade` performed by the CronJob. The namespace is not
  # configurable here: it is always `.Values.ksNamespace`.
  upgrade:
    release: kubescape
    # Local repository alias registered before the upgrade
    chartRepo: kubescape
    # Repository index URL the chart is resolved from
    chartRepoURL: https://kubescape.github.io/helm-charts
    chartName: kubescape-operator

  nodeSelector:
    kubernetes.io/os: linux
  affinity:
  tolerations:
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}

  # A cron schedule of how often the updating CronJob should run
  schedule: "0 14 * * *"

  # Resource requests and limits for the CronJob
  resources:
    # Requests and Limits are the same to make the CronJob Burstable
    requests:
      # Setting a higher CPU request helps with the Job runtime. If you don't
      # care about job execution speed and want to save on resources, feel free
      # to lower this
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 500m
      # Keep the memory limit sufficiently high.
      #
      # The updating CronJob runs an image that runs `helm upgrade`. It renders
      # the chart and that can require a lot of memory. If you don't want your
      # updating job to be OOM Killed, keep this at 256 MiB or higher depending
      # on the size of your cluster.
      memory: 256Mi

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

# -----------------------------------------------------------------------------------------
# --------------------------- Schedulers --------------------------------------------------
# -----------------------------------------------------------------------------------------

# kubescape scheduled scan using a CronJob
kubescapeScheduler:
  # scan scheduler container name
  name: kubescape-scheduler
  # Determines what to scan. With an empty scanV1, the operator uses defaultFrameworks
  # from clusterData. Set scanV1.targetNames to override those install-time defaults.
  # Further details: https://github.com/kubescape/operator?tab=readme-ov-file#trigger-kubescape-scanning
  requestBody:
    commands:
      - CommandName: "kubescapeScan"
        args:
          # Override defaultFrameworks for this CronJob only:
          # scanV1: {"targetType": "framework", "targetNames": [ "nsa" ] }
          scanV1: {}

    # -- Frequency of running the scan
    #     ┌───────────── minute (0 - 59)
    #     │ ┌───────────── hour (0 - 23)
    #     │ │ ┌───────────── day of the month (1 - 31)
    #     │ │ │ ┌───────────── month (1 - 12)
    #     │ │ │ │ ┌───────────── day of the week (0 - 6) (Sunday to Saturday;
    #     │ │ │ │ │                         7 is also Sunday on some systems)
    #     │ │ │ │ │
    #     │ │ │ │ │
  #     * * * * *
  # -- scan schedule frequency
  scanSchedule: "0 8 * * *"
  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  # Additional volumes to be mounted on the scan scheduler
  volumes: []

  # Additional volumeMounts to be mounted on the scan scheduler
  volumeMounts: []

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

kubevulnScheduler:
  ## scan scheduler container name
  name:
    kubevuln-scheduler

    # -- Frequency of running the scan
    #     ┌───────────── minute (0 - 59)
    #     │ ┌───────────── hour (0 - 23)
    #     │ │ ┌───────────── day of the month (1 - 31)
    #     │ │ │ ┌───────────── month (1 - 12)
    #     │ │ │ │ ┌───────────── day of the week (0 - 6) (Sunday to Saturday;
    #     │ │ │ │ │                         7 is also Sunday on some systems)
    #     │ │ │ │ │
    #     │ │ │ │ │
  #     * * * * *
  scanSchedule: "0 0 * * *"
  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  # Additional volumes to be mounted on the vuln scan scheduler
  volumes: []

  # Additional volumeMounts to be mounted on the vuln scan scheduler
  volumeMounts: []

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

# registry scan scheduled scan using a CronJob
registryScanScheduler:
  # scan scheduler container name
  name:
    registry-scheduler

    # -- Frequency of running the scan
    #     ┌───────────── minute (0 - 59)
    #     │ ┌───────────── hour (0 - 23)
    #     │ │ ┌───────────── day of the month (1 - 31)
    #     │ │ │ ┌───────────── month (1 - 12)
    #     │ │ │ │ ┌───────────── day of the week (0 - 6) (Sunday to Saturday;
    #     │ │ │ │ │                         7 is also Sunday on some systems)
    #     │ │ │ │ │
    #     │ │ │ │ │
  #     * * * * *
  # -- scan schedule frequency
  scanSchedule: "0 0 * * *"
  nodeSelector:
    kubernetes.io/os: linux

  # Additional volumes to be mounted on the scan scheduler
  volumes: []

  # Additional volumeMounts to be mounted on the scan scheduler
  volumeMounts: []

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

# -----------------------------------------------------------------------------------------
# ------------------------- Configurations ------------------------------------------------
# -----------------------------------------------------------------------------------------

# Continuous scanning configurations
continuousScanning:
  configMapName: cs-matching-rules

  # Matching rules for the monitored resources.
  # Kubescape will watch resources of every provided GVR across the provided
  # namespaces.
  matchingRules:
    match:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
    namespaces:
      - default
