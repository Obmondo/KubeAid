apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ox-common.names.fullname" . }}
  labels:
    {{- include "ox-common.labels.standard" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ox-common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      annotations: {{ toYaml .Values.podAnnotations | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "ox-common.labels.podLabels" . | nindent 8 }}
    spec: {{ include "ox-common.pods.podSpec" (dict "podRoot" .Values "global" $ "context" . ) | nindent 6 }}
      {{- if .Values.serviceAccount }}
      serviceAccountName: {{ include "core-cacheservice.serviceAccountName" . }}
      {{- end }}
      {{- if .Values.cacheService.mysql.auth.rootPassword }}
      initContainers:
        - name: init-mysql-database
          image: mysql:9.7
          {{- include "ox-common.containers.securityContext" (dict "podRoot" .Values "context" . "global" $) | nindent 10 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: MYSQL_HOST
              value: {{ (include "ox-common.mysql.host" (dict "mysql" .Values.cacheService.mysql "context" . "global" $)) | quote }}
            - name: MYSQL_PORT
              value: {{ (include "ox-common.mysql.port" (dict "mysql" .Values.cacheService.mysql "context" . "global" $)) | quote }}
            - name: MYSQL_DATABASE
              value: {{ (include "ox-common.mysql.database" (dict "mysql" .Values.cacheService.mysql "context" . "global" $)) | quote }}
            - name: MYSQL_USER
              value: {{ .Values.cacheService.mysql.auth.user | quote }}
            - name: MYSQL_PASSWORD
              value: {{ .Values.cacheService.mysql.auth.password | quote }}
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.cacheService.mysql.auth.rootPassword | quote }}
          command:
            - sh
            - -c
            - |
              set -euo pipefail

              # Wait for MySQL/MariaDB server to be ready
              until mysqladmin ping --host="${MYSQL_HOST}" --port="${MYSQL_PORT}" --user="${MYSQL_USER}" --password="${MYSQL_PASSWORD}" --silent; do
                echo "Waiting for MySQL/MariaDB server to be ready..."
                sleep 1
              done

              # create empty CacheService database schema if it does not exist yet and DB server root password is given;
              # if root password is not given the admin needs to create the shema by herself before service is able to run
              if [ -n "${MYSQL_ROOT_PASSWORD}" ]; then
                echo "MySQL/MariaDB server is up. Checking or creating CacheService database schema ${MYSQL_DATABASE}..."

                # Check if database exists before creating to avoid race conditions in multiple init containers
                DB_EXISTS=$(mysql --host="${MYSQL_HOST}" --port="${MYSQL_PORT}" --user=root --password="${MYSQL_ROOT_PASSWORD}" -N -e \
                  "SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='${MYSQL_DATABASE}';")

                if [ -z "$DB_EXISTS" ]; then
                  mysql --host="${MYSQL_HOST}" --port="${MYSQL_PORT}" --user=root --password="${MYSQL_ROOT_PASSWORD}" -N -e \
                    "CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\` DEFAULT CHARACTER SET utf8mb4 DEFAULT COLLATE utf8mb4_unicode_ci;"

                  echo "Database '${MYSQL_DATABASE}' created successfully."
                else
                  echo "Database '${MYSQL_DATABASE}' already exists."
                fi
              fi
      {{- end }}
      containers:
        - name: main
          {{- include "ox-common.containers.securityContext" (dict "podRoot" .Values "context" . "global" $) | nindent 10 }}
          image: {{ include "ox-common.images.image" (dict "imageRoot" .Values.image "global" $ "context" . ) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --spring.profiles.active=prod
            - --spring.config.additional-location=file:/opt/open-xchange/etc/cacheservice.properties
            - --spring.config.import=optional:configtree:/opt/open-xchange/etc/secrets/
            - --logging.config=/opt/open-xchange/etc/logback.xml
          env:
            - name: CS_JVM_HEAP_SIZE_MB
              value: {{ (.Values.cacheService).jvmHeapSizeMB | default "768" | quote }}
            - name: RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- $javaOpts := list
                "-Duser.timezone=UTC"
                "-Dliquibase.secureParsing=false"
                "-XX:+UseG1GC"
                "-XX:MaxGCPauseMillis=200"
                "-XX:+AlwaysPreTouch"
                "-Xms$(CS_JVM_HEAP_SIZE_MB)m"
                "-Xmx$(CS_JVM_HEAP_SIZE_MB)m"
                "-XshowSettings:vm"
            }}
            {{- if .Values.remoteDebug.enabled }}
            {{- $javaOpts = append $javaOpts (printf "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:%v" (.Values.remoteDebug.port | default 8101)) }}
            {{- end }}
            {{- if (.Values.cacheService).javaOptions }}
            {{- $javaOpts = concat $javaOpts .Values.cacheService.javaOptions }}
            {{- end }}
            - name: JDK_JAVA_OPTIONS
              value: {{ join " " $javaOpts | quote }}
            {{- if .Values.env }}
              {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
            - name: httplive
              containerPort: 8000
              protocol: TCP
            {{- if .Values.remoteDebug.enabled }}
            - name: httpdebug
              containerPort: {{ .Values.remoteDebug.port | default 8101 }}
              protocol: TCP
            {{- end }}
          {{- if .Values.probe.startup.enabled }}
          startupProbe:
            httpGet:
              path: /health/liveness
              port: httplive
            {{- omit .Values.probe.startup "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.probe.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: httplive
            {{- omit .Values.probe.liveness "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.probe.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: httplive
            {{- omit .Values.probe.readiness "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: cacheservice-config
              mountPath: /opt/open-xchange/etc/cacheservice.properties
              subPath: cacheservice.properties
            - name: cacheservice-config
              mountPath: /opt/open-xchange/etc/logback.xml
              subPath: logback.xml
            {{- if .Values.existingPropertiesSecret }}
            - name: cacheservice-secrets-config
              mountPath: /opt/open-xchange/etc/secrets
              readOnly: true
            {{- end }}
            - name: cacheservice-log
              mountPath: {{ .Values.logging.logDir }}
            - name: cacheservice-spool
              mountPath: /var/spool/open-xchange
            - name: tmp
              mountPath: /tmp
          {{- if .Values.persistence.enabled }}
            - name: cacheservice-fileitem
              mountPath: {{ ternary .Values.persistence.fileItemStore.path "/var/spool/open-xchange/cacheservice" (and .Values.persistence.enabled (not (empty .Values.persistence.fileItemStore.path))) }}
          {{- end }}
      volumes:
        - name: cacheservice-config
          configMap:
            name: {{ include "core-cacheservice.configmap" . }}
            items:
              - key: cacheservice.properties
                path: cacheservice.properties
              - key: logback.xml
                path: logback.xml
        {{- if .Values.existingPropertiesSecret }}
        - name: cacheservice-secrets-config
          secret:
            secretName: {{ .Values.existingPropertiesSecret }}
        {{- end }}
        - name: cacheservice-log
          emptyDir: {}
        - name: cacheservice-spool
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: cacheservice-fileitem
        {{- if not (empty .Values.persistence.existingClaim) }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else }}
          {{- if .Values.persistence.fileItemStore.hostPath }}
          hostPath:
            path: {{ .Values.persistence.fileItemStore.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ template "core-cacheservice.fileItemStore" . }}
          {{- end }}
        {{- end }}
        {{- end }}
