# Default values for core-cacheservice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  extras:
    monitoring:
      enabled: false

replicaCount: 1

defaultRegistry: registry.open-xchange.com

image:
  repository: "core-cacheservice"
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

## ServiceAccount to run the service pods with. Only needed to associate the pods with an AWS IAM
## role, which in turn is only needed when an S3 object store below is configured with
## credentialsSource "iam". While left unset, the pods keep using the namespace default
## ServiceAccount and no ServiceAccount is created by this chart.
# serviceAccount:
#   ## Whether this chart should create the ServiceAccount. Set to false to reference an
#   ## already existing one by name instead.
#   create: true
#   ## Name of the ServiceAccount, defaults to the fullname of the release.
#   name: ""
#   ## Annotations to associate the ServiceAccount with an AWS IAM role, e.g. for EKS IRSA.
#   annotations: {}
#     # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/core-cacheservice

podAnnotations:
  logging.open-xchange.com/format: "appsuite-json"

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
    - ALL
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

service:
  type: ClusterIP
  port: 8001
  portLiveness: 8000

resources:
  requests:
    cpu: 250m
    memory: 1024Mi
  limits:
    cpu: 4000m
    memory: 2048Mi

nodeSelector: {}

tolerations: []

affinity: {}

probe:
  liveness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 15

  readiness:
    enabled: true
    periodSeconds: 5
    failureThreshold: 2
    timeoutSeconds: 5

  startup:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5

# existingPropertiesSecret: ""

basicAuth:
  user: ""
  password: ""

remoteDebug:
  enabled: false
  port: 8101

cacheService:
  mysql:
    host: ""
    port: 3306
    database: "cacheservicedb"
    auth:
      user: ""
      password: ""
      rootPassword: ""
    connectionPool:
      connectTimeoutMilliseconds: 2000
      maxLifetimeMilliseconds: 600000
      idleTimeoutMilliseconds: 300000
      maxPoolSize: 20
      minPoolIdleSize: 5
    properties:
      - name: useUnicode
        value: true
      - name: characterEncoding
        value: UTF-8
      - name: autoReconnect
        value: false
      - name: useServerPrepStmts
        value: true
      - name: useTimezone
        value: true
      - name: serverTimezone
        value: UTC
      - name: connectTimeout
        value: 10000
      - name: socketTimeout
        value: 300000
      - name: prepStmtCacheSize
        value: 250
      - name: prepStmtCacheSqlLimit
        value: 4096
      - name: cachePrepStmts
        value: true
      - name: useSSL
        value: false
      - name: requireSSL
        value: false
      - name: verifyServerCertificate
        value: false
      - name: enabledTLSProtocols
        value: TLSv1,TLSv1.1,TLSv1.2,TLSv1.3
      - name: clientCertificateKeyStoreUrl
        value:
      - name: clientCertificateKeyStorePassword
        value:
      - name: clientCertificateKeyStoreType
        value:
      - name: trustCertificateKeyStoreUrl
        value:
      - name: trustCertificateKeyStorePassword
        value:
      - name: trustCertificateKeyStoreType
        value:
  s3ObjectStores: []
    # - id: 1
    #   endpoint: ""
    #   region: "eu-central-1"
    #   bucketName: "cacheservice"
    #   credentialsSource: "standard"  # "standard" or "iam"; accessKey/secretKey are not needed for "iam"
    #   accessKey: ""
    #   secretKey: ""
    #   pathStyleAccess: "auto"  # "auto", "true" (always path style) or "false" (always virtual host style)
    #   trace: false
  sproxydObjectStores: []
    # - id: 1
    #   endpoint: ""
    #   path: "proxyd/cacheservice"
  fileStores: []
    # - id: 1
    #   path: "/var/spool/open-xchange/cacheservice"
  cacheDefaults:
    maxEntries: 100000
    maxSizeMegaBytes: -1
    maxLifetimeSeconds: 2592000
    cleanupPeriodSeconds: 300
    minCleanupRuntimeSeconds: 0
  maxParallelRequests: 50
  cleanupBatchSize: 1000
  jvmHeapSizeMB: 768
  # -- Extra JVM flags appended to JDK_JAVA_OPTIONS (e.g. GC tuning), on top of the remote-debug agent flag when enabled.
  javaOptions: []

logging:
  debug: true
  logDir: /var/log/open-xchange/cacheservice
  logFile: cacheservice.log
  maxFileSize: 2MB
  maxTotalFileSize: 50GB
  maxIndex: 20
  queueSize: 2048
  root:
    level: INFO
    json: true
    syslog: false
    logstash: false
    file: false
  json:
    prettyPrint: false
  syslog:
    host: localhost
    port: 514
    facility: USER
  logstash:
    host: elk.open-xchange.com
    port: 31337
  logger:
    - name: org.apache.cxf
      level: WARN
    - name: com.openexchange.soap.cxf.logger
      level: WARN
    - name: com.openexchange.cacheservice
      level: INFO

persistence:
  enabled: false
  existingClaim: ""
  ## core-cacheservice data Persistent Volume Storage Class
  ## If defined, storageClass: <storageClassName>.
  ## If set to "-", storageClassName: "", which disables dynamic provisioning.
  ## If undefined or set to null, no storageClassName spec is
  ## set, choosing the default(gp2 on AWS, standard on GKE, AWS & OpenStack).
  ## accessMode can be overridden for entry fileItemStore.
  storageClass: null
  accessMode: ReadWriteOnce
  fileItemStore:
    ## if volumeName is set, use this existing PersistentVolume
    #volumeName:
    ## Provide proper class for existing volume
    #storageClass: "-"
    ## Provide matching accessMode for volume
    #accessMode: "ReadWriteMany"
    matchLabels: {}
    matchExpressions: []
    #hostPath: "/var/opt/cacheservice"
    path: "/var/spool/open-xchange/cacheservice"
    size: "10Gi"

extras:
  monitoring:
    # -- Whether monitoring resources should be created, e.g. a `ConfigMap` containing the Grafana dashboards.
    enabled: false
