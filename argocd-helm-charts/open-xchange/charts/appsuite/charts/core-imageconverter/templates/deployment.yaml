apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ox-common.names.fullname" . }}
  labels:
    {{- include "ox-common.labels.standard" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ox-common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      annotations: {{ toYaml .Values.podAnnotations | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "ox-common.labels.podLabels" . | nindent 8 }}
    spec: {{ include "ox-common.pods.podSpec" (dict "podRoot" .Values "global" $ "context" . ) | nindent 6 }}
      containers:
        - name: main
          {{- include "ox-common.containers.securityContext" (dict "podRoot" .Values "context" . "global" $) | nindent 10 }}
          image: {{ include "ox-common.images.image" (dict "imageRoot" .Values.image "global" $ "context" . ) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --spring.profiles.active=prod
            - --spring.config.additional-location=file:/opt/open-xchange/etc/imageconverter.properties
            - --logging.config=/opt/open-xchange/etc/logback.xml
          env:
            {{- if .Values.logging.root.json }}
            - name: CONSOLELOG
              value: "/dev/tty"
            {{- end }}
            - name: IC_JVM_HEAP_SIZE_MB
              value: {{ (.Values.imageconverter).jvmHeapSizeMB | default "1024" | quote }}
            - name: RELEASE_NAMESPACE
              value: {{ .Release.Name | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                    fieldPath: status.podIP
            {{- $javaOpts := list
                "-Duser.timezone=UTC"
                "-XshowSettings:vm"
                "-Xms$(IC_JVM_HEAP_SIZE_MB)m"
                "-Xmx$(IC_JVM_HEAP_SIZE_MB)m"
            }}
            {{- if .Values.remoteDebug.enabled }}
            {{- $javaOpts = append $javaOpts (printf "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:%v" (.Values.remoteDebug.port | default 8105)) }}
            {{- end }}
            - name: JDK_JAVA_OPTIONS
              value: {{ join " " $javaOpts | quote }}
            {{- if .Values.env }}
              {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
            - name: http-live
              containerPort: 8018
              protocol: TCP
            {{- if .Values.remoteDebug.enabled }}
            - name: debug
              containerPort: {{ .Values.remoteDebug.port | default 8105 }}
              protocol: TCP
            {{- end }}
          {{- if .Values.probe.startup.enabled }}
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http-live
            {{- omit .Values.probe.startup "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.probe.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http-live
            {{- omit .Values.probe.liveness "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.probe.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /imageconverter
              port: http
            {{- omit .Values.probe.readiness "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: imageconverter-config
              mountPath: /opt/open-xchange/etc/imageconverter.properties
              subPath: imageconverter.properties
            - name: imageconverter-config
              mountPath: /opt/open-xchange/etc/logback.xml
              subPath: logback.xml
            - name: imageconverter-logs
              mountPath: {{ .Values.logging.logDir }}
            - name: imageconverter-spool
              mountPath: /var/spool/open-xchange
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: imageconverter-config
          configMap:
            name: {{ include "core-imageconverter.configmap" . }}
            items:
              - key: imageconverter.properties
                path: imageconverter.properties
              - key: logback.xml
                path: logback.xml
        - name: imageconverter-logs
          emptyDir: {}
        - name: imageconverter-spool
          emptyDir: {}
        - name: tmp
          emptyDir: {}
