{{- if .Values.mysql.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Rotate name per migration.jobId (fallback .Release.Revision) so each
  # meaningful redeploy creates a new Job; Job.spec.template is immutable.
  {{- $ident := .Values.migration.jobId | default (.Release.Revision | toString) }}
  {{- $suffix := $ident | toString | sha256sum | trunc 8 }}
  name: {{ printf "%s-migrate-%s" (include "ox-common.names.fullname" .) $suffix | trunc 63 | trimSuffix "-" }}
  labels:
  {{- include "ox-common.labels.standard" . | nindent 4 }}
  {{- /* migration.annotations lets Argo CD callers mark the Job as a Sync hook
         (see values.yaml); podAnnotations are kept for backwards compatibility. */}}
  {{- with merge (dict) (.Values.migration.annotations | default dict) (.Values.podAnnotations | default dict) }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* Omitted when null so callers can opt out of Kubernetes TTL cleanup. */}}
  {{- if not (kindIs "invalid" .Values.migration.ttlSecondsAfterFinished) }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec: {{ include "ox-common.pods.podSpec" (dict "podRoot" .Values "global" $ "context" . ) | nindent 6 }}
      containers:
        - name: main
          {{- include "ox-common.containers.securityContext" (dict "podRoot" .Values "context" . "global" $) | nindent 10 }}
          image: {{ include "ox-common.images.image" (dict "imageRoot" .Values.image "global" $ "context" . ) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/node", "src/migrate.js", "--db", "switchboard", "up"]
          env:
            - name: DATABASES
              value: "switchboard"
            - name: DB_SWITCHBOARD_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchboard.mysqlSecret" . }}
                  key: MYSQL_DATABASE
            - name: DB_SWITCHBOARD_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchboard.mysqlSecret" . }}
                  key: MYSQL_HOST
            - name: DB_SWITCHBOARD_PORT
              value: {{ .Values.mysql.port | quote }}
            - name: DB_SWITCHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchboard.mysqlSecret" . }}
                  key: MYSQL_PASSWORD
            - name: DB_SWITCHBOARD_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "switchboard.mysqlSecret" . }}
                  key: MYSQL_USER
            {{- if .Values.mysql.tls.enabled }}
            - name: DB_SWITCHBOARD_SSL
              value: "true"
            - name: DB_SWITCHBOARD_SSL_REJECT_UNAUTHORIZED
              value: {{ .Values.mysql.tls.rejectUnauthorized | quote }}
            - name: DB_SWITCHBOARD_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.tls.caSecretName | default (include "switchboard.mysqlSecret" .) }}
                  key: {{ .Values.mysql.tls.caSecretKey | default "MYSQL_SSL_CA" }}
                  optional: true
            {{- end }}
      restartPolicy: OnFailure
{{- end -}}
