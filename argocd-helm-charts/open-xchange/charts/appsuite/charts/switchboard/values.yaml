global:
  extras:
    monitoring:
      enabled: false

extras:
  monitoring:
    enabled: false

replicaCount: 1

defaultRegistry: registry.open-xchange.com

bindAddr: "::"
containerPort: 8080

image:
  repository: appsuite-core-internal/switchboard
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations:
  logging.open-xchange.com/format: "appsuite-json"

podSecurityContext: {}

defaultPodSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

securityContext: {}

defaultSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Run the pods under a dedicated ServiceAccount rather than the namespace default
# one (CIS 5.1.5), and mount no API token (CIS 5.1.6). Switchboard makes no
# Kubernetes API calls, so it needs neither a token nor any RBAC. Set the
# top-level serviceAccountName to use an account you manage yourself; that
# suppresses the one created here.
serviceAccount:
  create: true
  # defaults to the chart fullname
  name: ""
  annotations: {}
  # ServiceAccount-level default, for any pod that does not state its own
  automountServiceAccountToken: false

# Pod-level token automount, which wins over the ServiceAccount-level setting
# above. Leave false unless a workload of this chart needs the Kubernetes API.
automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 80

istio:
  enabled: false
  hostname: ""
  gateway: "istio-system/default-gateway"

resources:
  # We recommend to always specify resources after actually measuring the values under
  # production-like circumstances.
  limits:
    cpu: 1
    memory: 196Mi
  requests:
    cpu: 300m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# PodDisruptionBudget for the switchboard pods. Opt-in, because a PDB only
# constrains voluntary evictions such as node drains and cluster autoscaler
# consolidation: it does not govern rolling updates, autoscaling scale-down or
# node failures. Needs at least two replicas to protect anything. Same values
# contract as the core-mw chart, so one umbrella values file configures both the
# same way.
#
# Evicting a switchboard pod always drops the websockets it holds; clients
# reconnect through the Redis adapter (no sticky sessions). The budget therefore
# staggers evictions so clients land on a surviving pod instead of reconnecting
# into an empty backend.
pdb:
  # Whether a PodDisruptionBudget should be created
  create: false
  # Minimum number or percentage of pods that must be available. Mutually
  # exclusive with maxUnavailable. Examples: 1, "50%"
  minAvailable: ""
  # Maximum number or percentage of pods that can be unavailable. Mutually
  # exclusive with minAvailable. Usually the better choice: it stays correct when
  # replicaCount or the autoscaling range changes, and on a single replica it
  # degrades to "always evictable" instead of blocking node drains forever.
  # Examples: 1, "25%"
  maxUnavailable: ""
  # Policy for evicting unhealthy (not yet Ready) pods, rendered as
  # `spec.unhealthyPodEvictionPolicy` (GA since Kubernetes 1.31). Leave empty to
  # omit. "AlwaysAllow" stops an unhealthy pod blocking a node drain
  # indefinitely and only ever permits more eviction, never less.
  # Examples: "IfHealthyBudget", "AlwaysAllow"
  unhealthyPodEvictionPolicy: ""

probe:
  liveness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 15

  readiness:
    enabled: true
    initialDelaySeconds: 1
    periodSeconds: 5
    failureThreshold: 2
    timeoutSeconds: 5

origins: "*"
logLevel: "info"
logJson: false

# Time in seconds a user's presence keys (lastSeen, availability,
# availabilityVisibility) live in Redis after the last write. Every presence
# update renews the TTL, so active users are never dropped. Lower it on
# environments that create disposable users so the keyspace stays bounded.
# Default matches the application default of 30 days.
presence:
  ttlSeconds: 2592000

appsuite:
  apiSecret: ""
  webhookSecret: ""
  signatureSecret: ""

redis:
  hosts: []
  prefix: "switchboard"
  mode: "standalone"
  sentinelMasterId: "mymaster"
  db: 0
  tls:
    enabled: false
    ca: ""
  auth:
    enabled: false
    username: "default"
    password: ""

overrides:
  appsuiteSecret: ""
  zoomSecret: ""
  jwtSecret: ""
  redisSecret: ""

appsuiteSecret:
  enabled: true
jwtSecret:
  enabled: false

# Proxy settings to be used for outgoing requests (e.g. web push)
httpProxy: ""

jwt:
  sharedSecret: ""
  tokenExpiration: "1h"
  serviceCapabilities: "ai,calendar,contacts,infostore,jitsi,openai,switchboard,webmail,zoom"
  algorithm: "RS256"

oidc:
  issuer: ""

jwks:
  enabled: false
  secretName: ""

mysql:
  enabled: false
  existingSecret: ""
  host: ""
  port: 3306
  database: ""
  connections: 10
  auth:
    user: ""
    password: ""
  tls:
    enabled: false
    ca: ""
    rejectUnauthorized: true
    caSecretName: ""
    caSecretKey: ""

cron:
  cleanupDb: "0 0 * * *"
  sidecarInjection:
    disabled: true

migration:
  # Rotation token for the migrate Job name suffix; falls back to .Release.Revision.
  jobId: ""
  # Seconds to keep the finished Job before Kubernetes deletes it; null omits the field.
  ttlSecondsAfterFinished: 60
  # Extra annotations on the Job (metadata, not the Pod). Under Argo CD auto-sync a
  # plain Job loops: the TTL deletes it, self-heal sees it missing and recreates it,
  # and the migration re-runs every backoff interval. Argo callers should make it a
  # hook instead, so it is excluded from sync status and rotated on every sync:
  #   argocd.argoproj.io/hook: Sync
  #   argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  annotations: {}

vapid:
  enabled: false
  existingSecret: ""
  publicKey: ""
  privateKey: ""
  subject: ""
