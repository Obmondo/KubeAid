{{- if and .Values.extraCaCerts.certificates (not .Values.extraCaCerts.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.extraCa.secretName" . | quote }}
  labels:
    {{- include "ox-common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.extraCaCerts.key | default "ca.crt" }}: |
{{ .Values.extraCaCerts.certificates | indent 4 }}
{{- end }}
