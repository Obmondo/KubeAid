{{- if and .Values.freeBusy.user .Values.freeBusy.password }}
# Chart-owned Secret carrying the inline free/busy credentials — the
# middleware's com.openexchange.rest.services.basic-auth.login / .password,
# which the service reads as FREEBUSY_USER/FREEBUSY_PASS. Named distinctly from
# any externally managed Secret so it can never fight an operator/ESO-managed
# one over ownership; for managed credentials leave freeBusy.user/password
# empty and point freeBusy.existingSecret at that Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.freeBusy.secretName" . }}
  labels:
    {{- include "ox-common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  login: {{ .Values.freeBusy.user | quote }}
  password: {{ .Values.freeBusy.password | quote }}
{{- end }}
