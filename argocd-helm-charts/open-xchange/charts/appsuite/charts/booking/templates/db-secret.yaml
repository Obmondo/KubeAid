{{- if .Values.database.password }}
# Chart-owned Secret carrying the inline database.password. Named distinctly
# from the default existingSecret (booking-db) so it can never fight an
# operator/ESO-managed Secret over ownership. For managed credentials leave
# database.password empty and point database.existingSecret at that Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.database.secretName" . }}
  labels:
    {{- include "ox-common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.password | quote }}
{{- end }}
