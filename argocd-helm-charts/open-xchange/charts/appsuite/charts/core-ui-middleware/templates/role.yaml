{{- if .Values.k8sAutoDiscovery.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ox-common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ox-common.labels.standard" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "get"]
{{- end }}
