apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cnpg-drill.name" . }}
spec:
  schedule: {{ .Values.schedule | quote }}
  suspend: {{ .Values.suspended }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ add .Values.timeoutSeconds 180 }}
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "cnpg-drill.name" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            {{- if .Values.reports.enabled }}
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            {{- end }}
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drill
              image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - run
                - --config
                - /etc/cnpg-drill/drill.json
                {{- if .Values.reports.enabled }}
                - --report
                - /reports/$(POD_NAME).json
                {{- end }}
              env:
                - name: HOME
                  value: /tmp
                {{- if .Values.reports.enabled }}
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /etc/cnpg-drill
                  readOnly: true
                - name: temp
                  mountPath: /tmp
                {{- if .Values.reports.enabled }}
                - name: reports
                  mountPath: /reports
                {{- end }}
          volumes:
            - name: config
              configMap:
                name: {{ include "cnpg-drill.name" . }}
            - name: temp
              emptyDir: {}
            {{- if .Values.reports.enabled }}
            - name: reports
              persistentVolumeClaim:
                claimName: {{ if .Values.reports.existingClaim }}{{ .Values.reports.existingClaim }}{{ else }}{{ include "cnpg-drill.name" . }}-reports{{ end }}
            {{- end }}
