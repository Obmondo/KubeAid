apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cnpg-drill.name" . }}
data:
  drill.json: |
    {{- $config := dict "namespace" .Release.Namespace "cluster" .Values.cluster "timeoutSeconds" .Values.timeoutSeconds "pollSeconds" .Values.pollSeconds "maxBackupAgeSeconds" .Values.maxBackupAgeSeconds "checks" .Values.checks "retainOnFailure" .Values.retainOnFailure -}}
    {{- if .Values.targetTime -}}
    {{- $_ := set $config "targetTime" .Values.targetTime -}}
    {{- end -}}
    {{- if .Values.recoveryObjectStore -}}
    {{- $_ := set $config "recoveryObjectStore" .Values.recoveryObjectStore -}}
    {{- end -}}
    {{- $_ := set $config "drillClusterName" (include "cnpg-drill.clusterName" .) -}}
    {{- if .Values.recoveryServiceAccountAnnotations -}}
    {{- $_ := set $config "recoveryServiceAccountAnnotations" .Values.recoveryServiceAccountAnnotations -}}
    {{- end -}}
    {{- $config | toJson | nindent 4 }}
