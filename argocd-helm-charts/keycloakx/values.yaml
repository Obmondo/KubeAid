keycloakx:
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "--verbose"
    - "start"
    - "--http-enabled=true"
    - "--http-port=8080"
    - "--hostname-strict=false"
    - "--spi-events-listener-jboss-logging-success-level=info"
    - "--spi-events-listener-jboss-logging-error-level=warn"
  proxy:
    mode: xforwarded
  database:
    vendor: postgres
    hostname: keycloak-pgsql-rw
    port: 5432
    database: keycloak
  extraEnv: |
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: keycloak-pgsql-app
          key: username
    - name: KC_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-pgsql-app
          key: password
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin
          key: KEYCLOAK_PASSWORD
    - name: JAVA_OPTS_APPEND
      value: >-
        -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless

  resources:
    requests:
      cpu: 500m
      memory: 300Mi
    limits:
      memory: 1000Mi

  dbchecker:
    enabled: true

global:
  netpol:
    enabled: false
    releaseName: ""
    traefik:
      namespace: ""
      labels: {}

  keycloakx:
    netpol: false

  blackbox:
    netpol: false
    namespace: ""
    probe: true

  postgresql:
    enabled: true

    instanceName: keycloak
    instances: 2

    database: keycloak
    owner: keycloak

    resources:
      requests:
        cpu: 100m
        memory: 500Mi
      limits:
        memory: 800Mi

    size: 4Gi

    # CloudNativePG (CNPG) currently doesn't support in-place recovery of a cluster.
    #
    # This means : suppose a cluster initially was using
    # s3://blackwoodseven-cnpg-poc/keycloakx/keycloak-pgsql to store its backups. While recovering
    # the cluster, you'll recover from that path, but you cannot write any further backups of the
    # recovered cluster to that path.
    #
    # That's why, to keep the cluster name same, we initially change the path to
    # s3://blackwoodseven-cnpg-poc/keycloakx/keycloak-pgsql/revision-0. And everytime you recover
    # the cluster, you increment that revision number, and the S3 path will change.
    revision: 0

    monitoring:
      enablePodMonitor: true

    recover:
      enabled: false
      revision: 0

    logicalbackup:
      enabled: true
      schedule: "13 02 * * *"
      provider: s3
      retention: "30 days"

    backups:
      enabled: true

      schedule: "0 0 * * *"
      retentionPolicy: 30d

      # Currently, we support : AWS and Azure.
      provider: aws

      aws:
        # Whether to enable Kube2IAM integration, instead of providing static AWS credentials
        # from a Kubernetes Secret.
        enableKube2IAMIntegration: true

# Realms for Keycloak to create at startup, as {name: realm JSON}. Rendered into
# the ConfigMap <release>-realm-imports (templates/realm-imports.yaml); to use it,
# mount that ConfigMap at /opt/keycloak/data/import with keycloakx.extraVolumes /
# keycloakx.extraVolumeMounts and add "--import-realm" to keycloakx.args.
#
# The import is create-only: a realm that already exists is skipped, so editing a
# file here after the first start changes nothing. Values in the JSON may be
# ${ENV_VAR} placeholders, resolved from the Keycloak container's environment -
# keep client secrets in a Secret and pass it in with keycloakx.extraEnvFrom.
#
# Do not list only a few `requiredActions` in a realm file: a non-empty list
# replaces Keycloak's defaults instead of adding to them, which drops e.g.
# UPDATE_PASSWORD and breaks temporary passwords. Leave the key out.
realmImports: {}
