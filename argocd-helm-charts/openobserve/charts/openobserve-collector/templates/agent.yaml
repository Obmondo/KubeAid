{{- if .Values.agent.enabled }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
{{- $agentLabels := include "openobserve-collector.labels" . | fromYaml | default (dict) }}
{{- $agentLabels = mergeOverwrite $agentLabels (.Values.agent.labels | default (dict)) }}
metadata:
  name: {{ include "openobserve-collector.fullname" . }}-agent
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- toYaml $agentLabels | nindent 4 }}
spec:
  # Explicitly set so the collector renders on opentelemetry-operator versions whose
  # v1beta1 CRD requires spec.managementState (otherwise install/ArgoCD validation fails
  # with: missing required field "managementState"). See #108, #129, #141.
  managementState: {{ .Values.managementState | default "managed" }}
  mode: daemonset # "daemonset", "deployment" (default), "statefulset"
  serviceAccount: {{ include "openobserve-collector.serviceAccountName" . }}
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  {{- with .Values.image.pullPolicy }}
  imagePullPolicy: {{ . }}
  {{- end }}
  {{- with .Values.image.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.agent.podAnnotations }}
  podAnnotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
  {{- with .Values.agent.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.agent.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.agent.podSecurityContext }}
  podSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumes:
    - name: hostfs
      hostPath:
        path: /
    - name: varlog
      hostPath:
        path: /var/log
        type: ''
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
        type: ''
  volumeMounts:
    - name: hostfs
      mountPath: /hostfs
    - name: varlog
      mountPath: /var/log
    - name: varlibdockercontainers
      readOnly: true
      mountPath: /var/lib/docker/containers
  {{- with .Values.agent.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  config:
    receivers:
      {{- toYaml .Values.agent.receivers | nindent 6 }}
    connectors:
      {{- toYaml .Values.agent.connectors | nindent 6 }}
    processors:
      attributes:
        actions:
          - key: k8s_cluster
            action: insert
            value: {{ .Values.k8sCluster | quote }}
      {{- toYaml .Values.agent.processors | nindent 6 }}
    extensions:
      {{- toYaml .Values.agent.extensions | nindent 6 }}
    exporters:
      {{- toYaml .Values.exporters | nindent 6 }}
    service:
      {{- toYaml .Values.agent.service | nindent 6 }}
{{- end }}
