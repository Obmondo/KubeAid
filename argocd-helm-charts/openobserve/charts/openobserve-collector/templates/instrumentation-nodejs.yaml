{{- if .Values.autoinstrumentation.enabled -}}
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: openobserve-nodejs
  namespace: {{ .Release.Namespace | quote }}
spec:
  exporter:
    endpoint: http://{{ include "openobserve-collector.fullname" . }}-gateway-collector.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: {{ .Values.autoinstrumentation.samplingRate | quote }}
  nodejs:
    {{- with .Values.autoinstrumentation.images.nodejs }}
    image: {{ . | quote }}
    {{- end }}
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

{{- end }}
