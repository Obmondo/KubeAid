{{- if .Values.gateway.enabled -}}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
{{- $gatewayLabels := include "openobserve-collector.labels" . | fromYaml | default (dict) }}
{{- $gatewayLabels = mergeOverwrite $gatewayLabels (.Values.gateway.labels | default (dict)) }}
metadata:
  name: {{ include "openobserve-collector.fullname" . }}-gateway
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- toYaml $gatewayLabels | nindent 4 }}
spec:
  # Explicitly set so the collector renders on opentelemetry-operator versions whose
  # v1beta1 CRD requires spec.managementState (otherwise install/ArgoCD validation fails
  # with: missing required field "managementState"). See #108, #129, #141.
  managementState: {{ .Values.managementState | default "managed" }}
  {{- if .Values.gateway.autoscaler }}
  autoscaler:
    {{- toYaml .Values.gateway.autoscaler | nindent 4 }}
  {{- else }}
  replicas: {{ .Values.gateway.replicas | default 1 }}
  {{- end }}
  mode: statefulset
  {{- if .Values.gateway.targetAllocator.enabled }}
  targetAllocator:
    enabled: true
    serviceAccount: {{ include "openobserve-collector.serviceAccountName" . }}
    {{- with .Values.gateway.targetAllocator.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    prometheusCR:
      enabled: true
      serviceMonitorSelector: {}
      podMonitorSelector: {}
  {{- end }}
  serviceAccount: {{ include "openobserve-collector.serviceAccountName" . }}
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  {{- with .Values.image.pullPolicy }}
  imagePullPolicy: {{ . }}
  {{- end }}
  {{- with .Values.image.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.podAnnotations }}
  podAnnotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
  {{- with .Values.gateway.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.podSecurityContext }}
  podSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $sampleLimit := dig "prometheus" "sampleLimit" 10000 .Values.gateway }}
  {{- if not (and (or (kindIs "int64" $sampleLimit) (kindIs "int" $sampleLimit) (kindIs "float64" $sampleLimit)) (eq (float64 $sampleLimit) (float64 (int64 $sampleLimit))) (ge (int64 $sampleLimit) 0)) }}
  {{- fail "gateway.prometheus.sampleLimit must be a non-negative integer" }}
  {{- end }}
  {{- $receivers := deepCopy .Values.gateway.receivers }}
  {{- range (dig "prometheus" "config" "scrape_configs" list $receivers) }}
  {{- if and (has .job_name (list "cadvisor" "prometheus-autodiscovery")) (not (hasKey . "sample_limit")) }}
  {{- $_ := set . "sample_limit" (int64 $sampleLimit) }}
  {{- end }}
  {{- end }}
  config:
    receivers:
      {{- toYaml $receivers | nindent 6 }}
    connectors:
      {{- toYaml .Values.gateway.connectors | nindent 6 }}
    processors:
      attributes:
        actions:
          - key: k8s_cluster
            action: insert
            value: {{ .Values.k8sCluster | quote }}
      {{- toYaml .Values.gateway.processors | nindent 6 }}
    extensions:
      {{- toYaml .Values.gateway.extensions | nindent 6 }}
    exporters:
      {{- toYaml .Values.exporters | nindent 6 }}
    service:
      {{- toYaml .Values.gateway.service | nindent 6 }}
{{- end -}}
