{{- if .Values.autoinstrumentation.enabled -}}
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: openobserve-go
  namespace: {{ .Release.Namespace | quote }}
spec:
  go:
    image: {{ .Values.autoinstrumentation.images.go | default (printf "ghcr.io/open-telemetry/opentelemetry-go-instrumentation/autoinstrumentation-go:%s" .Values.autoinstrumentation.goImageVersion) | quote }}
  exporter:
    endpoint: http://{{ include "openobserve-collector.fullname" . }}-gateway-collector.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: {{ .Values.autoinstrumentation.samplingRate | quote }}

{{- end }}
