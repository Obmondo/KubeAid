# Add extra environment variables to all pods, useful for overriding secrets
extraEnv: []
# - name: ZO_S3_SECRET_KEY
#   valueFrom:
#     secretKeyRef:
#       name: s3credentials-secret
#       key: S3_KEY

# This is for router
# Prometheus Operator ServiceMonitor to scrape OpenObserve's /metrics endpoint.
# Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1) to be installed.
serviceMonitor:
  enabled: false
  # namespace: ""            # defaults to the release namespace
  # additionalLabels: {}     # e.g. { release: kube-prometheus-stack } to match your Prometheus selector
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  scheme: http
  honorLabels: false
  # tlsConfig: {}
  relabelings: []
  metricRelabelings: []

service:
  type: ClusterIP
  # type: LoadBalancer
  http_port: 5080
  grpc_port: 5081
  report_server_port: 5082
  # if the type of service is LoadBalancer, you can config available annotations for Kubernetes load balancers by cloud provider.
  # annotations:
  #  service.beta.kubernetes.io/aws-load-balancer-internal: "true"
  #  service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"

serviceIngester:
  type: ClusterIP
  # type: LoadBalancer
  http_port: 5080
  grpc_port: 5081
  report_server_port: 5082
  # if the type of service is LoadBalancer, you can config available annotations for Kubernetes load balancers by cloud provider.
  # annotations:
  #  service.beta.kubernetes.io/aws-load-balancer-internal: "true"
  #  service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"

certIssuer:
  enabled: false

# blocked-metrics is a small nginx sidecar deployed when ingress is enabled (and the
# gateway is not) to block public access to the /metrics endpoints.
blockedMetrics:
  # Resources for the blocked-metrics nginx container. Exposed because the previous
  # hardcoded 32Mi limit could OOMKill the container in some environments.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 128Mi

ingress:
  enabled: false
  className: "nginx"
  # NOTE: /metrics and /api/metrics endpoints are always blocked for public access when ingress is enabled
  annotations:
    # NOTE: the cert-manager.io/issuer annotation is NOT set here. It is injected
    # automatically by the ingress template when certIssuer.enabled=true. This lets you
    # use your own cert-manager.io/cluster-issuer here without a conflicting issuer.
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1" # Enable HTTP/1.1 for WebSockets
    nginx.ingress.kubernetes.io/enable-websocket: "true"
    nginx.ingress.kubernetes.io/proxy-set-headers: |
      Upgrade $http_upgrade;
      Connection "Upgrade";
    # nginx.ingress.kubernetes.io/connection-proxy-header: keep-alive # keep-alive should be disabled for websockets to work
    # nginx.ingress.kubernetes.io/proxy-connect-timeout: '600'
    # nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
    # nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
    # nginx.ingress.kubernetes.io/proxy-body-size: 32m
  hosts:
    - host: openobserve.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: openobserve.example.com
      hosts:
        - openobserve.example.com

# Gateway API configuration (Envoy Gateway)
# Uses Envoy Gateway EnvoyPatchPolicy to block /metrics and /api/metrics endpoints with direct 403 response
gateway:
  enabled: false
  # TLS Certificate configuration (requires cert-manager)
  # Creates Certificate resources for HTTPS listeners on Gateways
  certificates:
    enabled: false  # Set to true to create cert-manager Certificate resources
    # Cert-manager issuer configuration
    issuerRef:
      name: "letsencrypt-prod"  # ClusterIssuer or Issuer name
      kind: "ClusterIssuer"     # ClusterIssuer or Issuer
    # List of certificates to create
    certs: []
      # Example:
      # - name: eg-external-https-cert  # Certificate resource name
      #   namespace: envoy-gateway-system  # Where to create the certificate (usually gateway namespace)
      #   secretName: eg-external-https-cert  # Secret name (must match Gateway certificateRefs)
      #   dnsNames:
      #     - helmo2distributed.test.zinclabs.dev
      #     - apihelmo2distributed.test.zinclabs.dev
  # HTTPRoute configurations - supports multiple routes with different hostnames and backends
  httpRoutes:
    # Annotations to add to all HTTPRoute resources
    annotations: {}
    # Labels to add to all HTTPRoute resources
    labels: {}
    # List of HTTPRoute configurations
    # Note: /metrics and /api/metrics are automatically blocked by EnvoyPatchPolicy
    routes:
      # UI Route - for web interface (external traffic)
      - name: openobserve-api
        # Gateway(s) to attach this route to
        # Simple format: just gateway name (assumes same namespace as release)
        gateways:
          - eg-external
        # Advanced format (if needed):
        # gateways:
        #   - name: eg-external
        #     namespace: custom-namespace
        #     sectionName: https
        hostnames:
          - "api.openobserve.ai"
        rules:
          # Route all traffic to router service
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: router
                port: 5080
      # API Route - for data ingestion (internal traffic)
      - name: openobserve-ui
        gateways:
          - eg-internal
        hostnames:
          - "ui.openobserve.com"
        rules:
          # Route all traffic to ingester service
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: router
                port: 5080
      # Example: Route accessible via both internal and external gateways
      # - name: admin
      #   gateways:
      #     - eg-internal
      #     - eg-external
      #   hostnames:
      #     - "admin.openobserve.ai"
      #   rules:
      #     - matches:
      #         - path:
      #             type: PathPrefix
      #             value: /
      #       backendRefs:
      #         - name: router
      #           port: 5080

