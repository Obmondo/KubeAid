# Postgres is used for storing openobserve metadata.
# Make sure to install cloudnative-pg operator before enabling this
# https://github.com/cloudnative-pg/cloudnative-pg/blob/main/docs/src/installation_upgrade.md
# kubectl apply --server-side -f \
#   https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/releases/cnpg-1.30.0.yaml
postgres:
  enabled: true
  pgadmin:
    enabled: false
    image:
      repository: dpage/pgadmin4
      tag: latest
    resources:
      requests:
        memory: 200Mi
        cpu: 10m
      limits:
        memory: 250Mi
        cpu: 100m
    PGADMIN_DEFAULT_EMAIL: hello@openobserve.ai
    PGADMIN_DEFAULT_PASSWORD: Batman123
  spec:
    password: Batman123 # password # username is hardcoded to openobserve, db is hardcoded to app
    enableSuperuserAccess: true # if true then superuser access will be enabled. You can get the password from appropriate secret once the postgres is deployed
    instances: 2 # creates a primary and a replica. replica will become primary if the primary fails
    affinity: # see details https://cloudnative-pg.io/docs/1.30/scheduling/
      podAntiAffinityType: preferred
    storage:
      size: 10Gi
    postgresql:
      parameters:
        shared_buffers: "1GB"
        max_connections: "1500"
    monitoring:
      enablePodMonitor: true
    backup: {} # All the configuration associated with an object store from https://cloudnative-pg.io/docs/1.30/backup/

enterprise:
  enabled: true
  parameters:
    O2_AUDIT_ENABLED: "true"
    O2_AUDIT_BATCH_SIZE: "500"
    O2_CUSTOM_LOGO_TEXT: ""
    O2_CUSTOM_SLACK_URL: ""
    O2_CUSTOM_DOCS_URL: ""
    O2_CUSTOM_HIDE_MENUS: ""
    O2_CUSTOM_HIDE_SELF_LOGO: "false"
    O2_SUPER_CLUSTER_ENABLED: "false"
    O2_SUPER_CLUSTER_PUBLIC_ADDR: ""
    O2_SUPER_CLUSTER_PUBLIC_PORT: ""
    O2_SUPER_CLUSTER_GRPC_TOKEN: ""
    O2_SEARCH_GROUP_CPU_LIMIT_ENABLED: "false"
    O2_SEARCH_GROUP_DYNAMIC_RESOURCE: "true"
    O2_SEARCH_GROUP_LONG_MAX_CPU: "50%"
    O2_SEARCH_GROUP_LONG_MAX_MEMORY: "50%"
    O2_SEARCH_GROUP_LONG_MAX_CONCURRENCY: "4"
    O2_SEARCH_GROUP_SHORT_MAX_CPU: "50%"
    O2_SEARCH_GROUP_SHORT_MAX_MEMORY: "50%"
    O2_SEARCH_GROUP_SHORT_MAX_CONCURRENCY: "10"
    O2_SEARCH_GROUP_USER_LONG_MAX_CONCURRENCY: "1"
    O2_SEARCH_GROUP_USER_SHORT_MAX_CONCURRENCY: "2"
    O2_SEARCH_GROUP_BASE_SPEED: "1024" # in MB
    O2_SEARCH_GROUP_BASE_SECS: "10" # in seconds
    O2_COMPACT_DOWNSAMPLING_INTERVAL: "3600" # in seconds
    O2_METRICS_DOWNSAMPLING_RULES: ""
    O2_RATE_LIMIT_ENABLED: "false"
    O2_RATE_LIMIT_RULE_REFRESH_INTERVAL: "10" # in seconds
    # AI features - requires o2ai to be enabled
    # O2_AGENT_URL is auto-generated when o2ai.enabled=true (defaults to http://<release>-o2ai:8000), override below if needed
    # O2_TOOL_API_URL is auto-generated (defaults to http://<release>-router:5080), override below if needed
    O2_AI_ENABLED: "false"
    O2_AGENT_URL: ""  # Leave empty to use default auto-generated URL
    O2_TOOL_API_URL: ""  # Leave empty to use default auto-generated URL
    ZO_MASTER_ENCRYPTION_ALGORITHM: "" # MUST be empty if key is empty
    ZO_MASTER_ENCRYPTION_KEY: ""
    # Service Graph features
    O2_SERVICE_GRAPH_ENABLED: "false"
    O2_SERVICE_GRAPH_PROCESSING_INTERVAL_SECS: "300"
    O2_SERVICE_GRAPH_QUERY_TIME_RANGE_MINUTES: "10"
    O2_SERVICE_GRAPH_EXCLUDE_INTERNAL_SPANS: "false"
    # Incidents and RCA features
    O2_INCIDENTS_ENABLED: "false"
    O2_INCIDENTS_RCA_ENABLED: "false"
    O2_INCIDENTS_AUTO_RESOLVE_AFTER_MINUTES: "4320"
    O2_INCIDENTS_ALERT_GRAPH_ENABLED: "false"
    # Service Streams features
    O2_SERVICE_STREAMS_ENABLED: "false"
    O2_SERVICE_STREAMS_SAMPLE_EVERY_NTH_STREAM: "5"
    O2_SERVICE_STREAMS_SAMPLE_EVERY_NTH_FILE: "50"
    O2_FQN_PRIORITY_DIMENSIONS: "k8s-deployment,k8s-statefulset,k8s-daemonset,k8s-job,aws-ecs-task,service"
    O2_SERVICE_STREAMS_MIN_CORRELATION_CONFIDENCE: "0.20"
    O2_SERVICE_STREAMS_MAX_STREAMS_PER_SERVICE: "100"
    O2_SERVICE_STREAMS_SAMPLE_WINDOW_SECS: "3600"
  openfga:
    enabled: true
    parameters:
      O2_OPENFGA_LIST_ONLY_PERMITTED: "false"
      O2_MAP_GROUP_TO_ROLE: "true"
      O2_MAP_GROUP_TO_ROLE_SKIP_CREATION: "false"
      O2_OPENFGA_PAGE_SIZE: "100"
    image:
      repository: openfga/openfga
      tag: latest
      pullPolicy: IfNotPresent
  dex:
    enabled: false
    parameters:
      O2_CALLBACK_URL: https://openobserve.example.com/web/cb
      O2_DEX_SCOPES: openid profile email groups offline_access
      O2_DEX_GROUP_ATTRIBUTE: ou
      O2_DEX_DEFAULT_ORG: default
      O2_DEX_DEFAULT_ROLE: user
      O2_DEX_ROLE_ATTRIBUTE: role
      O2_DEX_NATIVE_LOGIN_ENABLED: "true"
      O2_DEX_GROUP_CLAIM: "groups"
      O2_DEX_LDAP_GROUP_ATTRIBUTE: "ou"
      O2_DEX_LDAP_ROLE_ATTRIBUTE: "cn"
    config:
      issuer: https://dex.example.com/dex
      storage:
        type: kubernetes
        config:
          inCluster: true
      web:
        http: 0.0.0.0:5556
      frontend:
        issuer: "OpenObserve"
        logoURL: "https://cloud.openobserve.ai/web/src/assets/images/common/open_observe_logo.svg"
      expiry:
        idTokens: 10m
        refreshTokens:
          validIfNotUsedFor: 30m
      staticClients:
        - id: o2-client
          redirectURIs:
            - https://openobserve.example.com/config/redirect
          name: o2-client
          secret: ZXhhbXBsZS1hcHAtc2VjcmV0 # This should be base64 encoded value of client secret.Gets mapped to O2_DEX_CLIENT_SECRET
      oauth2:
        responseTypes:
          - code
        skipApprovalScreen: true
      connectors:
        # - type: google
        #   id: google
        #   name: Google
        #   config:

        #     # Connector config values starting with a "$" will read from the environment.
        #     clientID: 123144355-hcghfcfghd5fhcv5v7hvh.apps.googleusercontent.com
        #     clientSecret: GOABCD-gghfge543edfgc55dcgcghf6

        #     # Dex's issuer URL + "/callback"
        #     redirectURI: https://dex.example.com/dex/callback
        #     # Google supports whitelisting allowed domains when using G Suite
        #     # (Google Apps). The following field can be set to a list of domains
        #     # that can log in:
        #     #
        #     hostedDomains:
        #     - openobserve.ai
        #     - zinclabs.io
        - type: ldap
          name: OpenLDAP
          id: ldap
          config:
            host: openldap:389
            insecureNoSSL: true
            bindDN: cn=admin,dc=o2,dc=ai
            bindPW: Z54H7w5WQUARsLKaumM967iX62msTEno
            usernamePrompt: Email Address
            userSearch:
              baseDN: ou=users,dc=o2,dc=ai
              filter: "(objectClass=inetOrgPerson)"
              username: mail
              idAttr: DN
              emailAttr: mail
              nameAttr: cn
            groupSearch:
              baseDN: ou=teams,dc=o2,dc=ai
              filter: "(objectClass=groupOfUniqueNames)"
              userMatchers:
                - userAttr: DN
                  groupAttr: uniqueMember
              nameAttr: entryDN
    image:
      repository: dexidp/dex
      tag: v2.37.0
      pullPolicy: IfNotPresent
    extraEnv: []
    # Mount additional volumes into the dex pod, e.g. a private root CA for an
    # OIDC connector (Keycloak). Create a secret with the CA cert and reference
    # it here, then point the connector's rootCAs at the mounted path:
    #   connectors:
    #     - type: oidc
    #       id: keycloak
    #       name: Keycloak
    #       config:
    #         issuer: https://keycloak.example.com/realms/master
    #         rootCAs:
    #           - /etc/dex/certs/ca.crt
    # extraVolumes:
    #   - name: keycloak-ca
    #     secret:
    #       secretName: keycloak-ca
    # extraVolumeMounts:
    #   - name: keycloak-ca
    #     mountPath: /etc/dex/certs
    #     readOnly: true
    extraVolumes: []
    extraVolumeMounts: []
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/issuer: letsencrypt
        kubernetes.io/tls-acme: "true"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        # nginx.ingress.kubernetes.io/connection-proxy-header: keep-alive
        # nginx.ingress.kubernetes.io/proxy-connect-timeout: '600'
        # nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
        # nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
        # nginx.ingress.kubernetes.io/proxy-body-size: 32m
      hosts:
        - host: dex.example.com
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: dex.example.com
          hosts:
            - dex.example.com
  o2ai:
    enabled: false # if true then o2ai will be deployed as part of openobserve (enterprise only)
    config:
      O2_AI_HOST: "0.0.0.0"
      O2_AI_PORT: "8000"
      O2_AI_LOG_LEVEL: "INFO"
      ADK_ENABLE_JSON_SCHEMA_FOR_FUNC_DECL: "true"
      O2_AI_MODEL: "claude-sonnet-4-6"  # Model name for AI requests
      O2_AI_PROVIDER: "anthropic"  # Provider for direct API calls (Flow 3 only - ignored when gateway is used)
      O2_AI_GATEWAY_ENABLED: ""  # Optional: Set to "true" to force gateway usage (auto-set when aiGateway.enabled=true)
      O2_AI_GATEWAY_URL: ""  # Optional: AI Gateway URL (e.g., "http://my-gateway:80")
                             # Flow 1: When aiGateway.enabled=true → Auto-set to deployed gateway (O2_AI_GATEWAY_ENABLED=true, no O2_AI_PROVIDER needed)
                             # Flow 2: When set manually → Use self-hosted gateway (O2_AI_GATEWAY_ENABLED=true, no O2_AI_PROVIDER needed)
                             # Flow 3: When blank → Direct provider API calls (O2_AI_PROVIDER required)
      # MCP validation settings
      O2_MCP_VALIDATION_ENABLED: "true"
      O2_MCP_VALIDATION_RETRY: "true"
      O2_MCP_CONTENT_VALIDATION_ENABLED: "true"
      O2_MCP_CONTENT_VALIDATION_MODE: "hybrid"
      O2_MCP_RESPONSE_VALIDATION_ENABLED: "true"
    extraEnv: []
    cliConfig: {}  # Leave empty to use built-in defaults. Override to customize available CLI commands.
    clusterAccess:
      enabled: false  # Enable kubectl/cluster access — creates ServiceAccount, ClusterRole, ClusterRoleBinding
      serviceAccount:
        annotations: {}
        # AWS EKS IRSA example:
        #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME
        # GKE Workload Identity example:
        #   iam.gke.io/gcp-service-account: SA_NAME@PROJECT_ID.iam.gserviceaccount.com
      rbac:
        rules: []  # Leave empty to use built-in defaults. Override to restrict or extend permissions.    

