        terminationGracePeriodSeconds: 30
  reportserver:
    enabled: false
    config:
      startupProbe:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 30
        terminationGracePeriodSeconds: 30
      readinessProbe:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 30
        terminationGracePeriodSeconds: 30
      livenessProbe:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 30
        terminationGracePeriodSeconds: 30
  o2ai:
    enabled: true
    config:
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3


# Envoy AI Gateway Configuration
# When enabled, SRE agent routes AI requests through an existing AI Gateway
# Use this when you have already deployed an AI Gateway in your cluster
aiGateway:
  enabled: false  # Set to true to use an existing AI Gateway
  # Name of the AI Gateway service (e.g., "envoy-envoy-gateway-system-ai-gateway-78adb12c")
  gatewayServiceName: "ai-gateway"
  # Namespace where the AI Gateway service exists (empty = same as release namespace)
  gatewayNamespace: ""
  # Port of the AI Gateway service
  port: 80
  # URL will be auto-generated as: http://<gatewayServiceName>.<gatewayNamespace>.svc.cluster.local:<port>

