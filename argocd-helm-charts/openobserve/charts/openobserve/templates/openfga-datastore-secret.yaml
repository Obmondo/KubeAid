{{- if and .Values.enterprise.enabled .Values.enterprise.openfga.enabled (include "openobserve.openfgaDatastoreURI" .) }}
{{- /* Keeps the datastore password out of the OpenFGA pod spec (visible to anyone who can read pods). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openobserve.openfgaDatastoreSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "openobserve.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENFGA_DATASTORE_URI: "{{ include "openobserve.openfgaDatastoreURI" . }}"
{{- end }}
