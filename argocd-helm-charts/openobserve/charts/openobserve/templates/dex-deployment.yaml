{{- if and .Values.enterprise.enabled .Values.enterprise.dex.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openobserve.fullname" . }}-dex
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "openobserve.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.dex.enabled }}
  replicas: {{ .Values.replicaCount.dex }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openobserve.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations.dex }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Dex reads its config only at start-up; restart it when the config changes.
        checksum/dex-config: {{ (include (print $.Template.BasePath "/dex-secret.yaml") . | fromYaml).stringData | toJson | sha256sum }}
        {{- with include "openobserve.secretChecksumAnnotation" . }}
        {{- . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openobserve.selectorLabels" . | nindent 8 }}
        app: dex
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openobserve.fullname" . }}-dex
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.enterprise.dex.image.repository }}:{{ .Values.enterprise.dex.image.tag }}"
          imagePullPolicy: {{ .Values.enterprise.dex.image.pullPolicy }}
          ports:
            - containerPort: 5556
              name: http
          {{- if .Values.probes.dex.enabled }}
          {{- /* Dex serves /healthz on its web port (5556) under the issuer path, e.g. /dex/healthz. */}}
          {{- /* /healthz also checks Dex's storage (the Kubernetes API), so only readiness uses it; */}}
          {{- /* liveness and startup just check that Dex is listening, so an API blip doesn't restart it. */}}
          {{- $healthz := printf "%s/healthz" ((urlParse (.Values.enterprise.dex.config.issuer | default "")).path | trimSuffix "/") }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.dex.config.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.dex.config.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.dex.config.livenessProbe.timeoutSeconds | default 10 }}
            successThreshold: {{ .Values.probes.dex.config.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.probes.dex.config.livenessProbe.failureThreshold | default 3 }}
            terminationGracePeriodSeconds: {{ .Values.probes.dex.config.livenessProbe.terminationGracePeriodSeconds | default 30 }}
          readinessProbe:
            httpGet:
              path: {{ $healthz }}
              port: http
            initialDelaySeconds: {{ .Values.probes.dex.config.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.dex.config.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.dex.config.readinessProbe.timeoutSeconds | default 10 }}
            successThreshold: {{ .Values.probes.dex.config.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.probes.dex.config.readinessProbe.failureThreshold | default 3 }}
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.dex.config.startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.dex.config.startupProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.dex.config.startupProbe.timeoutSeconds | default 10 }}
            successThreshold: {{ .Values.probes.dex.config.startupProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.probes.dex.config.startupProbe.failureThreshold | default 3 }}
          {{- end }}
          resources:
            {{- toYaml .Values.enterprise.dex.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            {{- with .Values.enterprise.dex.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "openobserve.fullname" . }}
            - secretRef:
                name: {{ if .Values.externalSecret.enabled }}{{ .Values.externalSecret.name }}{{ else }}{{ include "openobserve.fullname" . }}{{ end }}
          env:
            {{- with .Values.enterprise.dex.extraEnv }}
            {{- toYaml . |  nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "openobserve.fullname" . }}-dex
        {{- with .Values.enterprise.dex.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.enterprise.dex.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.enterprise.dex.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations.dex }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
