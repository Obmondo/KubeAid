{{- if and .Values.enterprise.enabled .Values.enterprise.dex.enabled }}
# Dex's config holds the OAuth client secret and connector credentials (e.g. LDAP bindPW),
# so it is stored as a Secret, not a ConfigMap. Dex reads the same file path as before.
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "openobserve.fullname" . }}-dex
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "openobserve.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.docker.yaml: | {{ .Values.enterprise.dex.config | toYaml | nindent 4 }}
{{- end }}
