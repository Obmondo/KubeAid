apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openobserve.reportServerSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "openobserve.labels" . | nindent 4 }}
type: Opaque
stringData:
  ZO_REPORT_SERVER_SECRET: {{ include "openobserve.reportServerSecret" . | quote }}
