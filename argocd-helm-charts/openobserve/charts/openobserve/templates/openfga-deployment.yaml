{{- if and .Values.enterprise.enabled .Values.enterprise.openfga.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openobserve.fullname" . }}-openfga
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfga
  template:
    metadata:
      {{- if include "openobserve.openfgaDatastoreURI" . }}
      annotations:
        # The URI moved from an inline env value to a Secret; roll the pod when it changes, as before.
        checksum/openfga-datastore: {{ (include (print $.Template.BasePath "/openfga-datastore-secret.yaml") . | fromYaml).stringData | toJson | sha256sum }}
      {{- end }}
      labels:
        app: openfga
    spec:
      initContainers:
        - name: openfga-migrate
          image: {{ .Values.enterprise.openfga.image.repository }}:{{ .Values.enterprise.openfga.image.tag }}
          imagePullPolicy: {{ .Values.enterprise.openfga.image.pullPolicy }}
          command: ['/openfga', 'migrate']
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            {{- if include "openobserve.openfgaDatastoreURI" . }}
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "openobserve.openfgaDatastoreSecretName" . }}
                  key: OPENFGA_DATASTORE_URI
            {{- end }}
          {{- /* OpenFGA reads only OPENFGA_* variables. The external Secret may set OPENFGA_DATASTORE_URI; */}}
          {{- /* the chart's own Secret has none, so OpenFGA doesn't load it and never sees the app's credentials. */}}
          {{- if .Values.externalSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecret.name }}
          {{- end }}
          resources:
            {{- if .Values.resources.openfga }}
            {{- toYaml .Values.resources.openfga | nindent 12 }}
            {{- else }}
            limits:
              cpu: 200m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 128Mi
            {{- end }}
      {{- with .Values.nodeSelector.openfga }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity.openfga }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations.openfga }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openfga
          image: {{ .Values.enterprise.openfga.image.repository }}:{{ .Values.enterprise.openfga.image.tag }}
          imagePullPolicy: {{ .Values.enterprise.openfga.image.pullPolicy }}
          command: ['/openfga', 'run']
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            {{- if include "openobserve.openfgaDatastoreURI" . }}
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "openobserve.openfgaDatastoreSecretName" . }}
                  key: OPENFGA_DATASTORE_URI
            {{- end }}
            - name: OPENFGA_LOG_FORMAT
              value: json
          {{- /* OpenFGA reads only OPENFGA_* variables. The external Secret may set OPENFGA_DATASTORE_URI; */}}
          {{- /* the chart's own Secret has none, so OpenFGA doesn't load it and never sees the app's credentials. */}}
          {{- if .Values.externalSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecret.name }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: grpc
          {{- if .Values.probes.openfga.enabled }}
          {{- /* /healthz also checks the datastore (Postgres), so only readiness uses it; liveness and */}}
          {{- /* startup just check that OpenFGA is listening, so a database blip doesn't restart it. */}}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.openfga.config.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.openfga.config.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.openfga.config.livenessProbe.timeoutSeconds | default 10 }}
            successThreshold: {{ .Values.probes.openfga.config.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.probes.openfga.config.livenessProbe.failureThreshold | default 3 }}
            terminationGracePeriodSeconds: {{ .Values.probes.openfga.config.livenessProbe.terminationGracePeriodSeconds | default 30 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.openfga.config.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.openfga.config.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.openfga.config.readinessProbe.timeoutSeconds | default 10 }}
            successThreshold: {{ .Values.probes.openfga.config.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.probes.openfga.config.readinessProbe.failureThreshold | default 3 }}
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.openfga.config.startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.openfga.config.startupProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.openfga.config.startupProbe.timeoutSeconds | default 10 }}
            successThreshold: {{ .Values.probes.openfga.config.startupProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.probes.openfga.config.startupProbe.failureThreshold | default 3 }}
          {{- end }}
          resources:
            {{- if .Values.resources.openfga }}
            {{- toYaml .Values.resources.openfga | nindent 12 }}
            {{- else }}
            limits:
              cpu: 200m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 128Mi
            {{- end }}
{{- end }}
