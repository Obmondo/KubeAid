{{- with .Values.webclients.networkPolicy }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stalwart-mail.fullname" $ }}-twake
  labels:
    {{- include "stalwart-mail.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stalwart-mail.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: twake
  policyTypes:
    - Ingress
    {{- if .egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    {{- with .ingress.http }}
    - ports:
        - port: 80
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}{{/* end-with .ingress.http */}}

  {{- with .egress }}
  {{- if .enabled }}
  egress:
    {{- with .extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}{{/* end-if egress.enabled */}}
  {{- end }}{{/* end-with .egress */}}
{{- end }}
{{- end }}
