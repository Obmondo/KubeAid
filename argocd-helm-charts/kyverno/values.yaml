harborProxyCache:
  enabled: false

# Rewrite images from the listed upstream registries to a pull-through proxy cache,
# keeping the full upstream path: docker.io/velero/velero:v1 becomes
# <proxyRegistry>/docker.io/velero/velero:v1. Tags and digests stay as written.
pullThroughCache:
  enabled: false
  # proxyRegistry: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/my-prefix
  mutateExistingOnPolicyUpdate: false
  excludeNamespaces: []
# Registry hosts, or host/path prefixes, to rewrite. Matched against the canonical
# image name, so "docker.io" also catches "nginx" and "org/app".
upstreamRegistries: []
# - docker.io
# - ghcr.io
# - registry.k8s.io

resourceQuotaLimitRangeGenerator:
  enabled: false
  generateExisting: true
  defaultResourceQuotaRuleEnabled: true
  # cilium is excluded from both, never from one only. The LimitRange's 256Mi
  # container default OOM-kills the cilium agents on busy nodes once their own
  # resources are dropped (a Hetzner control-plane join re-applies the cilium
  # chart without them), and without the LimitRange the ResourceQuota rejects
  # every cilium pod, because the init containers set no requests or limits.
  # A cluster that sets these lists replaces the default, so keep cilium in them.
  excludeNamespaces:
    resourceQuota:
      - cilium
    limitRange:
      - cilium

  defaults:
    resourceQuota:
      pods: "100"
      jobs: "100"

      # Requests stay unset: summed over all namespaces they fire the quota overcommit alerts.
      cpu:
        request: null

      memory:
        request: null
        limit: 400Gi

      storage:
        persistentVolumeClaims: null
        request: null

      ephemeralStorage:
        request: null
        limit: null

    limitRange:
      container:
        cpu:
          defaultRequest: 100m

        memory:
          defaultRequest: 128Mi
          default: 256Mi
          max: 4Gi

      pod:
        memory:
          max: 16Gi

      pvc:
        storage:
          max: 100Gi

  overrides:
    rook-ceph:
      limitRange:
        container: {}

kyverno:
  # The KubeAid policies only mutate and generate (registry rewrites, pull-secret
  # copies, quotas); none of them is a security gate. With a fail-closed webhook,
  # an unreachable Kyverno blocks every write it matches: a legacy generate/clone
  # ClusterPolicy put all Secrets and Namespaces behind one, and while cilium was
  # down on the workers the API server refused Cluster API's bootstrap Secrets,
  # so replacement control planes never got a server. Fail open instead; policies
  # skipped during an outage are caught up by generateExisting and the next
  # admission.
  features:
    forceFailurePolicyIgnore:
      enabled: true

  # Keep Kyverno out of the namespaces a cluster needs to heal itself. Replaces
  # the upstream list, so kube-system is repeated; the kyverno namespace is
  # excluded separately (config.excludeKyvernoNamespace).
  config:
    webhooks:
      namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
              - cilium
              - capi-cluster

  # One replica is a single point of failure for every mutation and generation.
  # The upstream chart adds a PodDisruptionBudget (minAvailable 1) when replicas
  # is above 1, and spreads the pods over nodes with a preferred anti-affinity.
  admissionController:
    replicas: 3

  # clusterpolicies and policies are too big for client-side apply too, and they
  # come from the crds subchart, which kyverno-api below doesn't cover.
  crds:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true

  # The policies.kyverno.io CRDs render empty labels and annotations maps when
  # none are set, which Argo CD shows as a diff on every refresh. These CRDs are
  # also too big for client-side apply, so the annotation forces server-side apply.
  kyverno-api:
    labels:
      app.kubernetes.io/part-of: kyverno
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true
