                    image: "{{ $registry }}/{{ $dockerHubProj }}/{{`{{ element.image }}`}}"
                imagePullSecrets:
                  - name: {{ .Values.harborProxyCache.imagePullSecretName | default "harbor-proxy-cache" }}
          # Handle implicit official initContainers (e.g., nginx:1.27.1)
          - list: "request.object.spec.initContainers[]"
            preconditions:
              all:
                - key: "{{`{{ contains(element.image, '`}}{{ .Values.harborProxyCache.registry }}{{`') }}`}}"
                  operator: Equals
                  value: false
                - key: "{{`{{ contains(element.image, 'docker.io/') }}`}}"
                  operator: Equals
                  value: false
                - key: "{{`{{ contains(element.image, 'index.docker.io/') }}`}}"
                  operator: Equals
                  value: false
                - key: "{{`{{ contains(element.image, 'registry-1.docker.io/') }}`}}"
                  operator: Equals
                  value: false
                - key: "{{`{{ regex_match('^[^/]+$', element.image) }}`}}"
                  operator: Equals
                  value: true
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{`{{ element.name }}`}}"
                    image: "{{ $registry }}/{{ $dockerHubProj }}/library/{{`{{ element.image }}`}}"
                imagePullSecrets:
                  - name: {{ .Values.harborProxyCache.imagePullSecretName | default "harbor-proxy-cache" }}
    # === 3. Rule: Deployment / StatefulSet / DaemonSet / Job ===
    - name: mutate-docker-io-workload-containers
      match:
        any:
          - resources:
