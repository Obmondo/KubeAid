                - key: "{{`{{ contains(element.image, 'index.docker.io/') }}`}}"
                  operator: Equals
                  value: false
                - key: "{{`{{ contains(element.image, 'registry-1.docker.io/') }}`}}"
                  operator: Equals
                  value: false
                - key: "{{`{{ regex_match('^[^/]+$', element.image) }}`}}"
                  operator: Equals
                  value: true
            patchStrategicMerge:
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        initContainers:
                          - (name): "{{`{{ element.name }}`}}"
                            image: "{{ $registry }}/{{ $dockerHubProj }}/library/{{`{{ element.image }}`}}"
                        imagePullSecrets:
                          - name: {{ .Values.harborProxyCache.imagePullSecretName | default "harbor-proxy-cache" }}
{{- end }}
