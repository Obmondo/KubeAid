rook-ceph:
  monitoring:
    enabled: true
  resources:
    limits:
      cpu: 2000m
      memory: 400Mi
    requests:
      cpu: 500m
      memory: 200Mi

  csi:
    cephcsi:
      # v3.17.0 fails every attach and snapshot against a rotated CephX key with
      # "rados: ret=-22" (Malformed input). Drop this override once the vendored
      # chart ships v3.17.1 or newer by default.
      tag: v3.17.1

rook-ceph-cluster:
  # Ceph Tentacle. 34.0.1 pinned Squid (v19.2.7) for two Tentacle OSD bugs that are handled now:
  # Rook >= 1.21.0 keeps the OSD activate `lvs` scan off krbd devices (rook/rook#18489), and
  # v20.2.5 fixes the crash on partitions under 4 KiB (ceph/ceph#69971). That pin downgraded
  # every cluster already on v20; Rook does not refuse a downgrade, and the older mons cannot
  # read Tentacle's on-disk format. A cluster still on Squid sets `tag: v19.2.7` until it upgrades.
  cephImage:
    tag: v20.2.5

  # Velero selects a snapshot class by this label plus a driver match. Without a
  # class for a driver in use, every backup touching such a PVC errors with
  # "failed to get VolumeSnapshotClass for provisioner ...", leaving the backup
  # PartiallyFailed - which backup-exporter does not count, so VeleroBackupMissing
  # never clears. isDefault stays false so an existing default class is not
  # displaced; clusters that want one can override it.
  cephBlockPoolsVolumeSnapshotClass:
    enabled: true
    name: velero-snapshot-rbd
    isDefault: false
    deletionPolicy: Retain
    labels:
      velero.io/csi-volumesnapshot-class: "true"
  cephFileSystemVolumeSnapshotClass:
    enabled: true
    name: velero-snapshot-cephfs
    isDefault: false
    deletionPolicy: Retain
    labels:
      velero.io/csi-volumesnapshot-class: "true"
  monitoring:
    enabled: false

  toolbox:
    enabled: true
    resources:
      limits:
        memory: "100Mi"
      requests:
        cpu: "100m"
        memory: "100Mi"

  cephClusterSpec:
    resources:
      mgr:
        limits:
          cpu: "1000m"
          memory: "800Mi"
        requests:
          cpu: "1000m"
          memory: "512Mi"
      # No cpu limit on purpose: the mon idles around 50m but bursts on map
      # updates, and a 200m limit kept it throttled 20-30% of the time.
      # Upstream rook sets no mon cpu limit either.
      mon:
        limits:
          memory: "512Mi"
        requests:
          cpu: "200m"
          memory: "200Mi"
      osd:
        limits:
          memory: "1500Mi"
        requests:
          cpu: "500m"
          memory: "1500Mi"
      # No limits here on purpose: the OSD prepare job is a one-time memory burst
      # that must not be OOM-killed, and upstream suggests 1200Mi-2Gi if a
      # LimitRange forces you to set one. cf. rook/rook#11103
      prepareosd:
        requests:
          cpu: "100m"
          memory: "50Mi"
      mgr-sidecar:
        limits:
          cpu: "1000m"
          memory: "100Mi"
        requests:
          cpu: "1000m"
          memory: "100Mi"
      crashcollector:
        limits:
          cpu: "50m"
          memory: "60Mi"
        requests:
          cpu: "50m"
          memory: "60Mi"
      logcollector:
        limits:
          cpu: "50m"
          memory: "100Mi"
        requests:
          cpu: "50m"
          memory: "100Mi"
      cleanup:
        limits:
          cpu: "100m"
          memory: "100Mi"
        requests:
          cpu: "100m"
          memory: "100Mi"

    logCollector:

    disruptionManagement:
      # If true, the operator will create and manage PodDisruptionBudgets for OSD, Mon, RGW, and MDS daemons. OSD PDBs are managed dynamically
      # via the strategy outlined in the [design](https://github.com/rook/rook/blob/master/design/ceph/ceph-managed-disruptionbudgets.md). The operator will
      # block eviction of OSDs by default and unblock them safely when drains are detected.
      managePodBudgets: false

    # CephX key rotation strands live kernel mounts: krbd and kcephfs hold the key
    # they mapped with, so dropping the prior key makes every existing mount fail
    # authentication and hang in uninterruptible D state, recoverable only by
    # rebooting the node. Keep the prior key and keep rotation opt-in.
    #
    # keepPriorKeyCountMax exists only on csi in the CephCluster CRD -- daemon and
    # rbdMirrorPeer accept keyGeneration, keyRotationPolicy and keyType only. That
    # is fine: only the csi keys are consumed by in-kernel clients, so only they can
    # strand a mount. Rook restarts the daemons it re-keys.
    #
    # aes256k replaces the aes cipher that Ceph 20.2.4 flags as insecure. With
    # keyRotationPolicy Disabled a keyType change never re-keys anything (Rook
    # ShouldRotateCephxKeys returns early), so pinning it is documentation of the
    # desired cipher, not a safety net.
    #
    # csi.keyType is the one with a node requirement: those keys are consumed by
    # the kernel clients, so aes256k needs kernel 7.0+, i.e. Ubuntu 26.04 or newer,
    # on every node. Override it to aes on clusters with older nodes. daemon and
    # rbdMirrorPeer keys are used only by userspace Ceph daemons and have no such
    # requirement.
    #
    # daemon.keyType stays UNSET on purpose. Rook 1.20.7 (pkg/operator/ceph/
    # cluster/mon/spec.go:403) passes --mon-auth-emergency-allowed-ciphers to
    # every mon whenever daemon.keyType is set, whatever allowedCiphers says, and
    # Ceph 20.2.4 answers with AUTH_EMERGENCY_CIPHERS_SET (HEALTH_WARN, ArgoCD
    # Degraded). csi.keyType and rbdMirrorPeer.keyType do not trigger the flag.
    # Helm cannot null a subchart default from a values override, so do not add
    # a daemon.keyType default here; clusters that need one set it themselves.
    #
    # allowedCiphers restricts what the mons accept (auth_allowed_ciphers). With
    # daemon.keyType unset, Rook sets it via CLI after the mons are running.
    #
    # It pairs with csi.keyType: a cluster that overrides that to aes MUST widen this
    # to [aes, aes256k] as well, or it locks out its own CSI keys. Before adopting
    # this on an existing cluster, verify no entity still holds an aes key -- see
    # README.md, an excluded cipher locks out mon. and client.admin with no way back.
    security:
      cephx:
        allowedCiphers:
          - aes256k
        csi:
          keyRotationPolicy: Disabled
          keepPriorKeyCountMax: 1
          keyType: aes256k
        daemon:
          keyRotationPolicy: Disabled
        rbdMirrorPeer:
          keyRotationPolicy: Disabled
          keyType: aes256k

  # NOTE copied from rook-ceph-cluster/values.yaml file
  # Since we cannot really overwrite the resource usage
  cephFileSystems:
    - name: ceph-filesystem
      # see https://github.com/rook/rook/blob/master/Documentation/CRDs/Shared-Filesystem/ceph-filesystem-crd.md#filesystem-settings for available configuration
      spec:
        metadataPool:
          replicated:
            size: 3
        dataPools:
          - failureDomain: host
            replicated:
              size: 3
            # Optional and highly recommended, 'data0' by default, see https://github.com/rook/rook/blob/master/Documentation/CRDs/Shared-Filesystem/ceph-filesystem-crd.md#pools
            name: data0
        metadataServer:
          activeCount: 1
          activeStandby: true
          # The MDS is sized against mds_cache_memory_limit, which Ceph defaults
          # to 4Gi. The cache limit is a soft target the daemon routinely
          # overshoots, so the container needs headroom above it - Ceph's own
          # guidance is to keep the cache well under the container limit. At the
          # 700Mi this used to be, the MDS reached up:active and was then
          # OOMKilled within seconds, taking CephFS provisioning down with it
          # (ProvisioningFailed / DeadlineExceeded on every new PVC) and leaving
          # the filesystem with no standby.
          #
          # Lower this only together with mds_cache_memory_limit.
          resources:
            limits:
              memory: "4Gi"
            requests:
              cpu: "200m"
              memory: "2Gi"
          priorityClassName: system-cluster-critical
      storageClass:
        enabled: true
        isDefault: false
        name: ceph-filesystem
        # (Optional) specify a data pool to use, must be the name of one of the data pools above, 'data0' by default
        pool: data0
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        mountOptions: []
        # see https://github.com/rook/rook/blob/master/Documentation/ceph-filesystem.md#provision-storage for available configuration
        parameters:
          # The secrets contain Ceph admin credentials.
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
          csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
          # Specify the filesystem type of the volume. If not specified, csi-provisioner
          # will set default as `ext4`. Note that `xfs` is not recommended due to potential deadlock
          # in hyperconverged settings where the volume is mounted on the same node as the osds.
          csi.storage.k8s.io/fstype: ext4

  # NOTE copied from rook-ceph-cluster/values.yaml file
  # Since we cannot really overwrite the resource usage
  cephObjectStores:
    - name: ceph-objectstore
      # see https://github.com/rook/rook/blob/master/Documentation/CRDs/Object-Storage/ceph-object-store-crd.md#object-store-settings for available configuration
      spec:
        metadataPool:
          failureDomain: host
          replicated:
            size: 3
        dataPool:
          failureDomain: host
          erasureCoded:
            dataChunks: 2
            codingChunks: 1
        preservePoolsOnDelete: true
        gateway:
          port: 80
          resources:
            limits:
              memory: "300Mi"
            requests:
              cpu: "200m"
              memory: "300Mi"
          # securePort: 443
          # sslCertificateRef:
          instances: 1
          priorityClassName: system-cluster-critical
        healthCheck:
          startupProbe:
            disabled: false
          readinessProbe:
            disabled: false
            periodSeconds: 60
            failureThreshold: 2
      storageClass:
        enabled: true
        name: ceph-bucket
        reclaimPolicy: Delete
        # see https://github.com/rook/rook/blob/master/Documentation/ceph-object-bucket-claim.md#storageclass for available configuration
        parameters:
          # note: objectStoreNamespace and objectStoreName are configured by the chart
          region: us-east-1

ceph-csi-drivers:
  # Applied Rook's recommended ceph-csi-drivers values for v1.20).
  # Source: https://raw.githubusercontent.com/rook/rook/master/deploy/charts/ceph-csi-drivers/values.yaml
  operatorConfig:
    namespace: rook-ceph
    driverSpecDefaults:
      imageSet:
        name: rook-csi-operator-image-set-configmap
      nodePlugin:
        priorityClassName: system-node-critical
      controllerPlugin:
        priorityClassName: system-cluster-critical
  drivers:
    # The driver name prefix MUST be the rook operator namespace (rook-ceph).
    # Rook v1.20 no longer deploys CSI drivers itself; the ceph-csi-drivers chart
    # registers them under the ceph-csi-operator, and the storageClass provisioners
    # from rook-ceph-cluster point at <operatorNamespace>.<driver>.csi.ceph.com.
    rbd:
      name: rook-ceph.rbd.csi.ceph.com
      # The subchart defaults RBD to "none", which leaves the csi-snapshotter
      # sidecar out of the RBD controller. VolumeSnapshots of RBD PVCs then never
      # get a snapshot handle, and Velero's CSI backups wait on them until they
      # time out. cephfs already defaults to volumeSnapshot.
      snapshotPolicy: volumeSnapshot
    cephfs:
      name: rook-ceph.cephfs.csi.ceph.com
    nfs:
      enabled: false
      name: rook-ceph.nfs.csi.ceph.com
    nvmeof:
      enabled: false
      name: rook-ceph.nvmeof.csi.ceph.com
