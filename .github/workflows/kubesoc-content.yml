name: kubesoc content

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      # The whole stack is one directory now, so one filter covers the umbrella
      # and every component beside it.
      - 'argocd-helm-charts/kubesoc/**'
      - '.github/workflows/kubesoc-content.yml'
  push:
    branches:
      - master
    paths:
      - 'argocd-helm-charts/kubesoc/charts/kubesoc-content/**'
      - '.github/workflows/kubesoc-content.yml'

permissions:
  contents: read

concurrency:
  group: kubesoc-content-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONTENT: argocd-helm-charts/kubesoc/charts/kubesoc-content

jobs:
  lint:
    name: XML, lists and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install xmllint
        run: sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
      - name: Lint the content package
        run: ${CONTENT}/tests/lint.sh

  logtest:
    name: wazuh-logtest fixtures
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Replay fixtures in wazuh/wazuh-manager:4.14.3
        env:
          WAZUH_IMAGE: wazuh/wazuh-manager:4.14.3
        run: ${CONTENT}/tests/logtest.sh

  velociraptor:
    name: velociraptor artifacts verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify every artifact the reconciler sets
        env:
          VELOCIRAPTOR_IMAGE: ghcr.io/maximewewer/velociraptor:0.77.1-distroless
        run: ${CONTENT}/tests/velociraptor_verify.sh

  pytest:
    name: SOC scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: wazuh-cdb-export.py, custom-iris.py, ai-triage.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          argocd-helm-charts/kubesoc/charts/misp/tests
          argocd-helm-charts/kubesoc/charts/wazuh/tests
          argocd-helm-charts/kubesoc/charts/dfir-iris/tests

  render:
    name: Chart render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5
        with:
          version: 'v3.21.3'
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: kubesoc-content
        run: ${CONTENT}/tests/render_test.sh
      - name: wazuh (tenant mode)
        run: argocd-helm-charts/kubesoc/charts/wazuh/tests/tenant_render_test.sh
      - name: kubesoc umbrella
        run: argocd-helm-charts/kubesoc/tests/render_test.sh
      - name: kubesoc-portal
        run: argocd-helm-charts/kubesoc/charts/kubesoc-portal/tests/render_test.sh
      - name: wazuh (hardening)
        run: argocd-helm-charts/kubesoc/charts/wazuh/tests/hardening_render_test.sh
      # The components moved under kubesoc/charts/, where bin/verify-helm-chart.sh
      # skips them as subcharts of the umbrella. They are still deployed on their
      # own (every tenant Wazuh is its own release), so keep templating each with
      # its default values, which is what the repository-wide gate used to do.
      - name: components render with their own defaults
        run: ./bin/verify-helm-chart.sh ./argocd-helm-charts/kubesoc/charts/*
