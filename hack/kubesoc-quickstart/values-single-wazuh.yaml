# Single-node ("single" profile) overrides of a tenant's wazuh release for the
# kubesoc quickstart (hack/kubesoc-quickstart.sh). Evaluation sizing only.
wazuh:
  indexer:
    storageSize: 10Gi
    env:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m -Dlog4j2.formatMsgNoLookups=true"
    pdb:
      enabled: false
  wazuh:
    master:
      storageSize: 5Gi
